[package]
name = "blaze-fuzzer"
description = "Coverage-guided fuzzing of every parser of untrusted bytes in blaze: the engine, and one target binary per parser"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

# One binary per target; `targets/{cas_shared,hir_shared,hir_expr_shared,syntax_shared}.rs`
# are modules of their targets.
