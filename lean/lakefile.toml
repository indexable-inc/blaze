# blaze's Lean side (docs/v2/plan/design/formal-verification.md): the library the models are
# written against, the checked-in models the golden tests hold to the translator's output, and
# the proofs that live beside each crate's `src/`. No dependency: core Lean only.
name = "blaze"
defaultTargets = ["Blaze", "BlazeModel", "BlazeMir", "BlazeGraph"]

# The library (`Blaze.Result`, `Blaze.Scalar`, `Blaze.Slice`, `Blaze.Std`), the semantics of MIR
# (`Blaze.Mir.*`: syntax, values, `step`, `run`, the proved passes) and their tests.
[[lean_lib]]
name = "Blaze"
globs = ["Blaze.*"]

# Models as `hir-ty-lean` emits them, one module per function, byte for byte (the golden tests
# of crates/hir-ty-lean compare them).
[[lean_lib]]
name = "BlazeModel"
globs = ["BlazeModel.+"]

# MIR bodies as `hir-ty-lean`'s encoder writes them (`embed.rs`), one module per function, byte
# for byte (the golden tests compare them): terms of `Blaze.Mir.Program`.
[[lean_lib]]
name = "BlazeMir"
globs = ["BlazeMir.+"]

# blaze-graph's proofs, beside its `src/`.
[[lean_lib]]
name = "BlazeGraph"
srcDir = "../crates/blaze-graph/lean"
globs = ["BlazeGraph.+"]

# The compiled model of `blaze_graph::ledger::fnv1a_from`, for harness/v2/lean_differential.py.
[[lean_exe]]
name = "fnv1a_model"
root = "Blaze.Tests.Fnv1aMain"

# The semantics of MIR over the embedded golden bodies, for harness/v2/mir_semantics.py.
[[lean_exe]]
name = "mir_run"
root = "Blaze.Mir.Main"
