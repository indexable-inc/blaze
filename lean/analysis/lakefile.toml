# blaze's proofs that need real analysis (docs/v2/plan/design/formal-verification.md,
# "Derivatives"): a package of its own, so `lean/` stays core Lean only and builds as fast as
# before. It reuses `lean/`'s library by path (`Blaze.Scalar` is the `i32` of a `powi` exponent)
# and takes Mathlib at the commit its tag `v4.35.0` names, the Mathlib built for the pinned Lean
# (lean-toolchain here equals lean/lean-toolchain). Build: `lake exe cache get` (Mathlib's
# prebuilt oleans; never compile Mathlib), then `lake build`.
name = "blazeAnalysis"
defaultTargets = ["BlazeDiff"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[require]]
name = "blaze"
path = ".."

# blaze-diff's symbolic differentiator and simplifier, over the reals. `Ops.lean`, `Rules.lean`
# and `Rewrites.lean` are generated from crates/blaze-diff/rules.json by
# scripts/src/bin/diff_rules.rs, as the crate's Rust tables are.
[[lean_lib]]
name = "BlazeDiff"
# Mathlib is on Lean's module system and `lean/` is not yet; a module cannot import a file
# that is not one, so these files stay as they are and say so.
allowNonModules = true
