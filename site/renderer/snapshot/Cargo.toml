[package]
name = "site-snapshot"
description = "The build's step from content/*.flecs (and the HTML the TS build baked) to the snapshot, as a wasm module with a small C ABI: Flecs's C inside, no imports."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
site-render = { workspace = true, features = ["scripts"] }
serde.workspace = true
serde_json.workspace = true
