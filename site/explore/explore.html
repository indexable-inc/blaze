<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>explore · blaze</title>
	<link rel="stylesheet" href="explore/explore.css" />
</head>
<body>
	<header class="topbar">
		<div class="top-left">
			<div class="brand">
				<svg class="ico ico-fire" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
				<strong>blaze</strong>
				<span class="brand-sep">/</span>
				<span class="brand-sub">explore</span>
			</div>

			<div class="proc-picker">
				<span class="dot" id="conn-dot"></span>
				<select id="proc-select" aria-label="Active process"></select>
			</div>

			<div class="inline-metrics" id="inline-metrics"></div>
		</div>

		<div class="controls">
			<span class="gpu-chip" id="gpu-chip">GPU</span>
			<button class="btn" id="btn-zoom-in" type="button" title="Zoom in">
				<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>
			</button>
			<button class="btn" id="btn-zoom-out" type="button" title="Zoom out">
				<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M8 11h6"/></svg>
			</button>
			<button class="btn" id="btn-pause" type="button" title="Pause">
				<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
				<span id="pause-label">Pause</span>
			</button>
			<button class="btn" id="btn-clear" type="button" title="Clear">
				<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
			</button>
		</div>
	</header>

	<div class="workspace" id="workspace">
		<section class="trace-hero" id="trace-hero">
			<div class="ruler-bar">
				<div class="ruler-corner" id="gpu-span-label">3.5 s</div>
				<div class="gpu-ruler" id="gpu-ruler"></div>
			</div>
			<div class="trace-stage">
				<canvas id="gpu-canvas"></canvas>
				<canvas id="gpu-labels"></canvas>
				<div class="gpu-tooltip" id="gpu-tooltip" hidden></div>
				<button class="gpu-follow" id="btn-follow" type="button" hidden>Follow live ↵</button>
			</div>
		</section>

		<div class="splitter" id="splitter" title="Drag to resize timeline"></div>

		<section class="drawer" id="drawer">
			<nav class="tabs" role="tablist">
				<button class="tab active" data-tab="flame" type="button">
					<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
					Flame Graph
				</button>
				<button class="tab" data-tab="spans" type="button">
					<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
					Hot Spots
				</button>
				<button class="tab" data-tab="heap" type="button">
					<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
					Heap &amp; Diff
				</button>
				<button class="tab" data-tab="builds" type="button">
					<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
					Builds
				</button>
				<button class="tab" data-tab="advisor" type="button">
					<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
					Advisor <span class="tab-count" id="badge-advisor">0</span>
				</button>
				<button class="tab" data-tab="io" type="button">
					<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
					I/O &amp; Locks
				</button>

				<span class="sel-pill" id="sel-pill" hidden>
					<span id="sel-label"></span>
					<button type="button" id="btn-clear-sel">×</button>
				</span>
				<span class="conn-mini" id="conn-label">connecting</span>
			</nav>

			<section class="panel active panel-flame" id="panel-flame">
				<div class="subbar">
					<div class="seg">
						<button type="button" id="fg-topdown" class="active">Top-Down</button>
						<button type="button" id="fg-bottomup">Bottom-Up</button>
					</div>
					<input class="search-in" id="fg-search" type="search" placeholder="Filter symbols…" />
					<span class="mono muted-sm" id="fg-status"></span>
					<button class="btn" id="fg-reset" type="button" hidden>Reset zoom</button>
				</div>
				<div class="flame-stage">
					<canvas id="flame-canvas"></canvas>
					<div class="gpu-tooltip" id="flame-tooltip" hidden></div>
				</div>
			</section>

			<section class="panel" id="panel-spans">
				<div class="ref-box">
					<table class="grid">
						<thead>
							<tr>
								<th>Symbol</th>
								<th>Calls</th>
								<th>Self</th>
								<th>Total</th>
								<th>Share</th>
								<th>P50</th>
								<th>P95</th>
								<th>P99</th>
								<th>Max</th>
								<th>Hook</th>
							</tr>
						</thead>
						<tbody id="spans-body"></tbody>
					</table>
				</div>
			</section>

			<section class="panel" id="panel-heap">
				<div class="subbar">
					<button class="btn" id="btn-heap-snap" type="button">
						<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
						Take Snapshot
					</button>
					<button class="btn" id="btn-heap-clear-snap" type="button" hidden>Clear Baseline</button>
					<span class="mono muted-sm" id="heap-snap-label">Live heap tracking</span>
				</div>
				<div class="ref-box">
					<table class="grid">
						<thead>
							<tr>
								<th>Caller Stack (3 frames)</th>
								<th>Allocs</th>
								<th>Frees</th>
								<th>Cumulative</th>
								<th>Retained</th>
								<th>Δ Snapshot</th>
								<th>Share</th>
							</tr>
						</thead>
						<tbody id="heap-body"></tbody>
					</table>
				</div>
			</section>

			<section class="panel" id="panel-builds">
				<div id="builds-view" class="builds-grid"></div>
			</section>

			<section class="panel" id="panel-advisor">
				<div id="advisor-view"></div>
			</section>

			<section class="panel" id="panel-io">
				<div class="ref-box">
					<table class="grid">
						<thead>
							<tr>
								<th>Kind</th>
								<th>Thread</th>
								<th>Op</th>
								<th>Duration</th>
								<th>Args</th>
							</tr>
						</thead>
						<tbody id="io-body"></tbody>
					</table>
				</div>
			</section>
		</section>
	</div>

	<script type="module" src="explore/explore.js"></script>
</body>
</html>
