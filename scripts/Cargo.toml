[package]
name = "scripts"
description = "The repository's scripts, one binary each (src/bin/<name>.rs), built and run by the pinned released blaze: `blaze run -p scripts --bin <name> -- '<json>'` (docs/v2/plan/design/scripts.md)"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# Every file of src/bin is a script, a binary cargo finds by its name; `selftest` is its test.

[dependencies]
blaze-script.workspace = true
# The workspace's one SHA-256, with no dependencies: `smoke` names the binary it ran by its hash.
blaze-sha256.workspace = true
# `unicode-case` for `(?i)` as Python's `re.IGNORECASE` folds (crates/blaze-script/Cargo.toml).
regex = { workspace = true, features = ["unicode-case"] }
serde_json = { workspace = true, features = ["preserve_order"] }
toml = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
