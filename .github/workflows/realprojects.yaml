# blaze's verdict on real code (AGENTS.md rule verify-on-real-projects): every workspace of
# harness/v2/corpus.json built with `blaze build --workspace --all-targets` and tested with
# `blaze test --workspace`, each judged by its own tests, by harness/v2/realprojects.py. No
# rustc and no cargo: the projects are fetched by git and built by the release of blaze
# .github/blaze-version names (.github/actions/blaze, stage 0). Scheduled, never per pull request.
#
#   gh workflow run realprojects.yaml                                   every workspace
#   gh workflow run realprojects.yaml -f projects='["ripgrep", "tokio"]'
#
# One job per workspace, then `report`, which merges their results into one report (the step
# summary and the `realprojects` artifact) and says what newly broke or got fixed against the
# last scheduled run's result, kept in the actions cache. Only a scheduled run, which runs every
# workspace, moves that baseline. `report` fails when the harness could not finish a workspace
# or something newly broke; a workspace's own failures are blaze bugs the report lists.
name: realprojects
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      projects:
        description: the workspaces of corpus.json, as a JSON list; empty for all
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        env:
          PROJECTS: ${{ inputs.projects }}
        run: |
          if [ -n "$PROJECTS" ]; then
            echo "projects=$(echo "$PROJECTS" | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "projects=$(jq -c '[.workspaces[].name]' harness/v2/corpus.json)" >> "$GITHUB_OUTPUT"
          fi

  project:
    needs: plan
    name: ${{ matrix.project }}
    runs-on: ubuntu-24.04
    # A hosted runner's limit; bevy, polars and wasmtime may need a larger runner.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/blaze
        with:
          job: realprojects-${{ matrix.project }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # bevy's build scripts find ALSA, udev, Wayland and xkbcommon by pkg-config.
      - if: matrix.project == 'bevy'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: realprojects.py run
        env:
          PROJECT: ${{ matrix.project }}
          RUST_BACKTRACE: "0"
        run: |
          input=$(jq -cn --arg p "$PROJECT" --arg out "$RUNNER_TEMP/out" \
            --arg sources "$RUNNER_TEMP/sources" '{out: $out, projects: [$p], jobs: 1, sources: $sources}')
          uv run --frozen --no-dev python harness/v2/realprojects.py run "$input"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.project }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

  report:
    needs: project
    if: always() && needs.project.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results
      # One path for the restore and the save: the cache scopes its keys by path. The merge reads
      # the baseline before it writes the next one there.
      - uses: actions/cache/restore@v6
        with:
          path: .realprojects-baseline
          key: realprojects-baseline-${{ github.run_id }}
          restore-keys: realprojects-baseline-
      - name: realprojects.py merge
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          results=$(find "$RUNNER_TEMP/results" -name result.json | sort | jq -Rsc 'split("\n") | map(select(. != ""))')
          baseline="$GITHUB_WORKSPACE/.realprojects-baseline/result.json"
          next=""
          [ "$SCHEDULED" = true ] && next="$baseline"
          [ -f "$baseline" ] || baseline=""
          input=$(jq -cn --argjson r "$results" --arg out "$RUNNER_TEMP/realprojects" --arg b "$baseline" --arg n "$next" \
            '{results: $r, out: $out, baseline: $b, write_baseline: $n}')
          status=0
          uv run --frozen --no-dev python harness/v2/realprojects.py merge "$input" || status=$?
          cat "$RUNNER_TEMP/realprojects/report.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: realprojects
          path: ${{ runner.temp }}/realprojects
          if-no-files-found: ignore
      - if: always() && github.event_name == 'schedule' && hashFiles('.realprojects-baseline/result.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .realprojects-baseline
          key: realprojects-baseline-${{ github.run_id }}
