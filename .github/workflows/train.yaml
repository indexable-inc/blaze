# The release train: everything the merge gate (blaze.yaml) leaves out, on main after the merge,
# and a release of main when it is all green. What runs where, and how long it takes, is in
# docs/harness.md ("CI").
#
#   every harness of harness/ci.py's full tier, on Linux x86-64, Linux AArch64, macOS arm64 and
#       Windows x86-64, under both producers; Bun's fixtures, rustc's borrow-check tests and the
#       pinned run-pass tests (Linux x86-64; those on macOS too); `blaze` on
#       small projects (Linux x86-64, macOS) and the larger ones (AArch64); harness/wasm32.py,
#       programs built for wasm32 and run under wasmtime (Linux x86-64); and the ripgrep
#       bench (not blocking). nix-live.yaml (the flake's builds, the demo and live edits on macOS)
#       runs on the same pushes in a workflow of its own: a cold nix build takes up to two hours,
#       and in the train's run it held main's next train that long
#   green: when main has changes since the last release, a commit `release: v0.YYYYMMDD.N`
#       (the version of today's next release, N from 0, and a CHANGELOG.md section of what was
#       merged) and the pgo workflow, whose pin job tags v0.YYYYMMDD.N when the profiles are
#       trained, which runs release.yaml (.github/scripts/train_release.py)
#   red: one issue, "Release train is red", opened or added to with the jobs that failed and the
#       commits since the last green train; the next green train closes it
#
# When it runs on pushes to main (off for now, see `on:`), one train runs at a time; a push while it runs waits, and a
# newer push replaces the one waiting, so the train runs on the newest commit of main as soon
# as the one before is done. A run cancelled by each push (`cancel-in-progress`) would never end
# while main takes a merge every few minutes, and a train takes about 45. The group is per ref:
# a train run by hand on a branch (contributing.md: before landing what the fast tier does not
# cover) neither waits behind main's nor takes the place of main's waiting one.
name: train
# By hand only for now (2026-10-27): on every push it never finished (a run waited hours on
# nushell while every newer one was cancelled) and was red for reasons the merge gate (`ci`)
# does not share. Releases are cut by hand until it is turned back on.
on:
  workflow_dispatch:

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: windows x64
    uses: ./.github/workflows/blaze-platform.yaml
    with:
      platform: windows-x64
      os: windows-2025
      tier: full

  # The train's verdict: every job above.
