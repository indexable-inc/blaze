name: pgo

# Trains the profiles blaze is optimized with (PGO), each on the runner its release binary is
# built on, and pins them: the files go to the `pgo-profiles` release under names that carry
# their sha256, and a commit to main writes those names and hashes into tools/pgo/profiles.json, which
# the release workflow and the flake build with (.github/scripts/build_release.py).
#
# It runs by itself when what the crates are changes (Cargo.lock, a manifest, the toolchain, the
# release recipe's features or the LLVM it links):
# a profile finds a function by its symbol, which carries a hash of the whole graph of crates,
# so after such a change the old profile finds almost nothing. Run it by hand when a build says
# that many functions changed since the profile was trained, and before a release after large
# changes to the code. A release's version is not committed (Cargo.toml stays `0.0.0`, and the
# release is told only to blaze-engine's build, by `BLAZE_RELEASE`), so a release does not make a
# profile stale.
# PGO is off for now: releases build with `--no-pgo` (release.yaml), so this runs by hand only. To turn it back on, restore the push trigger:
#   push: { branches: [main], paths: [Cargo.lock, "**/Cargo.toml", harness/toolchain,
#           .github/scripts/build_release.py, crates/hir-ty-codegen/llvm.json] }
on:
  workflow_dispatch:

# A push replaces the run of the push before it, never a run by hand.
concurrency:
  group: pgo-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  train:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # The instrumented build of blaze and the training.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7
      # llvm-tools: llvm-profdata, which merges what the instrumented build counted. The daemon
      # being trained reads the standard library from blaze's library/, not from a rust-src.
      - run: tc=$(cat harness/toolchain) && rustup toolchain install "$tc" --profile minimal --component llvm-tools && rustup default "$tc"
      # lld links the instrumented AArch64 blaze, whose code is past a direct call's reach for GNU ld
      # (build_release.py, `train`).
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update -q && sudo apt-get install -yq lld && ld.lld --version
      - run: python3 .github/scripts/build_release.py --target ${{ matrix.target }} --train "$RUNNER_TEMP/pgo"
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
      - uses: actions/upload-artifact@v7
        with:
          name: pgo-${{ matrix.target }}
          path: ${{ runner.temp }}/pgo
          if-no-files-found: error

  pin:
    name: pin
    needs: train
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The ruleset on main refuses a push from the workflow's own token: this one is allowed
          # past it (docs/harness.md, "CI").
          token: ${{ secrets.BLAZE_BOT_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: pgo-*
          path: ${{ runner.temp }}/pgo
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pgo-profiles --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create pgo-profiles --repo "$GITHUB_REPOSITORY" --prerelease --title "PGO profiles" \
              --notes "The profiles blaze's builds are optimized with, one file per toolchain, target and content (tools/pgo/profiles.json pins them by sha256). Not a release of blaze."
          gh release upload pgo-profiles --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/pgo/*/*.profdata --clobber
      - name: Pin
        run: |
          python3 .github/scripts/build_release.py --pin "$RUNNER_TEMP"/pgo/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pgo/profiles.json
          git commit -m "pgo: profiles trained at ${GITHUB_SHA::10} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
