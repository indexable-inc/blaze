name: pgo

# Trains the profiles blaze is optimized with (PGO, and BOLT on ELF), each on the runner its
# release binary is built on, and pins them: tools/pgo/pgo.py builds blaze instrumented with the
# stage-0 blaze (.github/blaze-version; blaze builds blaze, never cargo or rustc), trains it on
# tools/pgo/training.json, and `pgo.py publish` puts the files on the `pgo-profiles` release
# under names that carry their sha256 and writes them into tools/pgo/profiles.json, which the
# release workflow builds with (.github/scripts/build_release.py, `"pgo": "pinned"`).
#
# Today every train job stops at its first build with blaze's own error: blaze refuses
# `-C profile-generate`, since its linker writes no profile sections yet
# (crates/blaze-cargo/src/serve/unit/codegen.rs, `pgo`). Until it does, releases build with
# `"pgo": "off"`.
#
# It runs by itself when what the crates are changes (Cargo.lock, a manifest, the toolchain, the
# release recipe's features or the LLVM it links):
# a profile finds a function by its symbol, which carries a hash of the whole graph of crates,
# so after such a change the old profile finds almost nothing. Run it by hand when a build says
# that many functions changed since the profile was trained, and before a release after large
# changes to the code. A release's version is not committed (Cargo.toml stays `0.0.0`, and the
# release is told only to blaze-engine's build, by `BLAZE_RELEASE`), so a release does not make a
# profile stale.
# PGO is off for now: releases build with `"pgo": "off"` (release.yaml), so this runs by hand only. To turn it back on, restore the push trigger:
#   push: { branches: [main], paths: [Cargo.lock, "**/Cargo.toml", harness/toolchain,
#           tools/pgo/**, crates/hir-ty-codegen/llvm.json] }
on:
  workflow_dispatch:

# A push replaces the run of the push before it, never a run by hand.
concurrency:
  group: pgo-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  # blaze's whole machine: no one sits at a CI runner (docs/cargo.md, "Cores and priority").
  BLAZE_CORES: all
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  train:
    name: ${{ matrix.target }}
    # Linux on ix, as every job that runs blaze: blaze refuses a kernel below Linux 7.2
    # (docs/kernel.md), and GitHub's hosted Ubuntu runners boot 6.8 to 6.11. A profile is trained
    # on a build like the release's, so it links against the same Ubuntu 22.04 glibc sysroot
    # (.github/scripts/sysroot.py; the ix image's own glibc is 24.04's 2.39), on a cold runner
    # as release.yaml's build is. TODO(x86-64): no x86_64-unknown-linux-gnu profile until ix has
    # x86-64 runners (docs/harness.md "ix runners"): training runs the instrumented blaze, which
    # an arm64 runner cannot, so its entry in tools/pgo/profiles.json stays as last trained.
    runs-on: ${{ matrix.runner }}
    # Three builds of blaze (instrumented, with the profile, plain for the baseline), each bounded
    # at two hours by pgo.py, the training and the measuring: the hosted runner's cap.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15, linux: false }
          - { target: aarch64-unknown-linux-gnu, runner: [ix, arm64, ix-cpu-64, ix-mode-cold], linux: true }
    env:
      # BOLT rewrites ELF alone: pgo.py refuses an ELF target that asks for none and a Mach-O one
      # that asks for it.
      BOLT: ${{ matrix.linux && 'instrument' || 'none' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: ${{ matrix.linux && '4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403' || '' }} # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      # Ubuntu 22.04's glibc and the C and C++ drivers' words that build against it, before
      # blaze's daemon first starts: it reads them when it starts.
      - if: matrix.linux
        name: glibc 2.35 sysroot (Ubuntu 22.04)
        run: |
          sudo mkdir -p /usr/local/lib/blaze-sysroot
          sudo chown "$(id -u):$(id -g)" /usr/local/lib/blaze-sysroot
          jq -n --arg target "${{ matrix.target }}" --arg env "$GITHUB_ENV" \
            '{target: $target, dir: "/usr/local/lib/blaze-sysroot/\($target)", github_env: $env}' > "$RUNNER_TEMP/sysroot.json"
          uv run --frozen --no-dev python .github/scripts/sysroot.py "$RUNNER_TEMP/sysroot.json"
      # The builder: the stage 0 .github/blaze-version names, with its own Rust; pgo.py fetches the
      # pinned LLVM itself (llvm-profdata, llvm-bolt among it).
      - uses: ./.github/actions/blaze
        with:
          job: pgo
      - name: pgo.py build
        run: |
          jq -n --arg target "${{ matrix.target }}" --arg builder "$(command -v blaze)" \
            --arg out "$RUNNER_TEMP/pgo/${{ matrix.target }}" --arg bolt "$BOLT" \
            '{kind: "build", target: $target, builder: $builder, out: $out, bolt: $bolt}' > "$RUNNER_TEMP/pgo.json"
          uv run --frozen python tools/pgo/pgo.py "$RUNNER_TEMP/pgo.json"
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
      - uses: actions/upload-artifact@v7
        with:
          name: pgo-${{ matrix.target }}
          path: ${{ runner.temp }}/pgo
          if-no-files-found: error
      # Why the daemon ended, when it did (the client does not say).
      - if: failure()
        uses: ./.github/actions/daemon-log

  pin:
    name: pin
    needs: train
    if: github.ref == 'refs/heads/main'
    runs-on: [ix, arm64, ix-mode-cold]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The ruleset on main refuses a push from the workflow's own token: this one is allowed
          # past it (docs/harness.md, "CI").
          token: ${{ secrets.BLAZE_BOT_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: pgo-*
          path: ${{ runner.temp }}/pgo
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      # Each file each <target>.json names, checked by its sha256, uploaded to the release
      # tools/pgo/profiles.json names, and written into it.
      - name: Upload and pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pgo-profiles --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create pgo-profiles --repo "$GITHUB_REPOSITORY" --prerelease --title "PGO profiles" \
              --notes "The profiles blaze's builds are optimized with, one file per toolchain, target and content (tools/pgo/profiles.json pins them by sha256). Not a release of blaze."
          dirs=$(find "$RUNNER_TEMP/pgo" -mindepth 2 -maxdepth 2 -type d | jq -R . | jq -sc .)
          uv run --frozen python tools/pgo/pgo.py "{\"kind\": \"publish\", \"dirs\": $dirs}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pgo/profiles.json
          git commit -m "pgo: profiles trained at ${GITHUB_SHA::10} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
