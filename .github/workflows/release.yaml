name: release

# A tag `v0.YYYYMMDD.N` (a dated version, .github/scripts/train_release.py) builds blaze for
# Linux (x86_64, aarch64) and macOS (aarch64) and makes a GitHub release of that name: a `.tar.xz` and a `.tar.gz` per target (`blaze` a hard link to `blaze-engine`), a `.sha256` of each, SHA256SUMS and B3SUMS (a pin's fetch checks every list a release has, crates/blaze-engine/src/versions.rs),
# the standard library's source `library-<digest>.tar.xz` (docs/toolchain.md), and the
# notes (what docs/CHANGELOG.md's [Unreleased] gained and what was merged since the release before). The release is a prerelease, the canary channel's,
# until promote.yaml makes it stable (docs/release.md). Every tag (canary.yaml's, train_release.py's)
# is on a commit of main as it is: no release commits a version to main, whose Cargo.toml stays
# at `0.0.0`. The build is told which release it is by `BLAZE_RELEASE`, the tag, which only
# crates/blaze-engine/build.rs reads, so a release changes no other crate and no build of main
# misses blaze's store after it. The notes are .github/scripts/canary.py notes's. A tag pushed by
# hand starts it; the trains' and canary.yaml's tags start it by dispatch on the tag, since a tag
# the workflow's own token makes starts no workflow. A manual run on a branch builds and checks
# the same archives without releasing, as `0.0.0-dev`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # blaze's whole machine: no one sits at a CI runner (docs/cargo.md, "Cores and priority").
  BLAZE_CORES: all
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  notes:
    name: version and notes
    runs-on: [ix, arm64]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # On a tag: its version, and what changed since the release before. On a branch: the
      # tree's `0.0.0-dev`, and notes that say it is no release.
      - id: notes
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          jq -n --arg tag "$TAG" --arg notes "$RUNNER_TEMP/notes.md" '{tag: $tag, notes: $notes}' > "$RUNNER_TEMP/notes.json"
          python3 -I .github/scripts/canary.py notes "$RUNNER_TEMP/notes.json"
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
      # library/, which a blaze with no checkout of its commit downloads once and checks
      # against its digest (crates/blaze-cargo/src/cargo/toolchain/library.rs). The digest is
      # BLAKE3, by the uv workspace's `blake3` (the Rust crate through PyO3): no system package.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      - run: |
          uv run --frozen python harness/library.py archive "{\"out\": \"$RUNNER_TEMP/library\"}"
      - uses: actions/upload-artifact@v7
        with:
          name: library
          path: ${{ runner.temp }}/library/library-*.tar.xz
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: notes
    # Linux on ix, as every job that runs blaze: blaze refuses a kernel below Linux 7.2
    # (docs/kernel.md), and GitHub's hosted Ubuntu runners boot 6.8 to 6.11. The ix image is
    # Ubuntu 24.04, whose glibc is 2.39, so the build links against Ubuntu 22.04's glibc 2.35
    # (.github/scripts/sysroot.py), and the binaries ask for no newer glibc than RHEL 9's 2.34
    # (build_release.py refuses one that does). ix has no x86-64 runners, so x86-64 is
    # cross-compiled on arm64 and not run, as blaze.yaml's `linux-x64-cross` is (docs/harness.md
    # "ix runners"). Cold runners: a release's binaries come from a machine no earlier job touched.
    runs-on: ${{ matrix.runner }}
    # A store blaze's release has not compiled into, which a release's always is: about 97
    # minutes on a hosted Linux x86-64 runner when it built there, and longer on macOS's 7 GB
    # runner (blaze-platform.yaml's build), under the hosted runner's 6-hour cap.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15, linux: false, cross: false }
          - { target: x86_64-unknown-linux-gnu, runner: [ix, arm64, ix-cpu-64, ix-mode-cold], linux: true, cross: true }
          - { target: aarch64-unknown-linux-gnu, runner: [ix, arm64, ix-cpu-64, ix-mode-cold], linux: true, cross: false }
    env:
      # `cargo binstall` and install.sh find the archive and its binaries by this name
      # ([package.metadata.binstall] in crates/blaze-engine/Cargo.toml).
      NAME: blaze-v${{ needs.notes.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      # xz for the archive (the ix image may lack it); for x86-64, Ubuntu's x86-64 cross GCC
      # (the C driver, and the C++ one LLVM's wrappers compile with) and qemu-user, which runs
      # the x86-64 `llvm-config` llvm-sys's build script asks and the `--version` below.
      - if: matrix.linux
        uses: ./.github/actions/apt
        with:
          packages: ${{ matrix.cross && 'xz-utils gcc-x86-64-linux-gnu g++-x86-64-linux-gnu qemu-user-static binfmt-support' || 'xz-utils' }}
      # The cross GCC's own glibc (Ubuntu 24.04's 2.39, in /usr/x86_64-linux-gnu/include and
      # lib) is searched before any sysroot's, so it goes: the C library is the sysroot's alone.
      # The runtime (libc6-amd64-cross, libstdc++6-amd64-cross) stays, for qemu-user.
      - if: matrix.cross
        name: x86-64 cross GCC without its own glibc headers, qemu-user runs x86-64 programs
        run: |
          sudo dpkg --remove --force-depends libc6-dev-amd64-cross linux-libc-dev-amd64-cross
          sudo systemctl restart systemd-binfmt || sudo update-binfmts --enable qemu-x86_64
          test -e /proc/sys/fs/binfmt_misc/qemu-x86_64 || { echo "::error::binfmt_misc has no qemu-x86_64 entry: the x86-64 llvm-config cannot run"; exit 1; }
          echo "QEMU_LD_PREFIX=/usr/x86_64-linux-gnu" >> "$GITHUB_ENV"
      # build_release.py and sysroot.py run in the repository's Python workspace (typed_input).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: ${{ matrix.linux && '4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403' || '' }} # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      # Ubuntu 22.04's glibc for the target, and the C and C++ drivers' words that build against
      # it (CC_<triple>, CXX_<triple>, CFLAGS_<triple>, CXXFLAGS_<triple>), before blaze's daemon
      # first starts: it reads them when it starts.
      - if: matrix.linux
        name: glibc 2.35 sysroot (Ubuntu 22.04)
        run: |
          sudo mkdir -p /usr/local/lib/blaze-sysroot
          sudo chown "$(id -u):$(id -g)" /usr/local/lib/blaze-sysroot
          jq -n --arg target "${{ matrix.target }}" --arg env "$GITHUB_ENV" \
            '{target: $target, dir: "/usr/local/lib/blaze-sysroot/\($target)", github_env: $env}' > "$RUNNER_TEMP/sysroot.json"
          uv run --frozen --no-dev python .github/scripts/sysroot.py "$RUNNER_TEMP/sysroot.json"
      # blaze builds blaze (AGENTS.md rule blaze-builds-blaze): the stage 0 .github/blaze-version
      # names, with its own Rust, and the pinned LLVM (LLVM_SYS_231_PREFIX), as blaze-platform.yaml's
      # build job has them; no rustup, no cargo, no Nix. The store's project is this job's own and
      # nothing pushes it, so it pulls nothing: a release's binaries come from a clean build.
      - id: blaze
        uses: ./.github/actions/blaze
        with:
          job: release
          llvm: ${{ !matrix.cross }}
      # The target's archive of the pinned LLVM, where the action fetches the host's.
      - if: matrix.cross
        name: LLVM for x86_64-unknown-linux-gnu (the pin)
        run: |
          prefix=/usr/local/lib/blaze-llvm/x86_64-unknown-linux-gnu
          sudo mkdir -p /usr/local/lib/blaze-llvm
          sudo chown "$(id -u):$(id -g)" /usr/local/lib/blaze-llvm
          python3 .github/scripts/llvm.py fetch --target x86_64-unknown-linux-gnu --dir "$prefix"
          "$prefix/bin/llvm-config" --version
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
      # `blaze --version` names the commit and its date (UTC), as rustc does:
      # `blaze 0.20261028.9 (fb82b09 2026-10-28)` (crates/blaze-engine/build.rs).
      - run: |
          echo "BLAZE_GIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BLAZE_GIT_DATE=$(TZ=UTC0 git show -s --date=format-local:%Y-%m-%d --format=%cd HEAD)" >> "$GITHUB_ENV"
      # Which release this is, the one place it is said: blaze-engine's build.rs makes it the
      # version `--version` prints and a pin names, and a release's builds fetch the standard
      # library from the release's assets (the step `Standard library` below; shipped.rs).
      - if: github.ref_type == 'tag'
        run: echo "BLAZE_RELEASE=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      # The `dist` profile, with LLVM, as every native blaze has (blaze-engine's default
      # `native`): build_release.py refuses a binary that loads libLLVM or a C++ runtime, or on
      # Linux asks for a glibc newer than RHEL 9's. PGO is off: blaze applies only a profile
      # trained on its own build (tools/pgo/pgo.py), which it cannot make while it refuses
      # `-C profile-generate`; `"pgo": "pinned"` stops with that error (build_release.py).
      - name: blaze build -p blaze-engine --profile dist
        run: |
          uv run --frozen --no-dev python .github/scripts/build_release.py \
            '{"target": "${{ matrix.target }}", "out": "shipped", "pgo": "off"}'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
      - name: Archive
        run: |
          mkdir "$NAME"
          cp LICENSE-APACHE LICENSE-MIT README.md docs/CHANGELOG.md "$NAME"
          cp shipped/* "$NAME"
          # `blaze` and `blaze-engine` are one program (both run blaze_engine::main, which
          # goes by neither name), linked twice: shipped once, as a hard link, which tar keeps,
          # so the archive holds one copy.
          ln -f "$NAME/blaze-engine" "$NAME/blaze"
          # x86-64's binaries, cross-compiled on arm64 (build_release.py checked they are x86-64
          # ELF), run here under qemu-user, through binfmt_misc with the cross runtime as
          # QEMU_LD_PREFIX, and only for `--version`: it starts no daemon and uses none of the
          # kernel features blaze's floor is for (docs/kernel.md), past the floor's uname check,
          # which qemu-user answers with the runner's own kernel.
          "$NAME/blaze-engine" --version | tee /dev/stderr | sed -n 1p | grep -E "^blaze ${{ needs.notes.outputs.version }} \([0-9a-f]{7}( [0-9]{4}-[0-9]{2}-[0-9]{2})?\)$"
          # `blaze` runs the one beside it.
          "$NAME/blaze" --version | grep -F "blaze ${{ needs.notes.outputs.version }} "
          # The `.tar.xz` is what blaze fetches for a pin, `blaze update` and install.sh, a
          # third of the `.tar.gz`; the `.tar.gz` stays for blazes from before, which fetch only
          # it. `-T0` splits it into blocks only past 192 MiB of input, which costs little.
          command -v xz >/dev/null || brew install xz
          tar cf - "$NAME" | xz -9e -T0 > "$NAME.tar.xz"
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.xz" > "$NAME.tar.xz.sha256"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          ls -l "$NAME.tar.xz" "$NAME.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.xz*
            ${{ env.NAME }}.tar.gz*
          if-no-files-found: error
      # Why the daemon ended, when it did (the client does not say).
      - if: failure()
        uses: ./.github/actions/daemon-log

  # blaze's crate and the forks it depends on (`blaze-hir`, `blaze-rustc_abi`, ...) on crates.io, as
  # its own job so it can be rerun alone: versions already published are skipped. Each crate is
  # built first; crates.io's limit on new crates is waited out (a first release takes hours).
  crates:
    name: crates.io
    needs: [notes, build]
    # Off: it would publish 60 permanent `blaze-*` names and `blaze`, both retired (#270);
    # whether and under which names blaze goes to crates.io is decided after the rename.
    if: false
    runs-on: [ix, arm64, ix-mode-cold]
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      # cargo here is crates.io's client alone (`cargo package --no-verify`, `cargo publish
      # --no-verify`); what the crates build to is checked by the stage 0's `blaze build`
      # (publish_crates.py, `verify`).
      - uses: ./.github/actions/blaze
        with:
          job: crates
          llvm: true
      - run: tc=$(cat harness/toolchain) && rustup toolchain install "$tc" --profile minimal && rustup default "$tc"
      # crates.io needs the manifests to say the release's version: written into this job's
      # checkout only, never committed (main's stays `0.0.0`).
      - run: |
          python3 -I .github/scripts/canary.py stamp "{\"tag\": \"$GITHUB_REF_NAME\"}"
      - run: python3 -I .github/scripts/publish_crates.py --publish --max-hours 5
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Why the daemon ended, when it did (the client does not say).
      - if: failure()
        uses: ./.github/actions/daemon-log

  # ix.dev/explore reads this release's profile schema (.github/scripts/explore_page.py): the
  # page deploys from indexable-inc/ix and refuses a daemon whose schema it does not read, so a
  # release ahead of it would show users only that refusal (0.20261105.1, schema 5, page 1).
  explore-page:
    name: ix.dev/explore reads this schema
    runs-on: [ix, arm64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      - run: uv run --frozen python .github/scripts/explore_page.py '{}'

  publish:
    name: GitHub release
    needs: [notes, build, explore-page]
    if: github.ref_type == 'tag'
    runs-on: [ix, arm64, ix-mode-cold]
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      # SHA256SUMS and B3SUMS, `<hex>  <name>` a line as sha256sum and b3sum write them; BLAKE3 is
      # the uv workspace's `blake3`, so the runner needs no system package for it.
      - name: Checksums
        run: |
          uv run --frozen python .github/scripts/checksums.py '{"dir": "out"}'

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # GitHub refuses a release body over 125,000 characters; the full section stays in docs/CHANGELOG.md.
          python3 - <<'EOF'
          import os
          p = "out/notes.md"; text = open(p).read(); cap = 120_000
          if len(text) > cap:
              url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/blob/{os.environ['GITHUB_REF_NAME']}/docs/CHANGELOG.md"
              text = text[: text.rfind("\n", 0, cap)] + f"\n\n... The full notes are in [docs/CHANGELOG.md]({url}).\n"
              open(p, "w").write(text)
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "blaze $GITHUB_REF_NAME" --notes-file out/notes.md \
            out/blaze-*.tar.xz out/blaze-*.tar.xz.sha256 out/blaze-*.tar.gz out/blaze-*.tar.gz.sha256 out/SHA256SUMS out/B3SUMS out/library-*.tar.xz
      # A canary: promote.yaml tests the archives just published and makes this same release
      # stable when they pass (docs/release.md). By dispatch, since a release this token
      # publishes starts no `release:` workflow. The canary pointer moves in `metadata`.
      - name: Promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote.yaml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"

  # The canary pointer (what a workspace pinned to canary reads) and latest.json (what every blaze
  # daemon reads every few minutes, docs/release.md, "latest.json") name this release.
  metadata:
    name: pointers and latest.json
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: [ix, arm64, ix-mode-cold]
    timeout-minutes: 10
    # One at a time across release.yaml, promote.yaml and yank.yaml: each writes the pointers and
    # latest.json from the releases as they are when it runs, so the last one to run is right. A
    # run the group cancels while it waits behind a newer one loses nothing.
    concurrency:
      group: release-metadata
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Only GH_TOKEN: the Cloudflare token reaches no script, only wrangler-action below.
      - name: pointers and latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash # -eo pipefail: a failing promote.py fails the step through the tee
        run: |
          python3 -I .github/scripts/promote.py metadata '{"out": "latest.json"}' | tee -a "$GITHUB_STEP_SUMMARY"
      # The token R2 takes latest.json with: Object Read & Write on the bucket blaze-releases
      # alone (docs/release.md, "latest.json"). Checked here, after the pointers moved, so a
      # missing secret fails the run without holding a release back.
      - name: the R2 token is set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::latest.json is not published: the secret CLOUDFLARE_R2_API_TOKEN is not set in $GITHUB_REPOSITORY's Actions secrets"
            exit 1
          fi
      - name: Publish latest.json
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put blaze-releases/latest.json --file=latest.json --content-type=application/json --cache-control=public,max-age=60 --remote
