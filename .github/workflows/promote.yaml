name: promote

# A canary release becomes stable (docs/release.md). release.yaml dispatches this when it has
# published a release as a prerelease (a release the workflow's own token publishes starts no
# `release:` workflow); a run by hand takes the tag again, after a flake or a fix to the gate
# itself. Against the archives the release published, installed with install.sh --version as a
# user installs them, on macOS (Apple silicon) and Linux (x86-64, ARM64): install checks, the
# whole smoke corpus (harness/smoke.py), and the train (train.yaml, every tier) on the tag. Each
# application of the corpus's `apps` group (cargo, zed, servo, bun, dynamo, fff, fframes, flox,
# codex) has two jobs of its own per platform: `works` (dev and release builds run, its tests
# pass under `blaze test`) and `speed`
# (bench.py: cold, no-op, every edit and the tests faster than cargo on the same runner, nothing
# otherwise than cargo's, and nothing more than 25% worse than the stable release's numbers, an
# asset of it). All green: the same release is marked stable and Latest, with a line in its notes
# saying when and after which run, and its numbers become its assets (.github/scripts/promote.py).
# And main's own tests: a canary is cut as soon as main's Linux x86-64 build of its commit passes
# (canary.yaml), before the unit tests, so stable also needs the merge gate's run on the push of
# that commit to main green, with the unit tests run and passed on Linux x86-64, Linux ARM64 and
# macOS (`main's tests`, promote.py tested). That job waits for the run while it is still going
# (at most five hours, beside the smoke corpus and the applications, which take longer); none,
# a red one, or one still going after that keeps the release a canary, with an issue.
# Any red: it stays a canary, and an issue says what failed and how to repeat it. Nothing is
# built again: a version names the same bytes before and after.
#
# A pull request changing the gate runs it against the newest release, without the train,
# without promoting and without an issue.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the release to test (v0.YYYYMMDD.N; empty: the newest)"
        default: ""
      promote:
        description: "mark it stable when every job passes"
        type: boolean
        default: true
      train-run:
        description: "a green train.yaml run on the tag to count instead of starting one (its id)"
        default: ""
      train:
        description: "run the train on the tag (a run without it promotes nothing)"
        type: boolean
        default: true
      apps:
        description: "the applications to test (comma separated; empty: every one of the corpus's `apps`)"
        default: ""
  pull_request:
    paths:
      - ".github/workflows/promote.yaml"
      - ".github/scripts/promote.py"
      - "harness/smoke.py"
      - "harness/smoke/**"

# One gate at a time: with a canary per built main, a run waiting is replaced by a newer
# canary's, so the gate tests the newest canary when it is free (an untested canary just stays
# a canary). A pull request's runs, and a dispatch on another branch (a check of the gate
# itself), are a group of their own, so they never hold a canary up.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'promote' || format('promote-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release:
    name: which release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      sha: ${{ steps.which.outputs.sha }}
      prerelease: ${{ steps.which.outputs.prerelease }}
      stable: ${{ steps.which.outputs.stable }}
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - id: which
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.tag }}
        run: |
          jq -n --arg tag "$WANTED" '{tag: $tag}' > "$RUNNER_TEMP/which.json"
          python3 -I .github/scripts/promote.py which "$RUNNER_TEMP/which.json"
          echo "stable=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
      - id: apps
        env:
          WANTED: ${{ inputs.apps }}
        run: |
          apps=$(jq -c --arg wanted "$WANTED" '[.projects | to_entries[] | select(.value.group == "apps") | .key] as $all
            | ($wanted | split(",") | map(gsub(" "; "")) | map(select(. != ""))) as $named
            | if ($named | length) == 0 then $all else $named end' harness/smoke/smoke.json)
          echo "apps=$apps" | tee -a "$GITHUB_OUTPUT"

  smoke:
    name: smoke (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    env:
      BLAZE_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: a CARGO_HOME of its own
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
      # Build scripts, proc macros and tests run in a sandbox made of namespaces a user makes,
      # which Ubuntu's AppArmor keeps users from making unless told otherwise.
      - name: user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # As a user installs it: the toolchain blaze downloads included.
      - name: install ${{ env.TAG }}
        run: sh install.sh --version "$TAG"
      - name: what it installed runs
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          blaze --version | tee /dev/stderr | grep -F "blaze ${TAG#v} "
          cd "$RUNNER_TEMP"
          blaze new --quiet hello
          cd hello
          blaze run | grep -Fx "Hello, world!"
          blaze stop
      - name: what the projects build with
        if: runner.os == 'Linux'
        run: |
          read -ra packages <<< "$(python3 -I harness/smoke.py apt)"
          if [ "${#packages[@]}" -gt 0 ]; then sudo apt-get update -qq && sudo apt-get install -y -qq "${packages[@]}"; fi
      - name: smoke corpus
        env:
          GH_TOKEN: ${{ secrets.BLAZE_BOT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the smoke corpus reads GitHub with the secret BLAZE_BOT_TOKEN, which this run does not have"
            exit 1
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          python3 -I harness/smoke.py "{\"blaze_rev\": \"${{ needs.release.outputs.sha }}\", \"work\": \"$RUNNER_TEMP/smoke\", \"results\": \"$RUNNER_TEMP/${{ matrix.os }}.json\"}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/${{ matrix.os }}.json
          if-no-files-found: ignore

  # The applications, each check of each on each platform a job: a build of one is hours on a
  # hosted runner. Not on a pull request, which runs the rest of the gate.
  apps:
    name: ${{ matrix.app }} ${{ matrix.check }} (${{ matrix.os }})
    needs: release
    if: github.event_name == 'workflow_dispatch' && needs.release.outputs.apps != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.release.outputs.apps) }}
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        check: [works, speed]
    env:
      BLAZE_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
      STABLE: ${{ needs.release.outputs.stable }}
      APP: ${{ matrix.app }}
      OS: ${{ matrix.os }}
      CHECK: ${{ matrix.check }}
      OUT: /tmp/gate-out
      # Short: on macOS the daemon's socket path has to fit in 104 bytes.
      WORK: /tmp/gate
    steps:
      - uses: actions/checkout@v7
      # An application's target directories are tens of GB: the runner's preinstalled SDKs go.
      - name: room on the disk
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h / /tmp
      # The pinned Rust, which bench.py's cargo builds with; user namespaces for `blaze test`.
      - uses: ./.github/actions/toolchain
      - name: a CARGO_HOME of its own
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          mkdir -p "$OUT" "$WORK"
      - name: install ${{ env.TAG }}
        run: sh install.sh --version "$TAG"
      - name: what ${{ matrix.app }} builds with
        run: |
          jq -n --arg app "$APP" '{groups: ["apps"], only: [$app]}' > "$RUNNER_TEMP/app.json"
          if [ "$RUNNER_OS" = Linux ]; then
            read -ra packages <<< "$(python3 -I harness/smoke.py apt "$RUNNER_TEMP/app.json")"
            if [ "${#packages[@]}" -gt 0 ]; then sudo apt-get update -qq && sudo apt-get install -y -qq "${packages[@]}"; fi
          else
            read -ra packages <<< "$(python3 -I harness/smoke.py brew "$RUNNER_TEMP/app.json")"
            if [ "${#packages[@]}" -gt 0 ]; then brew install --quiet "${packages[@]}"; fi
          fi
      # bun's own build of its C and C++ (harness/bunprep.py) needs what this dev shell has;
      # flox's environment comes from its flake (harness/floxprep.py).
      - if: matrix.app == 'bun' || matrix.app == 'flox'
        uses: DeterminateSystems/nix-installer-action@v23
      - name: the shell ${{ matrix.app }} builds in
        run: |
          if [ "$APP" = bun ]; then
            nix develop .#bench-bun --command true
            echo "SHELL_OF_APP=nix develop .#bench-bun --command" >> "$GITHUB_ENV"
          fi
          # bench.py's cargo builds dynamo and codex with their pins (rust-toolchain.toml), as
          # their users do.
          if [ "$CHECK" = speed ]; then
            case "$APP" in
              dynamo) rustup toolchain install 1.96.1 --profile minimal ;;
              codex) rustup toolchain install 1.99.1 --profile minimal ;;
            esac
          fi
      - name: ${{ matrix.app }} works
        if: matrix.check == 'works'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          jq -n --arg app "$APP" --arg rev "${{ needs.release.outputs.sha }}" --arg work "$WORK" --arg out "$OUT/$OS.json" \
            '{groups: ["apps"], only: [$app], blaze_rev: $rev, work: $work, results: $out}' > "$RUNNER_TEMP/works.json"
          $SHELL_OF_APP python3 -I harness/smoke.py "$RUNNER_TEMP/works.json"
      - name: ${{ matrix.app }} against cargo
        if: matrix.check == 'speed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          engine="$CARGO_HOME/bin/blaze-engine"
          [ -x "$engine" ] || engine="$CARGO_HOME/bin/ra-jit" # rename: old name
          export PATH="$CARGO_HOME/bin:$PATH" BLAZE_BIN="$engine" BLAZE_PROJECTS="$WORK/projects"
          bench="$OUT/bench-$OS-$APP.json"
          status=0
          $SHELL_OF_APP env -u CARGO_INCREMENTAL -u RUSTC_WRAPPER python3 harness/bench.py "$APP" --backend cranelift \
            --runs 1 --cold-runs 1 --tests --work "$WORK/bench" --out "$bench" || status=$?
          # 3: bench.py measured and wrote what went wrong; the verdict below reads it.
          [ "$status" = 0 ] || [ "$status" = 3 ] || exit "$status"
          baseline=""
          if gh release download "$STABLE" -R "$GITHUB_REPOSITORY" -p "bench-$OS-$APP.json" -D "$RUNNER_TEMP/stable" 2>/dev/null; then
            baseline="$RUNNER_TEMP/stable/bench-$OS-$APP.json"
          fi
          jq -n --arg tag "$TAG" --arg app "$APP" --arg os "$OS" --arg bench "$bench" --arg baseline "$baseline" \
            --arg out "$OUT/speed-$OS.json" '{tag: $tag, project: $app, os: $os, bench: $bench, baseline: $baseline, out: $out}' \
            > "$RUNNER_TEMP/speed.json"
          python3 -I .github/scripts/promote.py speed "$RUNNER_TEMP/speed.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apps-${{ matrix.app }}-${{ matrix.check }}-${{ matrix.os }}
          path: /tmp/gate-out/
          if-no-files-found: ignore

  # main's merge gate on the tag's commit (blaze.yaml's run on its push to main): green, with
  # every platform's unit tests run. Waited for while it runs; a canary is cut before it ends.
  main-tests:
    name: main's tests
    needs: release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          jq -n --arg tag "$TAG" --arg sha "$SHA" '{tag: $tag, sha: $sha, wait_minutes: 300}' > "$RUNNER_TEMP/tested.json"
          python3 -I .github/scripts/promote.py tested "$RUNNER_TEMP/tested.json"

  # The train's every tier, on the tag: built from the tag's commit, which is what the release's
  # archives were built from. A tag's train releases nothing and opens no issue (train.yaml).
  train:
    name: train on the tag
    needs: release
    if: github.event_name == 'workflow_dispatch' && inputs.train
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: train.yaml on ${{ env.TAG }}
        run: |
          id="${{ inputs.train-run }}"
          if [ -z "$id" ]; then
            began=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run train.yaml -R "$GITHUB_REPOSITORY" --ref "$TAG"
            for _ in $(seq 30); do
              sleep 10
              id=$(gh run list -R "$GITHUB_REPOSITORY" -w train.yaml -b "$TAG" -e workflow_dispatch -L 5 \
                --json databaseId,createdAt -q "[.[] | select(.createdAt >= \"$began\")][0].databaseId // empty")
              [ -n "$id" ] && break
            done
            [ -n "$id" ] || { echo "::error::the train dispatched on $TAG did not start"; exit 1; }
            echo "TRAIN_STARTED=$id" >> "$GITHUB_ENV"
          fi
          echo "train: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run watch "$id" -R "$GITHUB_REPOSITORY" --interval 120 --exit-status > /dev/null
          [ "$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json headBranch -q .headBranch)" = "$TAG" ] ||
            { echo "::error::run $id is not a train on $TAG"; exit 1; }
      # A train this promote started serves only it: once the promote is cancelled, nothing
      # reads the train's result, and it would hold the runners and the train group for hours.
      - name: cancel the train this promote started
        if: cancelled() && env.TRAIN_STARTED != ''
        run: gh run cancel "$TRAIN_STARTED" -R "$GITHUB_REPOSITORY"

  verdict:
    name: promote or file
    needs: [release, smoke, apps, train, main-tests]
    if: always() && github.event_name == 'workflow_dispatch' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: results
      - name: promote ${{ env.TAG }}
        if: needs.smoke.result == 'success' && needs.apps.result == 'success' && needs.train.result == 'success' && needs.main-tests.result == 'success' && inputs.promote
        run: |
          jq -n --arg tag "$TAG" --arg run "$RUN" '{tag: $tag, run: $run, bench: "results"}' > "$RUNNER_TEMP/promote.json"
          python3 -I .github/scripts/promote.py promote "$RUNNER_TEMP/promote.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: passed, not promoted
        if: needs.smoke.result == 'success' && needs.apps.result == 'success' && needs.main-tests.result == 'success' && !(inputs.promote && inputs.train)
        run: echo "$TAG passed what this run tested; a run with promote and the train marks it stable" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: an issue for what failed
        if: needs.smoke.result != 'success' || needs.apps.result != 'success' || needs.main-tests.result != 'success' || (inputs.train && needs.train.result != 'success')
        env:
          FILE: ${{ inputs.promote }}
        run: |
          if [ "$FILE" != true ]; then
            echo "::error::$TAG did not pass the gate (a dry run: no issue)"
            exit 1
          fi
          jq -n --arg tag "$TAG" --arg run "$RUN" --argjson needs "$NEEDS" \
            '{tag: $tag, run: $run, results: "results", needs: $needs}' > "$RUNNER_TEMP/issue.json"
          python3 -I .github/scripts/promote.py issue "$RUNNER_TEMP/issue.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
