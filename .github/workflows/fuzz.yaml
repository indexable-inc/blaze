# Probe branch of lane relax-images (blaze #1295, #1299): not for merging. Measures the anim
# stand-in's warm load and the worker's memory with two releases.
name: fuzz
on:
  workflow_dispatch:
    inputs:
      seed:
        description: unused
        required: false
      rounds:
        description: old release, new release, engine artifact run id (optional)
        default: "0.20261028.9 0.20261028.10"

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -yq libasound2-dev pkg-config
      - name: measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- ${{ inputs.rounds }}
          export OLD=$1 NEW=$2
          if [ -n "${3:-}" ]; then
            gh run download "$3" -n blaze-linux-x86_64 -D "$RUNNER_TEMP/engine"
            export ENGINE=$(find "$RUNNER_TEMP/engine" -name blaze-engine -type f | head -1)
            chmod +x "$ENGINE"
          fi
          nproc; free -g
          OUT="$RUNNER_TEMP/probe/out" bash probe/measure.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: ${{ runner.temp }}/probe/out
