# Throwaway probe (lane relax-bmemo, #1291): ix VMs could not be had, so the cold-build A/B of
# the back-end memo runs here. Not for main.
name: fuzz
on:
  push:
    branches: ["relax-bmemo-probe"]
  workflow_dispatch:
    inputs:
      seed:
        description: unused
        required: false
      rounds:
        description: cold builds per arm and project
        default: "2"

env:
  CARGO_INCREMENTAL: 0
  BASE: c2265497f9cbd720d70a94cfd734a82fefa4aba1

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev pkg-config
      - name: build both arms
        run: |
          set -euxo pipefail
          export CARGO_TARGET_DIR=$RUNNER_TEMP/target
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && cargo build --release --locked -p blaze-engine)
          mkdir -p "$RUNNER_TEMP/arm-base" "$RUNNER_TEMP/arm-memo"
          cp "$CARGO_TARGET_DIR"/release/{blaze-engine,blaze,blaze-rustc} "$RUNNER_TEMP/arm-base/"
          cargo build --release --locked -p blaze-engine
          cp "$CARGO_TARGET_DIR"/release/{blaze-engine,blaze,blaze-rustc} "$RUNNER_TEMP/arm-memo/"
      - name: projects
        env:
          GH_TOKEN: ${{ secrets.BLAZE_BOT_TOKEN || github.token }}
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          git clone -q --depth 1 --branch 15.1.0 https://github.com/BurntSushi/ripgrep ripgrep
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git init -q anim
          git clone -q --depth 1 --branch 0.108.0 https://github.com/nushell/nushell nushell
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" -C anim fetch -q --depth 1 https://github.com/indexable-inc/anim 92c64f7276b3444a518904eaad2e107b36f77e08; then
            git -C anim checkout -q FETCH_HEAD
          else
            rm -rf anim
          fi
      - name: cold builds, alternating
        run: |
          set -euxo pipefail
          nproc; free -g; lscpu | grep -E "Model name|^CPU\(s\)"
          export COLD_WORK="$RUNNER_TEMP/cold-work"
          python3 -I tools/bench/results/2026-10-28-bmemo/cold.py "$RUNNER_TEMP/out" "${{ inputs.rounds || 2 }}" \
            base="$RUNNER_TEMP/arm-base/blaze-engine" memo="$RUNNER_TEMP/arm-memo/blaze-engine" \
            -- ripgrep="$RUNNER_TEMP/ripgrep" nushell="$RUNNER_TEMP/nushell" $([ -d "$RUNNER_TEMP/anim" ] && echo anim="$RUNNER_TEMP/anim")
      - name: unit tests of the memo
        if: always()
        run: |
          export CARGO_TARGET_DIR=$RUNNER_TEMP/target
          cargo test --release --locked -p hir-ty-codegen --lib -- memo:: sibling a_slot_at_the_bottom emit_compiles
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bmemo
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
