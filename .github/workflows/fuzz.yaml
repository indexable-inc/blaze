# Probe branch of lane relax-images (blaze #1295, #1299): not for merging. Measures the anim
# stand-in's warm load and the worker's memory with two releases, the second's engine replaced
# by one blaze builds from a ref when one is named.
name: fuzz
on:
  workflow_dispatch:
    inputs:
      seed:
        description: ref whose blaze-engine replaces the new release's (optional)
        required: false
      rounds:
        description: old release, new release
        default: "0.20261028.9 0.20261028.10"
      script:
        description: probe/<script> to run
        default: measure.sh

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - if: inputs.seed != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.seed }}
          path: arm
      - if: inputs.seed != ''
        uses: ./.github/actions/toolchain
        with:
          llvm: build
      - if: inputs.seed != ''
        id: blaze
        uses: ./.github/actions/blaze
        with:
          job: build
      - if: inputs.seed != ''
        working-directory: arm
        run: |
          nix develop --command blaze build -p blaze-engine --release --features llvm --locked
          blaze stop || true
          cp target/release/blaze-engine "$RUNNER_TEMP/blaze-engine"
      - run: sudo apt-get update -q && sudo apt-get install -yq libasound2-dev pkg-config
      - name: measure
        run: |
          set -- ${{ inputs.rounds }}
          export OLD=$1 NEW=$2
          [ -f "$RUNNER_TEMP/blaze-engine" ] && export ENGINE="$RUNNER_TEMP/blaze-engine"
          unset BLAZE_CACHE
          nproc; free -g
          export REL=$NEW
          OUT="$RUNNER_TEMP/probe/out" bash probe/${{ inputs.script }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: ${{ runner.temp }}/probe/out
