# Instruction counts per merge (docs/benchmarks.md "Instruction counts"): on every push to main, the
# cheap subset of harness/bench.py (the stress corpus of harness/stress-corpus and two small
# projects, the dev profile, three runs) on each platform's dedicated benchmark machine, the same
# self-hosted runners bench-readme.yaml uses (harness/benchplatforms.py). Hardware counters need
# a machine with a PMU the job may read: GitHub's hosted runners expose none, so this never runs
# there. Each platform's line goes to docs/benchmarks/history/<platform>-merge.jsonl
# (benchhistory.py build --suite merge), and `benchhistory.py check` judges it against the runs
# before it: instructions first, with a 1% band (or three times their spread), wall time and
# memory with their usual bands. The summary (regressed, improved and the geometric mean of
# every change, rustc-perf's form) goes to the run's summary; a regression fails the run.
name: bench-counts
on:
  push:
    branches: ["main"]
    paths-ignore: ["README.md", "docs/**", "site/**"]
  workflow_dispatch:

# One run at a time on the machines; a push that comes during a run waits, and a newer push
# replaces it while it waits. Its own group: a pending bench-readme run is never replaced by it.
concurrency:
  group: bench-counts
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  BLAZE_CORES: all

jobs:
  platforms:
    name: platforms with a registered runner
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          BENCH_RUNNERS: ${{ vars.BENCH_RUNNERS }}
          BENCH_RUNNER: ${{ vars.BENCH_RUNNER }}
        run: python3 harness/benchplatforms.py matrix

  counts:
    name: counts (${{ matrix.name }})
    needs: platforms
    if: needs.platforms.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 120
    env:
      # Shared with bench-readme.yaml: blaze builds incrementally and the projects are cloned once.
      BENCH_HOME: ${{ github.workspace }}/../bench-state
      BENCH_WORK: ${{ matrix.work }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: user namespaces and counters
        if: runner.os == 'Linux'
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            sudo -n sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Counting the user mode of one's own processes needs perf_event_paranoid <= 2
          # (harness/counters.py); a machine that refuses says so in each count's gap.
          if [ "$(cat /proc/sys/kernel/perf_event_paranoid)" -gt 2 ]; then
            sudo -n sysctl kernel.perf_event_paranoid=2 || echo "::warning::perf_event_paranoid stays above 2: no instruction counts"
          fi
      # blaze builds blaze (AGENTS.md rule blaze-builds-blaze), as bench-readme.yaml builds it.
      - name: Build blaze
        run: |
          mkdir -p "$BENCH_HOME"
          CARGO_HOME="$BENCH_HOME/stage0" sh site/install.sh --version "$(cat .github/blaze-version)" --verbose
          stage0="$BENCH_HOME/stage0/bin/blaze"
          CARGO_TARGET_DIR="$BENCH_HOME/target" nix develop .#bench -c "$stage0" build -p blaze-engine --release --locked
          "$stage0" stop
      - name: Bench
        id: bench
        run: |
          export BLAZE_BIN="$BENCH_HOME/target/release/blaze-engine"
          export BLAZE_PROJECTS="$BENCH_HOME/projects"
          work=${BENCH_WORK:-$BENCH_HOME/work}-counts
          rm -rf "$work" "$BENCH_HOME/reference-counts"
          mkdir -p "$RUNNER_TEMP/results"
          nix develop .#bench -c env -u CARGO_INCREMENTAL -u RUSTC_WRAPPER python3 harness/bench.py \
            fd hyperfine --stress --backend cranelift --runs 3 \
            --work "$work" --reference "$BENCH_HOME/reference-counts" --out "$RUNNER_TEMP/results/bench.json" \
            || { status=$?; [ "$status" = 3 ] || exit "$status"; echo "wrong=true" >> "$GITHUB_OUTPUT"; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: counts-${{ matrix.slug }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
      - name: Fail on a wrong result
        if: steps.bench.outputs.wrong == 'true'
        run: |
          echo "::error::a program, a build or a stress crate ended wrong under blaze: see the Bench step"
          exit 1

  history:
    name: history and check
    needs: [platforms, counts]
    if: always() && needs.platforms.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The ruleset on main refuses a push from the workflow's own token (docs/harness.md, "CI").
          token: ${{ secrets.BLAZE_BOT_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: counts-*
          path: ${{ runner.temp }}/results
      - name: History and check
        id: history
        run: |
          regressed=false
          : > "$RUNNER_TEMP/regressions.md"
          for result in "$RUNNER_TEMP"/results/counts-*/bench.json; do
            [ -f "$result" ] || continue
            slug=$(basename "$(dirname "$result")"); slug=${slug#counts-}
            history="docs/benchmarks/history/$slug-merge.jsonl"
            python3 harness/benchhistory.py build "$result" --suite merge --history "$history"
            python3 harness/benchhistory.py check "$history" --report "$RUNNER_TEMP/regressions-$slug.md" || regressed=true
            { echo "### $slug"; cat "$RUNNER_TEMP/regressions-$slug.md"; echo; } >> "$RUNNER_TEMP/regressions.md"
          done
          echo "regressed=$regressed" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/regressions.md" >> "$GITHUB_STEP_SUMMARY"
      # The README's and docs/benchmarks.md's trend charts, from the history just appended to.
      - name: Trends
        run: python3 harness/benchcharts.py '{}'
      # Main may have moved during the run: bench_commit.py puts the commit on top, draws the
      # trends again from the history as it is then, and tries again.
      - name: Commit to main
        run: |
          python3 .github/scripts/bench_commit.py "$(printf '{"message": "bench: instruction counts for %s [skip ci]", "paths": ["docs/benchmarks/history/", "docs/benchmarks/charts/", "README.md", "docs/benchmarks.md"]}' "${GITHUB_SHA::10}")"
      - name: Fail on a regression
        if: steps.history.outputs.regressed == 'true'
        run: |
          echo "::error::a benchmark regressed past its band (instructions 1%): see the run summary"
          exit 1
