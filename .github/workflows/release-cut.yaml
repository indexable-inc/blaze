# Cuts a release of main by hand while the train runs by hand only (train.yaml): the train's
# release job alone, without waiting for a green train. `train_release.py '{"push": true}'` tags
# main's HEAD `v0.YYYYMMDD.N` through the API and dispatches release.yaml on it; no commit goes
# to main (the version is stamped into the release's build only, by `BLAZE_RELEASE`). Run it on
# a main whose merge gate (`ci`) is green:
#
#     gh workflow run release-cut.yaml
name: release cut
on:
  workflow_dispatch:

concurrency:
  group: release-cut
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          python3 -I .github/scripts/train_release.py '{"push": true}'
        env:
          GH_TOKEN: ${{ github.token }}
