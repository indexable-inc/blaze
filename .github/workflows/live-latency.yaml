# Save-to-running latency of live edits on macOS arm64, step by step (harness/live_latency.py).
# Runs on a push to a live-latency* branch, by hand, and every night on main. A run on main adds
# a line to docs/benchmarks/history/macos-arm64-live.jsonl (the site's /bench page charts it)
# and checks it against the runs before it (harness/benchhistory.py): a median past its noise
# band opens or comments on an issue labelled bench-regression and fails the run.
name: live edit latency
on:
  push:
    branches: ["live-latency*"]
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:
    inputs:
      modes:
        description: "cargo, socket, burst, replay, restart, space separated"
        default: "socket burst replay"
      edits:
        description: edits timed per mode
        default: "10"
      rounds:
        description: rounds of replay's typing
        default: "1"

# A newer push to the branch cancels the run before it; the nightly run and a run by hand are
# never cancelled.
concurrency:
  group: live-latency-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

permissions:
  contents: write
  issues: write
  # To start the site's deploy after the history commit: a push by GITHUB_TOKEN starts no workflow.
  actions: write

jobs:
  latency:
    name: live edit latency, ${{ matrix.program }} (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        program: [probe, life, bevy, egui]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: tc=$(cat harness/toolchain) && rustup toolchain install "$tc" --profile minimal && rustup default "$tc"
      # cargo, with no cache: the latency timed is of blaze as rustc compiles it, since the blaze
      # that blaze builds runs about ten times slower until it inlines one function into another
      # (https://github.com/indexable-inc/blaze/issues/899).
      - run: cargo build --release -p blaze-engine
      - name: time edits of a running program
        env:
          LATENCY_EDITS: ${{ inputs.edits || '10' }}
          LATENCY_ROUNDS: ${{ inputs.rounds || '1' }}
          # The file has what it ran on (commit, run, host, battery) for benchhistory.py live.
          LATENCY_JSON: ${{ runner.temp }}/latency.json
          BLAZE_BENCH_MACHINE: GitHub macos-15 runner
          BLAZE_IDLE_SECS: "0"
        run: BLAZE_BIN="$GITHUB_WORKSPACE/target/release/blaze-engine" python3 harness/live_latency.py --program ${{ matrix.program }} ${{ inputs.modes || 'socket burst replay' }}
      - name: what the workers said
        if: always()
        run: |
          for log in "$HOME"/.cache/blaze/workers/*/log "$HOME"/.cache/blaze/spares/*/log; do
            [ -f "$log" ] || continue
            echo "::group::$log (filtered)"
            grep -E "request:|timeline-us|apply-us|splice|steps:|asked:|edit-to-binary|link:|live:|panicked|error" "$log" | cut -c1-400 | tail -300 || true
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: latency-${{ matrix.program }}
          path: |
            ${{ runner.temp }}/latency.json
            ~/.cache/blaze/daemon.log
            ~/.cache/blaze/workers/*/log
            ~/.cache/blaze/spares/*/log
          if-no-files-found: warn

  history:
    name: history and regressions
    needs: latency
    # The programs that did run are recorded even when another failed.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The ruleset on main refuses a push from the workflow's own token: this one is allowed
          # past it (docs/harness.md, "CI").
          token: ${{ secrets.BLAZE_BOT_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: latency-*
          path: ${{ runner.temp }}/latency
      - name: History and regressions
        id: history
        run: |
          mapfile -t files < <(find "$RUNNER_TEMP/latency" -name latency.json)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no program wrote its latency"; exit 1; }
          python3 harness/benchhistory.py live "${files[@]}"
          # One runner's medians differ by up to twice between two rounds of the same binary
          # (#77): a number is judged once three runs before it show the runners' spread.
          if python3 harness/benchhistory.py check docs/benchmarks/history/macos-arm64-live.jsonl --least 3 --report "$RUNNER_TEMP/regressions.md"; then
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          else
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/regressions.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/history/macos-arm64-live.jsonl
          git commit -q -m "bench: live latency for ${GITHUB_SHA::10} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::the history commit does not apply to main"; exit 1; }
            if git push -q origin HEAD:main; then
              gh workflow run site.yaml --ref main
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Open or update the regression issue
        if: steps.history.outputs.regressed == 'true'
        run: |
          gh label create bench-regression --color B60205 --description "A benchmark median moved past its noise band" --force
          open=$(gh issue list --label bench-regression --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/regressions.md"
          else
            gh issue create --title "Live-edit latency regression at ${GITHUB_SHA::10}" --label bench-regression \
              --body-file "$RUNNER_TEMP/regressions.md"
          fi
          echo "::error::live-edit latency regressed beyond its noise band: see the run summary"
          exit 1
