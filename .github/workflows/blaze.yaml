# blaze: the merge gate. What a pull request and each entry of the merge queue has to pass, kept
# to a few minutes so that the queue moves. What runs where is in docs/harness.md ("CI").
#
#   every change: the checks of the repository's scripts, docs and agent rules (`scripts`),
#       actionlint over the workflows (`workflows`), the Lean proofs (`lean`);
#   a change of code: also `cargo check --workspace --exclude blaze-std --all-targets` and the
#       unit tests of the buildable workspace with cargo and the pinned nightly (`cargo`). No
#       `blaze fmt --check`: fmt.yaml formats main after each push instead.
#
# A change runs `cargo` only when it touches a file it reads: the crates, the vendored crates,
# astlog (tools/astlog), the workspace's manifest, lock file, cargo config, .rustfmt.toml and
# .clippy.toml, the pinned toolchain (pins/), and these workflows and the actions they
# use. scripts/src/bin/gate_changes.rs has the list and why each path is on it. It names what is
# code, so a new directory is not: any other change runs the script checks alone, and a list of
# files that cannot be had counts as code. `ci` is the one check that says whether everything
# that ran passed: it is the check branch rules and the merge queue require. The queue tests each
# pull request merged onto main and whatever is ahead of it, and main moves only to what it
# tested.
#
# Runners (docs/harness.md "ix runners"): every job runs on indexable's ix runners
# (https://ix.dev/docs/runners), on Linux AArch64, each forking the snapshot its own job's last
# green run on main left. A pull request from a fork runs only once a maintainer approves it
# (fork pull request policy `all_external_contributors`), and a run off main never becomes a
# snapshot.
name: blaze
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  # A pull request's newer push cancels its run before. Main runs one push at a time: a push
  # while one runs waits, and a newer push replaces the one waiting, never the one running, so
  # each run ends and covers every merge up to its commit. A group of its own per push stacked
  # up a full three-platform run per merge (17 at once on 2026-10-28, each waiting on macOS
  # runners) and none of them got runners in time. A merge-queue entry or a run by hand is
  # still a group of its own. A push groups by its ref: a push to a lane branch shares no group
  # with main (2026-11-05: lane-branch pushes sat in `blaze-main` and kept replacing main's
  # waiting run, so no main run finished all day).
  group: blaze-${{ github.event_name == 'push' && github.ref || format('{0}-{1}', github.event_name, github.event_name == 'pull_request' && github.ref || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # blaze's whole machine: no one sits at a CI runner (docs/cargo.md, "Cores and priority").
  BLAZE_CORES: all

jobs:
  # Which tier runs: `gate` for a pull request and the merge queue, `warm` for a push to main
  # (or by hand), or `none` for a change that touches no file the tier reads (the pull
  # request's files, the merge queue entry's or the push's against the commit before it;
  # scripts/src/bin/gate_changes.rs). Anything that cannot be told counts as code.
  changes:
    name: changes
    runs-on: [ix, arm64]
    # The built scripts from the Actions cache take seconds (./.github/actions/script); a miss,
    # once per change of their inputs, installs the release and builds scripts/ from the
    # runner's store (an ix runner starts from main's last green disk). Neither is measured yet.
    timeout-minutes: 12
    outputs:
      tier: ${{ steps.files.outputs.tier }}
    steps:
      # Only what the script action's key reads (.github/actions/script/key.sh); a miss checks
      # the rest out.
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.cargo/
            /scripts/
            /crates/blaze-script/
            /crates/blaze-pins/
            /pins/
            /Cargo.toml
            /Cargo.lock
      - uses: ./.github/actions/script
        with:
          job: changes
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'warm' || 'gate' }}
          # Empty on a run by hand, which then counts as code.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          "$BLAZE_SCRIPTS/gate_changes" \
            "{\"tier\": \"$TIER\", \"repository\": \"$GITHUB_REPOSITORY\", \"base\": \"$BASE\", \"head\": \"$HEAD\"}"

  scripts:
    name: harness imports, rustc sites
    runs-on: [ix, arm64]
    # 10 before the Rust scripts; the built scripts come from the Actions cache in seconds, and a
    # miss (the release's install and a build of scripts/) comes on top (not yet measured).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      # The repository's Python workspace (pyproject.toml, uv.lock): its scripts lint and type-check.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      - uses: oven-sh/setup-bun@v2
      # The repository's Rust scripts (scripts/, docs/v2/plan/design/scripts.md), built by the
      # release .github/blaze-version names, never by the blaze this tree builds: a tree whose
      # compiler does not build must still be checked (the stage-0 rule). From the Actions cache
      # when their inputs are unchanged (./.github/actions/script). No LLVM: the scripts link none.
      - uses: ./.github/actions/script
        with:
          job: scripts
      # The gate: every row of tools/gate.txt, the one list `just lint` runs too, through the one
      # runner (scripts/src/bin/gate.rs), which first checks that this job runs no check beside it
      # (each step but this one is a `uses:` or a row of its CI_ONLY_STEPS). The Python and bun
      # checks, the docs, the ledger and the ratchets are its rows, each with its timeout; a ratchet
      # row is held to the base's rows too. Against the base itself: the checkout is shallow.
      - name: the gate (tools/gate.txt, as `just lint`)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch -q --depth=1 origin "$BASE"
            "$BLAZE_SCRIPTS/gate" "{\"command\": \"run\", \"scripts\": \"$BLAZE_SCRIPTS\", \"base\": \"$BASE\"}"
          else
            echo "no base to compare with (a run by hand): each crate is held to its row only"
            "$BLAZE_SCRIPTS/gate" "{\"command\": \"run\", \"scripts\": \"$BLAZE_SCRIPTS\"}"
          fi
      # A change of blaze-profile's schema version lands only once ix.dev/explore reads it
      # (.github/scripts/explore_page.py).
      - name: ix.dev/explore reads a new profile schema
        run: |
          git fetch -q --depth=1 origin main
          version() { grep -E '^pub const VERSION: u32' "$@"; }
          if [ "$(git show FETCH_HEAD:crates/blaze-profile/src/schema.rs | version)" != "$(version crates/blaze-profile/src/schema.rs)" ]; then
            uv run --frozen python .github/scripts/explore_page.py '{}'
          fi

  # The Lean proofs hold (rule verified-compiler; harness/v2/lean_gate.py, docs/v2/plan/proofs.md):
  # with the Lean lean/lean-toolchain pins, `lake build` of lean/ (core Lean: the semantics of
  # MIR, the proved passes, the models and their proofs) and of lean/analysis (the derivative
  # proofs, on Mathlib's prebuilt files from `lake exe cache get`: Mathlib is never compiled);
  # no declaration uses `sorry`; and each theorem of lean/theorems.json exists and rests on no
  # axiom but `propext`, `Classical.choice` and `Quot.sound` (`#print axioms`). On every change:
  # a proof is about the Rust beside it (the embedded bodies, the rule table), so no list of
  # paths says when it need not run. elan is the release binary, checked by its sha256; it and
  # Mathlib's files are cached by the toolchain and lean/analysis's pins, and lean/'s own build
  # by its sources. About 4 minutes from the caches and about 15 without (not yet measured).
  lean:
    name: lean proofs
    runs-on: [ix, arm64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.elan
            lean/analysis/.lake
          key: lean-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/analysis/lakefile.toml', 'lean/analysis/lake-manifest.json') }}
      - uses: actions/cache@v6
        with:
          path: lean/.lake
          key: lean-core-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/**/*.lean', 'crates/*/lean/**/*.lean', 'lean/lakefile.toml') }}
          restore-keys: lean-core-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-
      # The release binary of elan, checked by its sha256, then the toolchain lean/lean-toolchain
      # pins. The gate names that toolchain's `lake` by its path, never PATH.
      - name: elan 4.2.4 and the pinned Lean
        run: |
          pin=$(cat lean/lean-toolchain)
          lake="$HOME/.elan/toolchains/$(echo "$pin" | sed 's|/|--|g; s|:|---|g')/bin/lake"
          if [ ! -x "$lake" ]; then
            case "$RUNNER_ARCH" in
              ARM64) arch=aarch64 sum=05febd124d84ebf994b2e7479922a5650b1e950c17ae3bd1ddd776b65bb72bf9 ;;
              *) echo "::error::no pinned elan for $RUNNER_ARCH"; exit 1 ;;
            esac
            tgz="$RUNNER_TEMP/elan.tar.gz"
            curl -fsSL --retry 3 -o "$tgz" "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-$arch-unknown-linux-gnu.tar.gz"
            echo "$sum  $tgz" | sha256sum -c -
            tar -xzf "$tgz" -C "$RUNNER_TEMP" elan-init
            "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
            "$HOME/.elan/bin/elan" toolchain install "$pin"
          fi
          "$lake" --version
      - run: |
          uv run --frozen python harness/v2/lean_gate.py '{"command": "check"}'

  # Every workflow parses and holds together (actionlint): a workflow whose YAML does not parse
  # fails on push with no jobs and says so nowhere (three release workflows after #1691, an
  # unquoted `: ` in a `run:` line). The local actions (.github/actions/*/action.yml) are
  # parsed where a workflow uses them. actionlint's own checks only: its shellcheck and pyflakes
  # passes are off. What it is told to ignore is in .github/actionlint.yaml.
  workflows:
    name: actionlint
    runs-on: [ix, arm64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      # The release binary, checked by its sha256 (rhysd/actionlint's checksums.txt).
      - name: actionlint 1.7.12
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            ARM64) arch=arm64 sum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "::error::no pinned actionlint for $RUNNER_ARCH"; exit 1 ;;
          esac
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_$arch.tar.gz"
          echo "$sum  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes='

  # The buildable workspace (every crate but those parked, docs/v2/plan/parked.md, and
  # blaze-std, its own world) type-checks with its test targets, and its unit tests pass, with
  # cargo and the pinned nightly (pins/toolchain): cargo builds blaze in the dev loop until
  # blaze builds blaze again (AGENTS.md rule blaze-builds-blaze). No LLVM: no buildable crate
  # links it. The runner's snapshot keeps ~/.rustup and target/ from main's last green run.
  cargo:
    name: cargo check and test, linux arm64
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: [ix, arm64, ix-cpu-64, blaze-cargo]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # llvm-tools and the two other targets for blaze-sys's imports step below: core and
      # compiler_builtins come precompiled with each target, so nothing builds a standard library.
      - uses: ./.github/actions/toolchain
        with:
          components: llvm-tools
          targets: x86_64-unknown-linux-gnu aarch64-apple-darwin
      - uses: ./.github/actions/script
        with:
          job: cargo
      - name: cut toolchain shelf
        run: |
          pinned="$(tr -d '[:space:]' < crates/blaze-toolchain/PINNED)"
          shelf="$HOME/.blaze/v2/toolchain"
          if [ ! -f "$shelf/$pinned" ]; then
            tc="$(cat pins/toolchain)"
            cargo +"$tc" fetch --locked --quiet
            reg="$(ls -d "${CARGO_HOME:-$HOME/.cargo}"/registry/cache/index.crates.io-* | head -n 1)"
            "$BLAZE_SCRIPTS/toolchain_cut" "{\"tree\": \".\", \"targets\": [\"aarch64-apple-darwin\", \"aarch64-unknown-linux-gnu\"], \"registry\": \"$reg\", \"shelf\": \"$shelf\", \"write_pin\": false, \"check\": false, \"macro_side\": true}"
          fi
      - name: cargo check --workspace --exclude blaze-std --all-targets
        run: cargo +"$(cat pins/toolchain)" check --locked --workspace --exclude blaze-std --all-targets --message-format short
      - name: cargo test --workspace --exclude blaze-std
        run: |
          set -euo pipefail
          tc="$(cat pins/toolchain)"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          bins="$tmp_dir/bins.txt"
          cargo +"$tc" test --locked --workspace --exclude blaze-std --no-run --message-format=json-render-diagnostics \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | "\(.manifest_path | sub("/Cargo\\.toml$"; ""))|\(.executable)"' \
            | sort -u > "$bins"
          nproc_val="$(nproc 2>/dev/null || echo 8)"
          jobs=$(( nproc_val / 4 ))
          [ "$jobs" -lt 1 ] && jobs=1
          [ "$jobs" -gt 16 ] && jobs=16
          export FAIL_DIR="$tmp_dir"
          export RUST_TEST_THREADS=4
          tr '\n' '\0' < "$bins" | xargs -0 -r -n 1 -P "$jobs" bash -c '
            dir="${1%%|*}"
            bin="${1#*|}"
            name="$(basename "$bin")"
            out="$FAIL_DIR/$name.log"
            if (cd "$dir" && CARGO_MANIFEST_DIR="$dir" "$bin") >"$out" 2>&1; then
              rm -f "$out"
            else
              rc=$?
              echo "::error::FAIL $name (exit $rc)"
              cat "$out"
              echo "$name" >> "$FAIL_DIR/failed.list"
            fi
          ' _
          if ! cargo +"$tc" test --locked --workspace --exclude blaze-std --doc --no-fail-fast; then
            echo "doctests" >> "$tmp_dir/failed.list"
          fi
          if [ -s "$tmp_dir/failed.list" ]; then
            echo "::error::failing test binaries:"
            cat "$tmp_dir/failed.list"
            exit 1
          fi
      # D180: blaze-sys's compiled objects reference no C-library symbol on Linux (both
      # architectures), and on macOS only the libSystem symbols of
      # tools/ratchets/blaze-sys-libsystem.txt (scripts/src/bin/sys_imports.rs). Its lib alone,
      # no_std: an rlib per target (nothing links, so the Mac target builds here too).
      - name: blaze-sys imports, per target
        run: |
          tc="$(cat pins/toolchain)"
          sysroot="$(rustc +"$tc" --print sysroot)"
          nm="$sysroot/lib/rustlib/aarch64-unknown-linux-gnu/bin/llvm-nm"
          for triple in aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            timeout 600 cargo +"$tc" build --locked -p blaze-sys --lib --target "$triple" --target-dir target/sys-imports
            builtins=$(echo "$sysroot/lib/rustlib/$triple/lib/"libcompiler_builtins-*.rlib)
            case "$triple" in
              *-linux-*) extra='' ; os=linux ;;
              *) extra=', "ratchet": "tools/ratchets/blaze-sys-libsystem.txt"' ; os=macos ;;
            esac
            timeout 120 "$BLAZE_SCRIPTS/sys_imports" "{\"command\": \"check\", \"target\": \"$os\", \"objects\": [\"target/sys-imports/$triple/debug/libblaze_sys.rlib\"], \"builtins\": \"$builtins\", \"nm\": \"$nm\"$extra}"
          done

  ci:
    name: ci
    needs: [changes, scripts, workflows, lean, cargo]
    if: always()
    runs-on: [ix, arm64]
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.changes.outputs.tier }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          ! echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null
          # What this tier was expected to run, each of which has to have succeeded: the absence
          # of a failure is not a pass (agents.json A39), and a job this tier runs that was
          # skipped is a gate that tested nothing. `none` (a change of no code) runs the first
          # four; any other tier the cargo check and tests too.
          case "$TIER" in
            none) expected='["changes","scripts","workflows","lean"]' ;;
            gate|warm) expected='["changes","scripts","workflows","lean","cargo"]' ;;
            *) echo "::error::the tier is '$TIER', none of none, gate and warm: what this run was to test is not known"; exit 1 ;;
          esac
          missed=$(echo "$NEEDS" | jq -r --argjson expected "$expected" '$expected - [to_entries[] | select(.value.result == "success") | .key] | join(", ")')
          if [ -n "$missed" ]; then
            echo "::error::tier $TIER expected these jobs to run and succeed, and they did not: $missed"
            exit 1
          fi
          echo "tier $TIER: each of $expected ran and succeeded"
