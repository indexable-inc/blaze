# blaze: the merge gate. What a pull request and each entry of the merge queue has to pass,
# kept to a few minutes so that the queue moves: one build of blaze and the unit tests on Linux
# x86-64, and the checks of the harness scripts. Everything else, every harness on every
# platform, runs after the merge, in the release train (train.yaml), which releases main when
# it is green and opens an issue when it is not. What runs where, and how long it takes, is in
# docs/harness.md ("CI").
#
#   pull request, merge queue (about 5 minutes): the unit tests and the build on Linux x86-64,
#       `harness/imports.py` and `harness/rustcsites.py`. No `cargo fmt --check`: fmt.yaml
#       formats main after each push instead.
#   push to main: the build and the unit tests on Linux x86-64, Linux AArch64 and macOS, which
#       write the caches every other run reads. They are not cancelled by the next push, as the
#       train is, so the caches are written for every commit.
#
# A change to nothing but documentation, the site or the agent rules (agents/) runs the script
# checks alone. `ci` is the one check that says whether everything that ran passed: it is the
# check branch rules and the merge queue require. The queue tests each pull request merged onto main and whatever is ahead
# of it, and main moves only to what it tested.
name: blaze
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  # A pull request's newer push cancels its run before. Every push to main and every entry of
  # the merge queue runs to the end in a group of its own: with a merge every few minutes, one
  # group for main replaced each waiting run with the next, and main had almost no finished run.
  group: blaze-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which tier runs: `gate` for a pull request and the merge queue, `warm` for a push to main
  # (or by hand), or `none` for a change to nothing but documentation (the pull request's files,
  # the merge queue entry's or the push's against the commit before it). Anything that cannot
  # be told counts as code.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.files.outputs.tier }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          TIER: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'warm' || 'gate' }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD";;
            push) range="$BEFORE...$AFTER";;
            merge_group) range="$QUEUE_BASE...$QUEUE_HEAD";;
            *) range=;;
          esac
          files=
          if [ -n "$range" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$range" --jq 'if (.files | length) >= 300 then "" else .files[].filename end') || files=
          fi
          code=false
          [ -n "$files" ] || code=true
          while read -r file; do
            case "$file" in
              .github/workflows/blaze*.yaml|.github/actions/*) code=true;;
              *.md|docs/*|site/*|agents/*|LICENSE*|.github/*) ;;
              *) code=true;;
            esac
          done <<< "$files"
          [ "$code" = true ] || TIER=none
          echo "tier=$TIER" | tee -a "$GITHUB_OUTPUT"

  scripts:
    name: harness imports, rustc sites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      # Some scripts ask rustc for the host when imported: after the toolchain is installed.
      - run: python3 harness/imports.py
      # No new place in blaze's code starts rustc, rustdoc or cargo (docs/no-rustc.md).
      - run: python3 harness/rustcsites.py
      # The agent rules: agents/rules.ts type-checks, and AGENTS.md is what it generates.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --cwd site
      - run: site/node_modules/.bin/tsc -p agents
      - run: bun agents/rules.ts --check

  linux-x64:
    name: linux x64
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    uses: ./.github/workflows/blaze-platform.yaml
    # For main's push of blaze's store (the cache-writer environment's secrets).
    secrets: inherit
    with:
      platform: linux-x64
      os: ubuntu-24.04
      tier: ${{ needs.changes.outputs.tier }}
      borrowck: true
      pinned-ui: true
      smoke: true

  # On a push to main alone: their caches, for the train's runs and the next push's.
  linux-arm64:
    name: linux arm64
    needs: changes
    if: needs.changes.outputs.tier == 'warm'
    uses: ./.github/workflows/blaze-platform.yaml
    # For main's push of blaze's store (the cache-writer environment's secrets).
    secrets: inherit
    with:
      platform: linux-arm64
      os: ubuntu-24.04-arm
      tier: warm

  macos:
    name: macos arm64
    needs: changes
    if: needs.changes.outputs.tier == 'warm'
    uses: ./.github/workflows/blaze-platform.yaml
    # For main's push of blaze's store (the cache-writer environment's secrets).
    secrets: inherit
    with:
      platform: macos-arm64
      os: macos-15
      tier: warm
      pinned-ui: true

  ci:
    name: ci
    needs: [changes, scripts, linux-x64, linux-arm64, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          ! echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null
