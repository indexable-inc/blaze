# blaze: the merge gate. What a pull request and each entry of the merge queue has to pass,
# kept to a few minutes so that the queue moves: one build of blaze and the unit tests on Linux
# AArch64, a build for Linux x86-64 cross-compiled there, and the checks of the harness scripts. Everything else, every harness on every
# platform, runs after the merge, in the release train (train.yaml), which releases main when
# it is green and opens an issue when it is not. What runs where, and how long it takes, is in
# docs/harness.md ("CI").
#
#   pull request, merge queue (about 5 minutes): the unit tests and the build on Linux AArch64,
#       `blaze check --workspace` with the release on Linux AArch64,
#       the lint baselines (crates/blaze-lints/baselines) with the blaze the tree builds, on
#       Linux AArch64,
#       `harness/imports.py` and `harness/rustcsites.py`, actionlint over the workflows. No `blaze fmt --check`: fmt.yaml
#       formats main after each push instead.
#   push to main: the build and the unit tests on Linux AArch64 and macOS, which
#       write the caches every other run reads, and the same `blaze check --workspace`. One runs at a time: the next push waits, and a
#       newer one replaces it, so each run ends and writes the caches as of its commit.
#
# A change runs the build and the unit tests only when it touches a file they read: the crates,
# the vendored crates, astlog (tools/astlog), the workspace's manifest, lock file, cargo
# config, .rustfmt.toml and .clippy.toml, the pinned nightly (harness/toolchain),
# harness/unittests.py, the flake, the release of blaze that builds blaze
# (.github/blaze-version, site/install.sh), and these workflows and the actions they use; on a push
# to main, also the smoke corpus (harness/smoke.py, harness/smoke/).
# .github/scripts/gate_changes.py has the list and why each path is on it. It names what is
# code, so a new directory is not: any other change (documentation, the site, benches, the
# other harnesses and workflows) runs the script checks alone, and a list of files that cannot
# be had counts as code. `ci` is the one check that says whether everything that ran passed: it
# is the check branch rules and the merge queue require. The queue tests each pull request
# merged onto main and whatever is ahead of it, and main moves only to what it tested.
#
# Runners (docs/harness.md "ix runners"): every Linux job runs on indexable's ix runners
# (https://ix.dev/docs/runners), on Linux AArch64: the build and unit tests on 64 vCPUs whose
# memory grows on demand up to 256 GiB, where a hosted runner's 16 GB a build of blaze outgrows
# into swap for an hour or more and was shut down in (#1654), each forking the snapshot its own
# job's last green run on main left, store and checkout included; the small jobs on ix's default
# size. TODO(x86-64): ix has no x86-64 capacity today, so nothing is built or tested on Linux
# x86-64; `linux-x64-cross` cross-compiles blaze for it and does not run it. One job runs on a Mac,
# `macos` on main's push: blaze's unit tests on macOS, which run only on macOS, and blaze cannot
# yet cross-compile for macOS from Linux (no macOS SDK or darwin clang there, and llvm-sys runs
# the target LLVM's Mach-O llvm-config). A pull request from a fork runs only once a maintainer
# approves it (fork pull request policy `all_external_contributors`), and a run off main never
# becomes a snapshot.
name: blaze
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  # A pull request's newer push cancels its run before. Main runs one push at a time: a push
  # while one runs waits, and a newer push replaces the one waiting, never the one running, so
  # each run ends and covers every merge up to its commit. A group of its own per push stacked
  # up a full three-platform run per merge (17 at once on 2026-10-28, each waiting on macOS
  # runners) and none of them got runners in time. A merge-queue entry or a run by hand is
  # still a group of its own.
  group: blaze-${{ github.event_name == 'push' && 'main' || format('{0}-{1}', github.event_name, github.event_name == 'pull_request' && github.ref || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # blaze's whole machine: no one sits at a CI runner (docs/cargo.md, "Cores and priority").
  BLAZE_CORES: all

jobs:
  # Which tier runs: `gate` for a pull request and the merge queue, `warm` for a push to main
  # (or by hand), or `none` for a change that touches no file the tier reads (the pull
  # request's files, the merge queue entry's or the push's against the commit before it;
  # .github/scripts/gate_changes.py). Anything that cannot be told counts as code.
  changes:
    name: changes
    runs-on: [ix, arm64]
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.files.outputs.tier }}
    steps:
      # The script alone: the job decides in seconds, before a whole checkout.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'warm' || 'gate' }}
          # Empty on a run by hand, which then counts as code.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          python3 .github/scripts/gate_changes.py \
            "{\"tier\": \"$TIER\", \"repository\": \"$GITHUB_REPOSITORY\", \"base\": \"$BASE\", \"head\": \"$HEAD\"}"

  scripts:
    name: harness imports, rustc sites
    runs-on: [ix, arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      # The repository's Python workspace (pyproject.toml, uv.lock): its scripts lint and type-check.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
          enable-cache: false
      - run: uv run --frozen ruff check
      - run: uv run --frozen pyright
      # Some scripts ask rustc for the host when imported: after the toolchain is installed. In
      # the workspace's Python, which has its helpers (tools/typed-input) for the scripts that use them.
      - run: uv run --frozen python harness/imports.py
      # No new place in blaze's code starts rustc, rustdoc or cargo (docs/no-rustc.md).
      - run: python3 harness/rustcsites.py
      # The agent rules: tools/agents/rules.ts type-checks, and AGENTS.md and the rules in .agents/skills/*/SKILL.md are what it generates.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --cwd site
      - run: site/node_modules/.bin/tsc -p tools/agents
      - run: bun tools/agents/rules.ts --check
      # Each doc says what it is, the current ones hold against the tree, and docs/README.md is
      # their index (tools/docs.py).
      - run: python3 tools/docs.py check
      # Each hash domain in crates/ is written once outside tests (tools/v2/domains.py).
      - run: |
          uv run --frozen python tools/v2/domains.py '{"root": "."}'

  # Every workflow parses and holds together (actionlint): a workflow whose YAML does not parse
  # fails on push with no jobs and says so nowhere (release.yaml, promote.yaml and yank.yaml after
  # #1691, an unquoted `: ` in a `run:` line). The local actions (.github/actions/*/action.yml) are
  # parsed where a workflow uses them. actionlint's own checks only: its shellcheck and pyflakes
  # passes are off. What it is told to ignore is in .github/actionlint.yaml.
  workflows:
    name: actionlint
    runs-on: [ix, arm64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      # The release binary, checked by its sha256 (rhysd/actionlint's checksums.txt).
      - name: actionlint 1.7.12
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            ARM64) arch=arm64 sum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "::error::no pinned actionlint for $RUNNER_ARCH"; exit 1 ;;
          esac
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_$arch.tar.gz"
          echo "$sum  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes='

  # TODO(x86-64): no Linux x86-64 test runs anywhere until ix has x86-64 capacity (docs/harness.md
  # "ix runners"). Until then blaze is cross-compiled for x86_64-unknown-linux-gnu on an AArch64
  # ix runner, and not run: the target's LLVM `llvm-config` (which llvm-sys's build script runs)
  # under qemu-user, and Ubuntu's x86-64 cross gcc and glibc for the C and C++ and the start
  # files blaze's linker asks the C driver for. Not in `ci`'s needs until it has passed once.
  linux-x64-cross:
    name: linux x64 (cross-compiled, not run)
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: [ix, arm64, ix-cpu-64, blaze-linux-x64-cross]
    timeout-minutes: 150
    env:
      # Read by blaze's daemon when it starts (blaze-link's C driver, cc-rs in build scripts), so
      # set for the whole job. llvm-sys finds libstdc++ by asking plain CXX.
      CC_x86_64_unknown_linux_gnu: x86_64-linux-gnu-gcc
      CXX_x86_64_unknown_linux_gnu: x86_64-linux-gnu-g++
      CXX: x86_64-linux-gnu-g++
      LLVM_SYS_231_PREFIX: /usr/local/lib/blaze-llvm/x86_64-unknown-linux-gnu
      # The x86-64 llvm-config's own libraries, for qemu-user.
      QEMU_LD_PREFIX: /usr/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: x86-64 cross gcc and glibc, qemu-user
        uses: ./.github/actions/apt
        with:
          packages: gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libc6-dev-amd64-cross qemu-user-static binfmt-support
      - name: qemu-user runs x86-64 programs
        run: |
          sudo systemctl restart systemd-binfmt || sudo update-binfmts --enable qemu-x86_64
          test -e /proc/sys/fs/binfmt_misc/qemu-x86_64 || { echo "::error::binfmt_misc has no qemu-x86_64 entry: the x86-64 llvm-config cannot run"; exit 1; }
      - id: blaze
        uses: ./.github/actions/blaze
        with:
          job: cross-x86_64
      - name: LLVM for x86_64-unknown-linux-gnu (the pin)
        run: |
          sudo mkdir -p /usr/local/lib/blaze-llvm
          sudo chown "$(id -u):$(id -g)" /usr/local/lib/blaze-llvm
          python3 .github/scripts/llvm.py fetch --target x86_64-unknown-linux-gnu --dir "$LLVM_SYS_231_PREFIX"
          "$LLVM_SYS_231_PREFIX/bin/llvm-config" --version
      - run: blaze build --release --locked -p blaze-engine --target x86_64-unknown-linux-gnu
      - name: an x86-64 ELF, not run
        run: |
          for bin in blaze-engine blaze; do
            f="target/x86_64-unknown-linux-gnu/release/$bin"
            file "$f" | tee /dev/stderr | grep -q 'ELF 64-bit LSB .*x86-64' || { echo "::error::$f is not an x86-64 ELF"; exit 1; }
          done

  # The gate's build and unit tests, on ix (blaze-platform.yaml). On a push to main, the caches
  # for the train's runs and the next push's, and the snapshots the gate's runs fork.
  linux-arm64:
    name: linux arm64
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    uses: ./.github/workflows/blaze-platform.yaml
    # For main's push of blaze's store (the cache-writer environment's secrets).
    secrets: inherit
    with:
      platform: linux-arm64
      os: ubuntu-24.04-arm
      tier: ${{ needs.changes.outputs.tier }}
      smoke: true

  macos:
    name: macos arm64
    needs: changes
    if: needs.changes.outputs.tier == 'warm'
    uses: ./.github/workflows/blaze-platform.yaml
    # For main's push of blaze's store (the cache-writer environment's secrets).
    secrets: inherit
    with:
      platform: macos-arm64
      os: macos-15
      tier: warm

  # TODO(macos): macOS's check left the gate with the move to ix (one Mac job, `macos`); it comes
  # back as `--target aarch64-apple-darwin` here once a check no longer runs the target LLVM's
  # Mach-O llvm-config (docs/harness.md "ix runners").
  # The release .github/blaze-version names loads and checks blaze's whole workspace, as a
  # contributor's `blaze check --workspace` does: 0.20261028.7 could not load it, and no job ran
  # it. Installed and given the pinned LLVM (LLVM_SYS_231_PREFIX, which llvm-sys's build script
  # reads) by .github/actions/blaze, with no Nix, as the build is. Its store's project is its
  # own and nothing pushes it, so the pull needs no secret; a run starts from the store main's
  # last green run left in its ix snapshot.
  workspace-check:
    name: blaze check --workspace, linux arm64
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: [ix, arm64, ix-cpu-64, blaze-workspace-check]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/blaze
        with:
          job: check
          llvm: true
      - run: blaze check --workspace --message-format short
      # astlog's rules (tools/astlog/rules) over the crates and tools, each file on its own: a
      # finding of an error rule fails the job (tools/astlog/README.md#rules-in-blaze).
      - run: blaze build -p astlog
      - run: >-
          PYTHONPATH=tools/typed-input/src python3 tools/astlog/scan.py
          '{"astlog": "target/debug/astlog", "rules": "tools/astlog/rules", "paths": ["crates", "tools"], "exclude": ["crates/harness"]}'

  # AGENTS.md rule fix-through-blaze-lints: each clippy and blaze lint's findings, counted by
  # crate, may only shrink. crates/blaze-lints/baselines holds the counts, one file per lint;
  # a count over its baseline, or a lint with findings and no baseline, fails the job, and so
  # does a count under its baseline, which `--bless-baselines` lowers (blaze_lints::baseline,
  # docs/cargo.md#lints). It runs the blaze this tree builds, not the release: the counts are
  # of the lints this tree defines, so a change to a lint and to its baseline land together.
  # The counts are of aarch64-unknown-linux-gnu's cfg (the directory's TARGET), so this runs on
  # Linux AArch64 and builds blaze there as the build job does, from the store main's pushes
  # keep warm for it. Each package's default targets: blaze's check of test targets fails for
  # now ("can't find crate for `test`"), so tests are counted once it passes. No baseline is
  # made yet, as blaze cannot yet finish this check of its own workspace, so the job fails until
  # a run does and makes them (docs/v2/plan/lanes/lints.md#baselines).
  lint-baselines:
    name: lint baselines
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    # On a 64-vCPU ix runner, as blaze-platform.yaml's build.
    runs-on: [ix, arm64, ix-cpu-64, blaze-lint-baselines]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - id: blaze
        uses: ./.github/actions/blaze
        with:
          job: build
          llvm: true
      - name: blaze build --release (the build job's)
        run: |
          python3 harness/unittests.py '{"build": true}'
      # The release's daemon ends first; the tree's blaze runs its own, from a home of its own.
      - run: blaze stop
      - env:
          BLAZE_HOME: ${{ runner.temp }}/tree-blaze-home
        run: >-
          target/release/blaze check --workspace --target aarch64-unknown-linux-gnu
          --message-format short --baselines crates/blaze-lints/baselines

  ci:
    name: ci
    needs: [changes, scripts, workflows, linux-arm64, macos, workspace-check]  # lint-baselines joins once the first baselines exist (blaze check --workspace crashes today)
    if: always()
    runs-on: [ix, arm64]
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          ! echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null
