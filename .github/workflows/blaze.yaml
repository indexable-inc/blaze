# blaze: the merge gate. What a pull request and each entry of the merge queue has to pass,
# kept to a few minutes so that the queue moves: one build of blaze and the unit tests on Linux
# AArch64, a build for Linux x86-64 cross-compiled there, and the checks of the harness scripts. Everything else, every harness on every
# platform, runs after the merge, in the release train (train.yaml), which releases main when
# it is green and opens an issue when it is not. What runs where, and how long it takes, is in
# docs/harness.md ("CI").
#
#   pull request, merge queue (about 5 minutes): the unit tests and the build on Linux AArch64,
#       `blaze check --workspace` and `blaze check --workspace --all-targets` (every crate's
#       test targets type-check) with the release on Linux AArch64,
#       the lint baselines (crates/blaze-lints/baselines) with the blaze the tree builds, on
#       Linux AArch64,
#       `harness/imports.py` and `rustcsites` (scripts/), actionlint over the workflows. No `blaze fmt --check`: fmt.yaml
#       formats main after each push instead.
#   push to main: the build and the unit tests on Linux AArch64 and macOS, which
#       write the caches every other run reads, and the same `blaze check --workspace`. One runs at a time: the next push waits, and a
#       newer one replaces it, so each run ends and writes the caches as of its commit.
#
# A change runs the build and the unit tests only when it touches a file they read: the crates,
# the vendored crates, astlog (tools/astlog), the workspace's manifest, lock file, cargo
# config, .rustfmt.toml and .clippy.toml, the pinned nightly (harness/toolchain),
# harness/unittests.py, the flake, the release of blaze that builds blaze
# (.github/blaze-version, site/install.sh), and these workflows and the actions they use; on a push
# to main, also the smoke corpus (harness/smoke.py, harness/smoke/).
# scripts/src/bin/gate_changes.rs has the list and why each path is on it. It names what is
# code, so a new directory is not: any other change (documentation, the site, benches, the
# other harnesses and workflows) runs the script checks alone, and a list of files that cannot
# be had counts as code. `ci` is the one check that says whether everything that ran passed: it
# is the check branch rules and the merge queue require. The queue tests each pull request
# merged onto main and whatever is ahead of it, and main moves only to what it tested.
#
# Runners (docs/harness.md "ix runners"): every Linux job runs on indexable's ix runners
# (https://ix.dev/docs/runners), on Linux AArch64: the build and unit tests on 64 vCPUs whose
# memory grows on demand up to 256 GiB, where a hosted runner's 16 GB a build of blaze outgrows
# into swap for an hour or more and was shut down in (#1654), each forking the snapshot its own
# job's last green run on main left, store and checkout included; the small jobs on ix's default
# size. TODO(x86-64): ix has no x86-64 capacity today, so nothing is built or tested on Linux
# x86-64; `linux-x64-cross` cross-compiles blaze for it and does not run it. One job runs on a Mac,
# `macos` on main's push: blaze's unit tests on macOS, which run only on macOS, and blaze cannot
# yet cross-compile for macOS from Linux (no macOS SDK or darwin clang there, and llvm-sys runs
# the target LLVM's Mach-O llvm-config). A pull request from a fork runs only once a maintainer
# approves it (fork pull request policy `all_external_contributors`), and a run off main never
# becomes a snapshot.
name: blaze
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  # A pull request's newer push cancels its run before. Main runs one push at a time: a push
  # while one runs waits, and a newer push replaces the one waiting, never the one running, so
  # each run ends and covers every merge up to its commit. A group of its own per push stacked
  # up a full three-platform run per merge (17 at once on 2026-10-28, each waiting on macOS
  # runners) and none of them got runners in time. A merge-queue entry or a run by hand is
  # still a group of its own. A push groups by its ref: a push to a lane branch shares no group
  # with main (2026-11-05: lane-branch pushes sat in `blaze-main` and kept replacing main's
  # waiting run, so no main run finished all day).
  group: blaze-${{ github.event_name == 'push' && github.ref || format('{0}-{1}', github.event_name, github.event_name == 'pull_request' && github.ref || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # blaze's whole machine: no one sits at a CI runner (docs/cargo.md, "Cores and priority").
  BLAZE_CORES: all

jobs:
  # Which tier runs: `gate` for a pull request and the merge queue, `warm` for a push to main
  # (or by hand), or `none` for a change that touches no file the tier reads (the pull
  # request's files, the merge queue entry's or the push's against the commit before it;
  # scripts/src/bin/gate_changes.rs). Anything that cannot be told counts as code.
  changes:
    name: changes
    runs-on: [ix, arm64]
    # The built scripts from the Actions cache take seconds (./.github/actions/script); a miss,
    # once per change of their inputs, installs the release and builds scripts/ from the
    # runner's store (an ix runner starts from main's last green disk). Neither is measured yet.
    timeout-minutes: 12
    outputs:
      tier: ${{ steps.files.outputs.tier }}
    steps:
      # Only what the script action's key reads (.github/actions/script/key.sh); a miss checks
      # the rest out.
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.cargo/
            /scripts/
            /crates/blaze-script/
            /harness/toolchain
            /Cargo.toml
            /Cargo.lock
      - uses: ./.github/actions/script
        with:
          job: changes
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'warm' || 'gate' }}
          # Empty on a run by hand, which then counts as code.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          "$BLAZE_SCRIPTS/gate_changes" \
            "{\"tier\": \"$TIER\", \"repository\": \"$GITHUB_REPOSITORY\", \"base\": \"$BASE\", \"head\": \"$HEAD\"}"

  scripts:
    name: harness imports, rustc sites
    runs-on: [ix, arm64]
    # 10 before the Rust scripts; the built scripts come from the Actions cache in seconds, and a
    # miss (the release's install and a build of scripts/) comes on top (not yet measured).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      # The repository's Python workspace (pyproject.toml, uv.lock): its scripts lint and type-check.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      - run: uv run --frozen ruff check
      - run: uv run --frozen pyright
      # Some scripts ask rustc for the host when imported: after the toolchain is installed. In
      # the workspace's Python, which has its helpers (tools/typed-input) for the scripts that use them.
      - run: uv run --frozen python harness/imports.py
      # The list of tests that may fail holds together and is as its recorder writes it, and the
      # comparison and the recording do what they say on made-up results.
      - run: uv run --frozen python harness/failures.py selftest
      # The agent rules: tools/agents/rules.ts type-checks, and AGENTS.md and the rules in .agents/skills/*/SKILL.md are what it generates.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --cwd site
      # Under bun: tsc's script asks for node, which ix's runner image does not have.
      - run: bun site/node_modules/.bin/tsc -p tools/agents
      - run: bun tools/agents/rules.ts --check
      # The repository's Rust scripts (scripts/, docs/v2/plan/design/scripts.md), built by the
      # release .github/blaze-version names, never by the blaze this tree builds: a tree whose
      # compiler does not build must still be checked (the stage-0 rule). From the Actions cache
      # when their inputs are unchanged (./.github/actions/script). No LLVM: the scripts link none.
      - uses: ./.github/actions/script
        with:
          job: scripts
      # Each doc says what it is, the current ones hold against the tree, and docs/README.md is
      # their index (scripts/src/bin/docs.rs). And no Python file is added: tools/python-allowed.txt
      # lists the ones left and only shrinks (docs/v2/plan/design/scripts.md).
      - run: |
          "$BLAZE_SCRIPTS/docs" selftest
          "$BLAZE_SCRIPTS/docs" check
      # No new place in blaze's code starts rustc, rustdoc or cargo (docs/no-rustc.md,
      # scripts/src/bin/rustcsites.rs).
      - run: '"$BLAZE_SCRIPTS/rustcsites"'
      # The objectives ledger's rows are well formed and its table is current (scripts/src/bin/ledger.rs).
      - run: |
          "$BLAZE_SCRIPTS/ledger" selftest
          "$BLAZE_SCRIPTS/ledger" '{"command": "check"}'
      # The budget harness's own parts hold: which rows an input selects, the daemon home's layout
      # against the daemon's rule, the smoke's edit on the fixture (harness/v2/budgets.py). Its
      # smoke, against the blaze a change builds, is blaze-platform.yaml's profile-gate job.
      - run: uv run --frozen python harness/v2/budgets.py selftest
      # The smoke's guards (harness/v2/guards.py): each finding a bound is for, in miniature, is
      # refused by its bound and the fixed state passes; the known list reads; a result with a
      # guard missing is refused. And which packages a change touches (scripts/src/bin/changed.rs).
      - run: |
          uv run --frozen python harness/v2/guards.py selftest
          "$BLAZE_SCRIPTS/changed" selftest
      # Every stated invariant has a control beside it, and docs/v2/plan/invariants.md lists them
      # (scripts/src/bin/invariants.rs).
      - run: |
          "$BLAZE_SCRIPTS/invariants" selftest
          "$BLAZE_SCRIPTS/invariants" '{"command": "check"}'
      # blaze-diff's Rust tables and the Lean ones the proofs are about are what
      # crates/blaze-diff/rules.json generates (scripts/src/bin/diff_rules.rs).
      - run: |
          "$BLAZE_SCRIPTS/diff_rules" selftest
          "$BLAZE_SCRIPTS/diff_rules" '{"command": "check"}'
      # The Lean proofs, as far as no Lean is needed (harness/v2/lean_gate.py): the list of
      # theorems (lean/theorems.json) names statements that are there, no source says `sorry`,
      # `native_decide`, `axiom` or `partial def`, lean/analysis's manifest is checked in at the
      # pinned Mathlib, and docs/v2/plan/proofs.md is current. The `lean` job builds them.
      - run: |
          uv run --frozen python harness/v2/lean_gate.py selftest
          uv run --frozen python harness/v2/lean_gate.py '{"command": "sources"}'
      # Each hash domain in crates/ is written once outside tests (scripts/src/bin/domains.rs).
      - run: |
          "$BLAZE_SCRIPTS/domains" '{"root": "."}'
      # A change of blaze-profile's schema version lands only once ix.dev/explore reads it
      # (.github/scripts/explore_page.py; release.yaml checks every release too).
      - name: ix.dev/explore reads a new profile schema
        run: |
          git fetch -q --depth=1 origin main
          version() { grep -E '^pub const VERSION: u32' "$@"; }
          if [ "$(git show FETCH_HEAD:crates/blaze-profile/src/schema.rs | version)" != "$(version crates/blaze-profile/src/schema.rs)" ]; then
            uv run --frozen python .github/scripts/explore_page.py '{}'
          fi

  # The Lean proofs hold (rule verified-compiler; harness/v2/lean_gate.py, docs/v2/plan/proofs.md):
  # with the Lean lean/lean-toolchain pins, `lake build` of lean/ (core Lean: the semantics of
  # MIR, the proved passes, the models and their proofs) and of lean/analysis (the derivative
  # proofs, on Mathlib's prebuilt files from `lake exe cache get`: Mathlib is never compiled);
  # no declaration uses `sorry`; and each theorem of lean/theorems.json exists and rests on no
  # axiom but `propext`, `Classical.choice` and `Quot.sound` (`#print axioms`). On every change:
  # a proof is about the Rust beside it (the embedded bodies, the rule table), so no list of
  # paths says when it need not run. elan is the release binary, checked by its sha256; it and
  # Mathlib's files are cached by the toolchain and lean/analysis's pins, and lean/'s own build
  # by its sources. About 4 minutes from the caches and about 15 without (not yet measured).
  lean:
    name: lean proofs
    runs-on: [ix, arm64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.elan
            lean/analysis/.lake
          key: lean-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/analysis/lakefile.toml', 'lean/analysis/lake-manifest.json') }}
      - uses: actions/cache@v6
        with:
          path: lean/.lake
          key: lean-core-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/**/*.lean', 'crates/*/lean/**/*.lean', 'lean/lakefile.toml') }}
          restore-keys: lean-core-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-
      # The release binary of elan, checked by its sha256, then the toolchain lean/lean-toolchain
      # pins. The gate names that toolchain's `lake` by its path, never PATH.
      - name: elan 4.2.4 and the pinned Lean
        run: |
          pin=$(cat lean/lean-toolchain)
          lake="$HOME/.elan/toolchains/$(echo "$pin" | sed 's|/|--|g; s|:|---|g')/bin/lake"
          if [ ! -x "$lake" ]; then
            case "$RUNNER_ARCH" in
              ARM64) arch=aarch64 sum=05febd124d84ebf994b2e7479922a5650b1e950c17ae3bd1ddd776b65bb72bf9 ;;
              *) echo "::error::no pinned elan for $RUNNER_ARCH"; exit 1 ;;
            esac
            tgz="$RUNNER_TEMP/elan.tar.gz"
            curl -fsSL --retry 3 -o "$tgz" "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-$arch-unknown-linux-gnu.tar.gz"
            echo "$sum  $tgz" | sha256sum -c -
            tar -xzf "$tgz" -C "$RUNNER_TEMP" elan-init
            "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
            "$HOME/.elan/bin/elan" toolchain install "$pin"
          fi
          "$lake" --version
      - run: |
          uv run --frozen python harness/v2/lean_gate.py '{"command": "check"}'

  # Every workflow parses and holds together (actionlint): a workflow whose YAML does not parse
  # fails on push with no jobs and says so nowhere (release.yaml, promote.yaml and yank.yaml after
  # #1691, an unquoted `: ` in a `run:` line). The local actions (.github/actions/*/action.yml) are
  # parsed where a workflow uses them. actionlint's own checks only: its shellcheck and pyflakes
  # passes are off. What it is told to ignore is in .github/actionlint.yaml.
  workflows:
    name: actionlint
    runs-on: [ix, arm64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      # The release binary, checked by its sha256 (rhysd/actionlint's checksums.txt).
      - name: actionlint 1.7.12
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            ARM64) arch=arm64 sum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "::error::no pinned actionlint for $RUNNER_ARCH"; exit 1 ;;
          esac
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_$arch.tar.gz"
          echo "$sum  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes='

  # TODO(x86-64): no Linux x86-64 test runs anywhere until ix has x86-64 capacity (docs/harness.md
  # "ix runners"). Until then blaze is cross-compiled for x86_64-unknown-linux-gnu on an AArch64
  # ix runner, and not run: the target's LLVM `llvm-config` (which llvm-sys's build script runs)
  # under qemu-user, and Ubuntu's x86-64 cross gcc and glibc for the C and C++ and the start
  # files blaze's linker asks the C driver for. Not in `ci`'s needs until it has passed once.
  # llvm-sys is built twice: for the target (hir-ty-codegen, through blaze-engine) and for the
  # host (a build-dependency of blaze-stencil's build script, which runs here). blaze gives each
  # run of its build script the LLVM llvm.json pins for that run's target (a pinned native input,
  # Cargo.toml's `[workspace.metadata.blaze.native.llvm]`, set over the shell's
  # LLVM_SYS_231_PREFIX), so the job fetches and names none. The C and C++ compilers are named
  # for the target only: cc-rs (and llvm-sys's libstdc++.a, which it asks cc-rs's compiler for)
  # takes CC_<target>/CXX_<target> before plain CC/CXX, so the host copy keeps the runner's own
  # gcc. A plain CXX here would give the host copy x86-64 libstdc++.a and objects.
  linux-x64-cross:
    name: linux x64 (cross-compiled, not run)
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: [ix, arm64, ix-cpu-64, blaze-linux-x64-cross]
    timeout-minutes: 150
    env:
      # Read by blaze's daemon when it starts (blaze-link's C driver, cc-rs in build scripts), so
      # set for the whole job. For the target alone: no plain CC or CXX (see above).
      CC_x86_64_unknown_linux_gnu: x86_64-linux-gnu-gcc
      CXX_x86_64_unknown_linux_gnu: x86_64-linux-gnu-g++
      # The x86-64 llvm-config's own libraries, for qemu-user.
      QEMU_LD_PREFIX: /usr/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: x86-64 cross gcc and glibc, qemu-user
        uses: ./.github/actions/apt
        with:
          packages: gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libc6-dev-amd64-cross qemu-user-static binfmt-support
      - name: qemu-user runs x86-64 programs
        run: |
          sudo systemctl restart systemd-binfmt || sudo update-binfmts --enable qemu-x86_64
          test -e /proc/sys/fs/binfmt_misc/qemu-x86_64 || { echo "::error::binfmt_misc has no qemu-x86_64 entry: the x86-64 llvm-config cannot run"; exit 1; }
      - id: blaze
        uses: ./.github/actions/blaze
        with:
          job: cross-x86_64
      - run: blaze build --release --locked -p blaze-engine --target x86_64-unknown-linux-gnu
      - name: an x86-64 ELF, not run
        run: |
          for bin in blaze-engine blaze; do
            f="target/x86_64-unknown-linux-gnu/release/$bin"
            file "$f" | tee /dev/stderr | grep -q 'ELF 64-bit LSB .*x86-64' || { echo "::error::$f is not an x86-64 ELF"; exit 1; }
          done
      # Why the daemon ended, when it did (the client does not say).
      - if: failure()
        uses: ./.github/actions/daemon-log

  # What blaze cross-builds is run (ledger row X1, docs/v2/plan/design/toolchain-c.md "Cross
  # compilation"): the probe (harness/v2/cross/probe: hello, threads, a file, TCP loopback, a
  # panic with a backtrace) is built for each Linux glibc triple with nothing of the machine (no
  # cross gcc, no CC_*: `scripts --bin cross` builds under `env -i` with an empty PATH), the
  # AArch64 one is run here and the x86-64 one under qemu-user with Debian's x86-64 glibc to load
  # (libc6-amd64-cross and libgcc-s1-amd64-cross are what it runs against, not what it is built
  # with). Not part of `ci` until it has been green on main: it needs no secret, and its runner
  # label is a new one of the same pool as the job above.
  cross-probe:
    name: cross-built, run (linux x64 under qemu-user, linux arm64)
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: [ix, arm64, ix-cpu-64, blaze-cross-probe]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: qemu-user and an x86-64 glibc to run against
        uses: ./.github/actions/apt
        with:
          packages: qemu-user-static libc6-amd64-cross libgcc-s1-amd64-cross
      - id: blaze
        uses: ./.github/actions/blaze
        with:
          job: cross-probe
      - run: blaze build --release --locked -p blaze-engine -p blaze-thin
      - name: build the probe for each triple with nothing of the machine, and run it
        run: |
          mkdir -p "$RUNNER_TEMP/cross-bin"
          cp target/release/blaze-thin "$RUNNER_TEMP/cross-bin/blaze"
          cp target/release/blaze-engine "$RUNNER_TEMP/cross-bin/blaze-engine"
          blaze run -q -p scripts --bin cross -- "$(cat <<JSON
          {"command": "check",
           "engine": {"kind": "v2", "blaze": "$RUNNER_TEMP/cross-bin/blaze"},
           "out": "$RUNNER_TEMP/cross.json",
           "triples": ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"],
           "run": {"aarch64-unknown-linux-gnu": [],
                   "x86_64-unknown-linux-gnu": ["qemu-x86_64-static", "-L", "/usr/x86_64-linux-gnu"]}}
          JSON
          )"
      - if: failure()
        uses: ./.github/actions/daemon-log

  # The gate's build and unit tests, on ix (blaze-platform.yaml). On a push to main, the caches
  # for the train's runs and the next push's, and the snapshots the gate's runs fork.
  linux-arm64:
    name: linux arm64
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    uses: ./.github/workflows/blaze-platform.yaml
    # For main's push of blaze's store (the cache-writer environment's secrets).
    secrets: inherit
    with:
      platform: linux-arm64
      os: ubuntu-24.04-arm
      tier: ${{ needs.changes.outputs.tier }}
      smoke: true

  # The daemon this change builds starts on Linux 6.8: GitHub's hosted ubuntu-22.04 runners
  # boot Ubuntu's linux-azure 6.8 (6.8.0-1070-azure in November 2026), the release's Linux
  # builds run there, and ix's kernel is newer. linux-azure 6.8.0-1063 and later invert
  # io_uring's check of a provided buffer ring's reserved words (blaze-core's
  # `ReservedCheck`), which stopped every daemon start of v0.20261105.3's release. The
  # binary is the linux-arm64 build's, linked against the ix image's glibc (Ubuntu 24.04's),
  # so it runs in an ubuntu:24.04 container, which shares the host's kernel; Docker's default
  # seccomp profile refuses io_uring, so the container's is off.
  linux-6-8:
    name: daemon starts on Linux 6.8 (hosted ubuntu-22.04-arm)
    needs: [changes, linux-arm64]
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    container:
      image: ubuntu:24.04
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    env:
      # As in `docker run`: the runner's /github/home belongs to its own user.
      HOME: /root
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blaze-linux-arm64
      - name: blaze serve listens, blaze status sees it, blaze stop ends it
        run: |
          tar -xf blaze.tar && uname -r
          ./blaze serve > serve.log 2>&1 & serve=$!
          for _ in $(seq 120); do
            ./blaze status | grep -qvx "no daemon is running" && break
            kill -0 "$serve" 2>/dev/null || { cat serve.log; echo "::error::blaze serve ended before it listened on Linux $(uname -r)"; exit 1; }
            sleep 0.5
          done
          ./blaze status | grep -qvx "no daemon is running" || { cat serve.log; echo "::error::blaze serve did not listen within 60 s on Linux $(uname -r)"; exit 1; }
          ./blaze stop && wait "$serve"

  macos:
    name: macos arm64
    needs: changes
    if: needs.changes.outputs.tier == 'warm'
    uses: ./.github/workflows/blaze-platform.yaml
    # For main's push of blaze's store (the cache-writer environment's secrets).
    secrets: inherit
    with:
      platform: macos-arm64
      os: macos-15
      tier: warm

  # TODO(macos): macOS's check left the gate with the move to ix (one Mac job, `macos`); it comes
  # back as `--target aarch64-apple-darwin` here once a check no longer runs the target LLVM's
  # Mach-O llvm-config (docs/harness.md "ix runners").
  # The release .github/blaze-version names loads and checks blaze's whole workspace, as a
  # contributor's `blaze check --workspace` does: 0.20261028.7 could not load it, and no job ran
  # it. Installed and given the pinned LLVM (LLVM_SYS_231_PREFIX, which llvm-sys's build script
  # reads) by .github/actions/blaze, with no Nix, as the build is. Its store's project is its
  # own and nothing pushes it, so the pull needs no secret; a run starts from the store main's
  # last green run left in its ix snapshot.
  workspace-check:
    name: blaze check --workspace, linux arm64
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: [ix, arm64, ix-cpu-64, blaze-workspace-check]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/blaze
        with:
          job: check
          llvm: true
      - uses: ./.github/actions/script
        with:
          job: check
      # The fast tier: the packages the change touches and those that depend on them, each
      # after what it needs (scripts/src/bin/changed.rs), checked before the workspace, so a change's
      # first compile error comes in minutes and names the earliest cause. What it checks the
      # workspace check below finds checked. Against the base itself: the checkout is shallow.
      - name: blaze check of the packages this change touches
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git fetch -q --depth=1 origin "$BASE"; then
            echo "no base to compare with: the workspace check below is the check"; exit 0
          fi
          args=$("$BLAZE_SCRIPTS/changed" "{\"base\": \"$BASE\", \"direct\": true, \"print\": \"args\"}")
          if [ -z "$args" ] || [ "$args" = --workspace ]; then
            echo "nothing narrower than the workspace to check first: ${args:-no package changed}"; exit 0
          fi
          echo "blaze check $args --lib --tests"
          # shellcheck disable=SC2086
          blaze check $args --lib --tests --message-format short
      - run: blaze check --workspace --message-format short
      # Every target, the test targets among them: a test that no longer type-checks against
      # the code it tests fails here, in every crate, where the unit tests job compiles the test
      # targets of harness/unittests.py's CRATES alone (2026-11-09: blaze-cas's place_race.rs and
      # hir-ty-mir's tests/consteval/comptime.rs did not compile on main). A step of its own,
      # after the libraries', so the log says which of the two failed; what the first checked
      # is not checked again.
      - name: blaze check --workspace --all-targets (the test targets compile)
        run: blaze check --workspace --all-targets --message-format short
      # astlog's rules (tools/astlog/rules) over the crates and tools, each file on its own: a
      # finding of an error rule fails the job (tools/astlog/README.md#rules-in-blaze).
      - run: blaze build -p astlog
      - run: >-
          PYTHONPATH=tools/typed-input/src python3 tools/astlog/scan.py
          '{"astlog": "target/debug/astlog", "rules": "tools/astlog/rules", "paths": ["crates", "tools"], "exclude": ["crates/harness"]}'
      # Why the daemon ended, when it did (the client does not say).
      - if: failure()
        uses: ./.github/actions/daemon-log

  # AGENTS.md rule fix-through-blaze-lints: each clippy and blaze lint's findings, counted by
  # crate, may only shrink. crates/blaze-lints/baselines holds the counts, one file per lint;
  # a count over its baseline, or a lint with findings and no baseline, fails the job, and so
  # does a count under its baseline, which `--bless-baselines` lowers (blaze_lints::baseline,
  # docs/cargo.md#lints). It runs the blaze this tree builds, not the release: the counts are
  # of the lints this tree defines, so a change to a lint and to its baseline land together.
  # The counts are of aarch64-unknown-linux-gnu's cfg (the directory's TARGET), so this runs on
  # Linux AArch64 and builds blaze there as the build job does, from the store main's pushes
  # keep warm for it. Each package's default targets: blaze's check of test targets fails for
  # now ("can't find crate for `test`"), so tests are counted once it passes. The `blaze.*.txt`
  # baselines are also the ratchet's: each crate a lint's lists is held at `warn` on it, every
  # other crate at `deny` (docs/lints.md, "Workspace levels and the ratchet"). They start with
  # every crate `unmeasured`, so the job fails until a run with `--bless-baselines` records them.
  lint-baselines:
    name: lint baselines
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    # On a 64-vCPU ix runner, as blaze-platform.yaml's build.
    runs-on: [ix, arm64, ix-cpu-64, blaze-lint-baselines]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      # The ratchet only tightens (harness/v2/guards.py, `ratchet`; docs/lints.md, "Workspace
      # levels and the ratchet"): no `blaze.<lint>.txt` holds a crate at `warn` that the base did
      # not, a count over the base's, or a count back at `unmeasured`. Against the base itself:
      # the checkout is shallow.
      - name: the lint ratchet only tightens
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE" ]; then
            echo "no base to compare with (a run by hand): the ratchet is held on pull requests and pushes"; exit 0
          fi
          git fetch -q --depth=1 origin "$BASE"
          PYTHONPATH=tools/typed-input/src python3 harness/v2/guards.py "{\"command\": \"ratchet\", \"base\": \"$BASE\"}"
      - id: blaze
        uses: ./.github/actions/blaze
        with:
          job: build
          llvm: true
      - name: blaze build --release (the build job's)
        run: |
          python3 harness/unittests.py '{"build": true}'
      # The release's daemon ends first; the tree's blaze runs its own, from a home of its own.
      - run: blaze stop
      - env:
          BLAZE_HOME: ${{ runner.temp }}/tree-blaze-home
        run: >-
          target/release/blaze check --workspace --target aarch64-unknown-linux-gnu
          --message-format short --baselines crates/blaze-lints/baselines
      # Why the daemon ended, when it did (the client does not say).
      - if: failure()
        uses: ./.github/actions/daemon-log

  ci:
    name: ci
    needs: [changes, scripts, workflows, lean, linux-arm64, linux-6-8, macos, workspace-check]  # lint-baselines joins once the first baselines exist (blaze check --workspace crashes today)
    if: always()
    runs-on: [ix, arm64]
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          ! echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null
      # The budget smoke's guards ran and held (harness/v2/guards.py, `held`): a tier that builds
      # blaze has the smoke's result, with an outcome that passed for every bound of every step
      # of both fixtures and for the sandbox's probe. A job that was skipped passes the step
      # above; a smoke that did not run, or dropped a guard, fails this one. A gate run that
      # did not run the smoke is red (docs/harness.md, "The smoke's guards").
      - if: needs.changes.outputs.tier != 'none'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.tier != 'none'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      - if: needs.changes.outputs.tier != 'none'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: budgets-smoke-linux-arm64
          path: ${{ runner.temp }}/budgets-smoke
      - name: the budget smoke's guards ran and held
        if: needs.changes.outputs.tier != 'none'
        run: |
          uv run --frozen --no-dev python harness/v2/guards.py "{\"command\": \"held\", \"result\": \"$RUNNER_TEMP/budgets-smoke/budgets-smoke.json\"}"
