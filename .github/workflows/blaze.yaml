# blaze: the merge gate (zero Python, zero uv).
#
#   every change: gate checks (`scripts`), workflow validation (`workflows`), Lean proofs (`lean`);
#   code changes: workspace check, parallel tests, and blaze-sys import audit (`cargo`).
#
# `ci` is the single required status check for branch protection and the merge queue.
name: blaze
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: blaze-${{ github.event_name == 'push' && github.ref || format('{0}-{1}', github.event_name, github.event_name == 'pull_request' && github.ref || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BLAZE_CORES: all

jobs:
  # Fast shell path filter: decides whether code-building jobs (`cargo`) need to run.
  changes:
    name: changes
    runs-on: [ix, arm64]
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.files.outputs.tier }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TIER: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'warm' || 'gate' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "tier=$EVENT_TIER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename' 2>/dev/null || echo "__code__")
          if printf '%s\n' "$files" | grep -qE '^(__code__|crates/|vendor/|library/|pins/|scripts/|tools/astlog/|\.cargo/|\.github/|Cargo\.toml$|Cargo\.lock$|\.rustfmt\.toml$|\.clippy\.toml$)'; then
            echo "tier=$EVENT_TIER" >> "$GITHUB_OUTPUT"
          else
            echo "tier=none" >> "$GITHUB_OUTPUT"
          fi

  # All repository gate checks (tools/gate.txt, identical to `just lint`, zero Python).
  scripts:
    name: gate
    runs-on: [ix, arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/script
        with:
          job: scripts
      - name: the gate (tools/gate.txt, as `just lint`)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            git fetch -q --depth=1 origin "$BASE"
            "$BLAZE_SCRIPTS/gate" "{\"command\": \"run\", \"scripts\": \"$BLAZE_SCRIPTS\", \"base\": \"$BASE\"}"
          else
            echo "no base to compare with: each crate is held to its row only"
            "$BLAZE_SCRIPTS/gate" "{\"command\": \"run\", \"scripts\": \"$BLAZE_SCRIPTS\"}"
          fi

  # Lean formal verification proofs (pure Rust lean_gate runner, zero Python).
  lean:
    name: lean proofs
    runs-on: [ix, arm64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/script
        with:
          job: lean
      - uses: actions/cache@v6
        with:
          path: |
            ~/.elan
            lean/analysis/.lake
          key: lean-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/analysis/lakefile.toml', 'lean/analysis/lake-manifest.json') }}
      - uses: actions/cache@v6
        with:
          path: lean/.lake
          key: lean-core-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/**/*.lean', 'crates/*/lean/**/*.lean', 'lean/lakefile.toml') }}
          restore-keys: lean-core-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-
      - name: elan 4.2.4 and the pinned Lean
        run: |
          pin=$(cat lean/lean-toolchain)
          lake="$HOME/.elan/toolchains/$(echo "$pin" | sed 's|/|--|g; s|:|---|g')/bin/lake"
          if [ ! -x "$lake" ]; then
            case "$RUNNER_ARCH" in
              ARM64) arch=aarch64 sum=05febd124d84ebf994b2e7479922a5650b1e950c17ae3bd1ddd776b65bb72bf9 ;;
              *) echo "::error::no pinned elan for $RUNNER_ARCH"; exit 1 ;;
            esac
            tgz="$RUNNER_TEMP/elan.tar.gz"
            curl -fsSL --retry 3 -o "$tgz" "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-$arch-unknown-linux-gnu.tar.gz"
            echo "$sum  $tgz" | sha256sum -c -
            tar -xzf "$tgz" -C "$RUNNER_TEMP" elan-init
            "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
            "$HOME/.elan/bin/elan" toolchain install "$pin"
          fi
          "$lake" --version
      - name: verify Lean proofs
        run: '"$BLAZE_SCRIPTS/lean_gate" ''{"command": "check"}'''

  # Workflow YAML validation (actionlint only; zero shellcheck / Python linters).
  workflows:
    name: actionlint
    runs-on: [ix, arm64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: actionlint 1.7.12
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            ARM64) arch=arm64 sum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "::error::no pinned actionlint for $RUNNER_ARCH"; exit 1 ;;
          esac
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_$arch.tar.gz"
          echo "$sum  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color -shellcheck='

  # Workspace check, parallel unit tests, and blaze-sys symbol import audit.
  cargo:
    name: check and test, linux arm64
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: [ix, arm64, ix-cpu-64, blaze]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          components: llvm-tools
          targets: x86_64-unknown-linux-gnu aarch64-apple-darwin
      - uses: ./.github/actions/script
        with:
          job: cargo
      - name: cut toolchain shelf
        run: |
          pinned="$(tr -d '[:space:]' < crates/blaze-toolchain/PINNED)"
          shelf="$HOME/.blaze/v2/toolchain"
          tc="$(cat pins/toolchain)"
          cargo +"$tc" fetch --locked --quiet
          reg="$(ls -d "${CARGO_HOME:-$HOME/.cargo}"/registry/cache/index.crates.io-* | head -n 1)"
          if [ -f "$shelf/$pinned" ]; then
            "$BLAZE_SCRIPTS/toolchain_cut" "{\"tree\": \".\", \"targets\": [\"aarch64-apple-darwin\", \"aarch64-unknown-linux-gnu\", \"wasm64-blaze-wasip1\"], \"registry\": \"$reg\", \"shelf\": \"$shelf\", \"write_pin\": false, \"check\": true, \"macro_side\": true}"
          else
            "$BLAZE_SCRIPTS/toolchain_cut" "{\"tree\": \".\", \"targets\": [\"aarch64-apple-darwin\", \"aarch64-unknown-linux-gnu\", \"wasm64-blaze-wasip1\"], \"registry\": \"$reg\", \"shelf\": \"$shelf\", \"write_pin\": false, \"check\": false, \"macro_side\": true}"
            if [ ! -f "$shelf/$pinned" ]; then
              echo "::error::crates/blaze-toolchain/PINNED ($pinned) does not match toolchain_cut output" >&2
              exit 1
            fi
          fi
      - name: cargo check --workspace --exclude blaze-std --all-targets
        run: cargo +"$(cat pins/toolchain)" check --locked --workspace --exclude blaze-std --all-targets --message-format short
      - name: cargo test --workspace --exclude blaze-std
        run: '"$BLAZE_SCRIPTS/ci_test" ''{"exclude": ["blaze-std"]}'''
      - name: blaze-sys imports, per target
        run: |
          tc="$(cat pins/toolchain)"
          sysroot="$(rustc +"$tc" --print sysroot)"
          nm="$sysroot/lib/rustlib/aarch64-unknown-linux-gnu/bin/llvm-nm"
          for triple in aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            timeout -k 30 600 cargo +"$tc" build --locked -p blaze-sys --lib --target "$triple" --target-dir target/sys-imports
            builtins=$(echo "$sysroot/lib/rustlib/$triple/lib/"libcompiler_builtins-*.rlib)
            case "$triple" in
              *-linux-*) extra='' ; os=linux ;;
              *) extra=', "ratchet": "tools/ratchets/blaze-sys-libsystem.txt"' ; os=macos ;;
            esac
            timeout -k 30 120 "$BLAZE_SCRIPTS/sys_imports" "{\"command\": \"check\", \"target\": \"$os\", \"objects\": [\"target/sys-imports/$triple/debug/libblaze_sys.rlib\"], \"builtins\": \"$builtins\", \"nm\": \"$nm\"$extra}"
          done

  # Single required status check summarizing every job expected for this tier.
  ci:
    name: ci
    needs: [changes, scripts, workflows, lean, cargo]
    if: always()
    runs-on: [ix, arm64]
    timeout-minutes: 5
    steps:
      - env:
          TIER: ${{ needs.changes.outputs.tier }}
          R_CHANGES: ${{ needs.changes.result }}
          R_SCRIPTS: ${{ needs.scripts.result }}
          R_WORKFLOWS: ${{ needs.workflows.result }}
          R_LEAN: ${{ needs.lean.result }}
          R_CARGO: ${{ needs.cargo.result }}
        run: |
          set -euo pipefail
          printf '%s\t%s\n' \
            "$R_CHANGES" changes \
            "$R_SCRIPTS" scripts \
            "$R_WORKFLOWS" workflows \
            "$R_LEAN" lean \
            "$R_CARGO" cargo
          case "$TIER" in
            none) expected="changes scripts workflows lean" ;;
            gate|warm) expected="changes scripts workflows lean cargo" ;;
            *) echo "::error::unexpected tier '$TIER'"; exit 1 ;;
          esac
          failed=0
          for r in "$R_CHANGES" "$R_SCRIPTS" "$R_WORKFLOWS" "$R_LEAN" "$R_CARGO"; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then failed=1; fi
          done
          result_of() {
            case "$1" in
              changes) printf '%s' "$R_CHANGES" ;;
              scripts) printf '%s' "$R_SCRIPTS" ;;
              workflows) printf '%s' "$R_WORKFLOWS" ;;
              lean) printf '%s' "$R_LEAN" ;;
              cargo) printf '%s' "$R_CARGO" ;;
            esac
          }
          missed=""
          for job in $expected; do
            if [ "$(result_of "$job")" != success ]; then
              missed="${missed:+$missed, }$job"
            fi
          done
          if [ -n "$missed" ]; then
            echo "::error::tier $TIER expected these jobs to succeed: $missed"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more jobs failed or were cancelled"
            exit 1
          fi
          echo "tier $TIER: all [$expected] succeeded"
