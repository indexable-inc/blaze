name: site

# Builds `site/` and deploys it to Cloudflare Workers from `main`: the Rust renderer's two wasm modules
# (site/renderer/build.py, uploaded as the `site-renderer` artifact that site/renderer/fetch.py downloads), then the
# site with them (Flecs pages rendered to static HTML, served by a Worker). A pull request builds only. Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "site/install.sh"
      - "docs/demo*"
      - "docs/benchmarks/**"
      - ".github/workflows/site.yaml"
  pull_request:
    paths:
      - "site/**"
      - "README.md"
      - "site/install.sh"
      - "docs/demo*"
      - "docs/benchmarks/**"
      - ".github/workflows/site.yaml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main (a newer deploy) or to the pull request cancels the run before it; a run
# by hand is never cancelled.
concurrency:
  group: site-${{ github.event_name }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  # blaze's whole machine: no one sits at a CI runner (docs/cargo.md, "Cores and priority").
  BLAZE_CORES: all

jobs:
  site:
    runs-on: [ix, arm64, ix-mode-cold]
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      # Rust 1.99.0, as site/renderer/rust-toolchain.toml pins it, with its targets and components.
      - uses: ./.github/actions/toolchain
        with:
          targets: wasm32-unknown-unknown wasm32-wasip2
          components: clippy rustfmt
      # The renderer builds with cargo, and no cache, until blaze builds the renderer: what ships
      # is its own Rust release's wasm32 with LTO at opt-level z, and blaze's wasm32 modules are
      # still many times rustc's size (docs/platforms.md, "wasm32").
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The release build for the runner's architecture (the ix runners are AArch64; an x86-64
      # wasm-opt there fails with "Exec format error"), checked by its sha256 (the release's own
      # .sha256 files).
      - name: wasm-opt (binaryen version_133)
        env:
          BINARYEN: version_133
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=x86_64 sum=2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 ;;
            ARM64) arch=aarch64 sum=89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8 ;;
            *) echo "::error::no pinned binaryen $BINARYEN for $RUNNER_ARCH"; exit 1 ;;
          esac
          tgz="$RUNNER_TEMP/binaryen.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-$arch-linux.tar.gz"
          echo "$sum  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"
      - name: Renderer
        run: |
          # The image has clang-18; llvm-ar-18 is in llvm-18 (a no-op when both are there).
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends clang-18 llvm-18
          # From inside renderer/: `cargo fmt --manifest-path` from site/ fails with "Failed to find targets".
          (cd renderer && cargo fmt --all --check)
          uv run --script renderer/build.py
        env:
          # Flecs's C for wasm32 (flecs-c's build.rs): the runner's clang has the wasm32 backend.
          CC_wasm32_unknown_unknown: clang-18
          AR_wasm32_unknown_unknown: llvm-ar-18
      - uses: actions/upload-artifact@v7
        with:
          name: site-renderer
          path: |
            site/renderer/target/site/site.wasm
            site/renderer/target/site/site-snapshot.wasm
          if-no-files-found: error
      - uses: oven-sh/setup-bun@v2
      # The .flecs content mapper runs under node (type stripping, node:wasi).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      # Without the token there is nothing to deploy with: the build above is still checked, and
      # the run says what is missing instead of failing every push that touches the site.
      - name: Deploy credentials
        id: credentials
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::warning::site not deployed: the secret CLOUDFLARE_API_TOKEN is not set in indexable-inc/blaze's Actions secrets"
      - name: Deploy
        if: steps.credentials.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
