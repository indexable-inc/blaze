name: yank

# Yanks a release of blaze (docs/release.md, "Yanking a release"): the line `blaze-yanked: <reason>` at the top of its
# notes, each channel's pointer moved to the channel's newest release that is not yanked, and latest.json written
# again, so every blaze that runs it or pins it says so on every command, CI too, from the daemon's next check (at
# most five minutes). An empty reason takes the yank back. By hand: gh workflow run yank.yaml -f tag=v0.YYYYMMDD.N
# -f reason="miscompiles drops (#1234)".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the release, v0.YYYYMMDD.N"
        required: true
      reason:
        description: "why, said to everyone who runs it; empty takes the yank back"
        required: false
        default: ""

concurrency:
  group: release-metadata
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  yank:
    name: yank ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: yank
        env:
          TAG: ${{ inputs.tag }}
          REASON: ${{ inputs.reason }}
        run: |
          jq -n --arg tag "$TAG" --arg reason "$REASON" '{tag: $tag, reason: $reason}' > "$RUNNER_TEMP/yank.json"
          python3 -I .github/scripts/promote.py yank "$RUNNER_TEMP/yank.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: latest.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -I .github/scripts/promote.py latest '{"out": "latest.json"}'
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::latest.json is not published: the secret CLOUDFLARE_API_TOKEN is not set in $GITHUB_REPOSITORY's Actions secrets"
            exit 1
          fi
      - name: Publish latest.json
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put blaze-releases/latest.json --file=latest.json --content-type=application/json --cache-control=public,max-age=60 --remote
