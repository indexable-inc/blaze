name: yank

# Yanks a release of blaze (docs/release.md, "Yanking a release"): its notes' first line becomes `blaze-yanked: <reason>`,
# then (the job `metadata`, in the group release-metadata) each channel's pointer moved to the channel's newest release that is not yanked, and latest.json written
# again, so every blaze that runs it or pins it says so on every command, CI too, from the daemon's next check (at
# most five minutes). An empty reason takes the yank back. By hand: gh workflow run yank.yaml -f tag=v0.YYYYMMDD.N
# -f reason="miscompiles drops (#1234)".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the release, v0.YYYYMMDD.N"
        required: true
      reason:
        description: "why, said to everyone who runs it; empty takes the yank back"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  yank:
    name: yank ${{ inputs.tag }}
    runs-on: [ix, arm64]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: yank
        env:
          TAG: ${{ inputs.tag }}
          REASON: ${{ inputs.reason }}
        shell: bash # -eo pipefail: a failing promote.py fails the step through the tee
        run: |
          jq -n --arg tag "$TAG" --arg reason "$REASON" '{tag: $tag, reason: $reason}' > "$RUNNER_TEMP/yank.json"
          python3 -I .github/scripts/promote.py yank "$RUNNER_TEMP/yank.json" | tee -a "$GITHUB_STEP_SUMMARY"

  metadata:
    name: pointers and latest.json
    needs: yank
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One at a time across release.yaml, promote.yaml and yank.yaml: each writes the pointers and
    # latest.json from the releases as they are when it runs, so the last one to run is right. A
    # run the group cancels while it waits behind a newer one loses nothing.
    concurrency:
      group: release-metadata
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Only GH_TOKEN: the Cloudflare token reaches no script, only wrangler-action below.
      - name: pointers and latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash # -eo pipefail: a failing promote.py fails the step through the tee
        run: |
          python3 -I .github/scripts/promote.py metadata '{"out": "latest.json"}' | tee -a "$GITHUB_STEP_SUMMARY"
      # The token R2 takes latest.json with: Object Read & Write on the bucket blaze-releases
      # alone (docs/release.md, "latest.json"). Checked here, after the pointers moved, so a
      # missing secret fails the run without holding a release back.
      - name: the R2 token is set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::latest.json is not published: the secret CLOUDFLARE_R2_API_TOKEN is not set in $GITHUB_REPOSITORY's Actions secrets"
            exit 1
          fi
      - name: Publish latest.json
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put blaze-releases/latest.json --file=latest.json --content-type=application/json --cache-control=public,max-age=60 --remote
