# The benchmark tables of docs/benchmarks.md and the README's numbers, measured on real projects, as a matrix over
# the platforms of harness/benchplatforms.py: macOS arm64, Linux aarch64 and Linux x86-64. Each
# runs on its own dedicated benchmark machine (a self-hosted runner labelled bench-macos,
# bench-arm64 or bench-x86; docs/benchmarks.md "The machines"), never on a shared GitHub runner:
# their neighbours make the numbers noise. A platform runs only once its runner is registered (the
# repository variable BENCH_RUNNERS names it); the others are skipped and the README keeps their
# last numbers, with their date and commit.
# Every run of a platform adds a line to docs/benchmarks/history/<platform>.jsonl, which the
# site's /bench page charts, and checks it against the runs before it on the same machine
# (harness/benchhistory.py): a median beyond its noise band opens an issue labelled
# bench-regression (or comments on the open one) and fails the run. When a number moved beyond
# noise, or a stored run is a day old, the README sections and results are committed too, once
# for every platform, by the publish job. Commits to main are github-actions' with [skip ci].
name: bench-readme
on:
  push:
    branches: ["main"]
    paths-ignore: ["README.md", "CHANGELOG.md", "docs/**", "site/**"]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Write the README even when every number is within noise"
        type: boolean
        default: false
      full:
        description: "Also time the other setups (cg_clif, mold, wild, -Zthreads, cargo check) and run the test suites, as the nightly run does"
        type: boolean
        default: false

# One run at a time on the machines. A push that comes during a run waits, and a newer push
# replaces it while it waits, so the queue never grows past one.
concurrency:
  group: bench-readme
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  # To start the site's deploy after the history commit: a push by GITHUB_TOKEN starts no workflow.
  actions: write

defaults:
  run:
    shell: bash

jobs:
  platforms:
    name: platforms with a registered runner
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          BENCH_RUNNERS: ${{ vars.BENCH_RUNNERS }}
          BENCH_RUNNER: ${{ vars.BENCH_RUNNER }}
        run: python3 harness/benchplatforms.py matrix

  bench:
    name: bench (real projects, ${{ matrix.name }})
    needs: platforms
    # Until a machine is registered a run would wait for it for a day and then be cancelled: the
    # matrix has only the platforms BENCH_RUNNERS names.
    if: needs.platforms.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 420
    env:
      # Outside the checkout: the checkout is cleaned each run, these are kept between runs so
      # that blaze itself builds incrementally and the projects are cloned once.
      BENCH_HOME: ${{ github.workspace }}/../bench-state
      # macOS: the daemon's socket path has to fit in 104 bytes, so the work is under /tmp.
      BENCH_WORK: ${{ matrix.work }}
      CARGO_TERM_COLOR: never
      # The nightly run, and a run by hand that asks, compares with the other setups too.
      FULL: ${{ github.event_name == 'schedule' || inputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # bench.py runs the projects' tests with `blaze test`, which sandboxes them in
      # namespaces a user makes; Ubuntu's AppArmor keeps users from that unless told otherwise.
      - name: user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            sudo -n sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The Cranelift tier is measured with blaze as it is installed and released, without
      # the `llvm` feature: on Linux a binary that links libLLVM spends about 6 ms loading it
      # each time it starts, which every `blaze` does.
      - name: Build blaze (as released, and with the llvm feature)
        run: |
          mkdir -p "$BENCH_HOME"
          CARGO_TARGET_DIR="$BENCH_HOME/target" nix develop .#bench -c cargo build -p blaze-engine --release
          CARGO_TARGET_DIR="$BENCH_HOME/target-llvm" nix develop .#bench -c cargo build -p blaze-engine --release --features llvm
      - name: Bench
        id: bench
        run: |
          export BLAZE_BIN="$BENCH_HOME/target/release/blaze-engine" BLAZE_LLVM_BIN="$BENCH_HOME/target-llvm/release/blaze-engine"
          export BLAZE_PROJECTS="$BENCH_HOME/projects"
          work=${BENCH_WORK:-$BENCH_HOME/work}
          rm -rf "$work" "$BENCH_HOME/reference"
          mkdir -p "$RUNNER_TEMP/results"
          full=()
          [ "$FULL" = true ] && full=(--setups all --setups-on "ripgrep,nushell" --tests)
          nix develop .#bench -c env -u CARGO_INCREMENTAL -u RUSTC_WRAPPER python3 harness/bench.py \
            ripgrep fd bat hyperfine just axum nushell helix bevy biome --runs 5 --cold-runs 5 "${full[@]}" \
            --work "$work" --reference "$BENCH_HOME/reference" --out "$RUNNER_TEMP/results/bench.json" \
            || { status=$?; [ "$status" = 3 ] || exit "$status"; echo "wrong=true" >> "$GITHUB_OUTPUT"; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.slug }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
      - name: Fail on a wrong result
        if: steps.bench.outputs.wrong == 'true'
        run: |
          echo "::error::under blaze a program or a test suite ended otherwise than under cargo: see the Bench step and the tests table"
          exit 1

  # Every platform's results into the README, docs/benchmarks.md and the history, in one commit:
  # the platforms run at once, and one writer keeps their commits from racing.
  publish:
    name: README, history and regressions
    needs: [platforms, bench]
    if: always() && needs.platforms.outputs.any == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The ruleset on main refuses a push from the workflow's own token: this one is allowed
          # past it (docs/harness.md, "CI").
          token: ${{ secrets.BLAZE_BOT_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/results
      - name: README and docs/benchmarks.md
        run: |
          # A result refused (a program that said something else) leaves its platform's numbers as they were.
          for result in "$RUNNER_TEMP"/results/bench-*/bench.json; do
            [ -f "$result" ] || continue
            echo "::group::$result"
            python3 harness/benchreport.py "$result" ${{ inputs.force && '--force' || '' }} || echo "::warning::$result was not published"
            echo "::endgroup::"
          done
      - name: History and regressions
        id: history
        run: |
          regressed=false
          : > "$RUNNER_TEMP/regressions.md"
          for result in "$RUNNER_TEMP"/results/bench-*/bench.json; do
            [ -f "$result" ] || continue
            slug=$(basename "$(dirname "$result")"); slug=${slug#bench-}
            python3 harness/benchhistory.py build "$result" --history "docs/benchmarks/history/$slug.jsonl"
            python3 harness/benchhistory.py check "docs/benchmarks/history/$slug.jsonl" --report "$RUNNER_TEMP/regressions-$slug.md" || regressed=true
            cat "$RUNNER_TEMP/regressions-$slug.md" >> "$RUNNER_TEMP/regressions.md"
          done
          echo "regressed=$regressed" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/regressions.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to main
        run: |
          git add README.md docs/benchmarks.md docs/benchmarks/
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "bench: numbers for ${GITHUB_SHA::10} [skip ci]"
          # Main may have moved during the run: put the commit on top and try again.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::the bench commit does not apply to main"; exit 1; }
            if git push -q origin HEAD:main; then
              gh workflow run site.yaml --ref main
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Open or update the regression issue
        if: steps.history.outputs.regressed == 'true'
        run: |
          gh label create bench-regression --color B60205 --description "A benchmark median moved past its noise band" --force
          open=$(gh issue list --label bench-regression --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/regressions.md"
          else
            gh issue create --title "Benchmark regression at ${GITHUB_SHA::10}" --label bench-regression \
              --body-file "$RUNNER_TEMP/regressions.md"
          fi
          echo "::error::a benchmark regressed beyond its noise band: see the run summary"
          exit 1
