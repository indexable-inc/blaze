name: llvm

# Builds the LLVM every native blaze links (crates/hir-ty-codegen/llvm.json: our fork
# indexable-inc/llvm, ix/23.x, LLVM 23.1.4 with our fixes, the commit ix-aot pins) on each runner
# a release of blaze is built on, and Windows, with .github/scripts/llvm.py, and puts the
# archives on the release llvm.json names, each under a name that carries its sha256. The
# fork is public, so no token is needed. The run's summary has the `targets` to write into llvm.json
# (`llvm.py pin`), which the flake, CI and the release then fetch by that hash.
#
# It runs when the recipe changes, and by hand after moving the pinned commit.
on:
  workflow_dispatch:
  push:
    paths: [.github/scripts/llvm.py, .github/workflows/llvm.yaml]

concurrency:
  group: llvm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # blaze's whole machine: no one sits at a CI runner (docs/cargo.md, "Cores and priority").
  BLAZE_CORES: all

jobs:
  build:
    name: ${{ matrix.target }}
    # Hosted runners, Linux too, for the glibc a release asks for: the oldest hosted Ubuntu, not ix's
    # 24.04 (docs/harness.md "ix runners"). TODO(sysroot): ix once blaze links against an older
    # glibc sysroot (docs/v2/plan/toolchain-c.md); it has no --sysroot today.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          # The release's runners: the oldest hosted Ubuntu, so that what links LLVM asks for an old glibc.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ninja==1.13.0
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: python .github/scripts/llvm.py build --target ${{ matrix.target }} --work "${{ runner.temp }}/llvm" --out "${{ runner.temp }}/out"
      - uses: actions/upload-artifact@v7
        with:
          name: llvm-${{ matrix.target }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          compression-level: 0

  publish:
    name: publish
    needs: build
    runs-on: ["${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'ix-trusted' || 'ix' }}", arm64]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: llvm-*
          path: ${{ runner.temp }}/llvm
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("crates/hir-ty-codegen/llvm.json"))["release"].rsplit("/", 1)[1])')
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --title "LLVM for blaze ($tag)" \
              --notes "The LLVM blaze's \`llvm\` feature links, built by .github/scripts/llvm.py from indexable-inc/llvm at the commit crates/hir-ty-codegen/llvm.json pins. One archive per target, named by its sha256. Not a release of blaze."
          # Content-addressed names: an asset already there is this same file, and is left alone.
          # --clobber would delete it first, and every fetch of the pin (the flake, every CI
          # build) gets a 404 until the upload ends.
          have=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for archive in "$RUNNER_TEMP"/llvm/*/*.tar.xz; do
            if grep -qxF "$(basename "$archive")" <<< "$have"; then
              echo "already there: $(basename "$archive")"
            else
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "$archive"
            fi
          done
      - name: Pins
        run: |
          python3 .github/scripts/llvm.py pin "$RUNNER_TEMP"/llvm/*
          { echo '`crates/hir-ty-codegen/llvm.json` for these builds:'; echo '```json'; cat crates/hir-ty-codegen/llvm.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat crates/hir-ty-codegen/llvm.json
