# Named harnesses of harness/ci.py, alone, against one build of a ref: the regressions a change
# can affect, in minutes, in place of the train's every harness on every platform. By hand:
#
#   gh workflow run focused.yaml --ref <branch> -f harnesses='["anonstatics.py", "testselect.py"]'
#   gh workflow run focused.yaml --ref <branch> -f harnesses='["splices.py"]' -f macos=true
#
# A name is a label of `ci.py list '{}'`, or its start up to a space (harness/focused.py). Each
# supported platform builds blaze with the released blaze and runs the named harnesses that run there,
# under both backends; a name that runs on none of a platform's backends fails that platform.
# Its `blaze-<platform>` build is kept three days, for downstream.yaml's `build-run`.
#
# Astral's fork had a model pick these on every pull request (astral-experiments/blaze#7, #58);
# here whoever makes the change names them. The merge gate (blaze.yaml) and the train
# (train.yaml) are unchanged: this runs neither, and releases nothing.
name: focused
run-name: ${{ inputs.harnesses }}
on:
  workflow_dispatch:
    inputs:
      harnesses:
        description: a JSON list of ci.py's harnesses, as `ci.py list '{}'` names them
        required: true
      linux-x64:
        type: boolean
        default: true
      linux-arm64:
        type: boolean
        default: false
      macos:
        type: boolean
        default: false
      windows:
        description: requires a released Windows blaze for bootstrap (currently unavailable)
        type: boolean
        default: false

concurrency:
  group: focused-${{ github.ref }}-${{ inputs.harnesses }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x64:
    name: linux x64
    if: inputs.linux-x64
    uses: ./.github/workflows/blaze-platform.yaml
    with:
      platform: linux-x64
      os: ubuntu-24.04
      tier: full
      harnesses: ${{ inputs.harnesses }}

  linux-arm64:
    name: linux arm64
    if: inputs.linux-arm64
    uses: ./.github/workflows/blaze-platform.yaml
    with:
      platform: linux-arm64
      os: ubuntu-24.04-arm
      tier: full
      harnesses: ${{ inputs.harnesses }}

  macos:
    name: macos arm64
    if: inputs.macos
    uses: ./.github/workflows/blaze-platform.yaml
    with:
      platform: macos-arm64
      os: macos-15
      tier: full
      harnesses: ${{ inputs.harnesses }}

  windows:
    name: windows x64
    if: inputs.windows
    uses: ./.github/workflows/blaze-platform.yaml
    with:
      platform: windows-x64
      os: windows-2025
      tier: full
      harnesses: ${{ inputs.harnesses }}

  focused:
    name: focused
    needs: [linux-x64, linux-arm64, macos, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          # At least one platform ran, and none failed.
          echo "$NEEDS" | jq -e 'any(.[]; .result == "success")' > /dev/null
          ! echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null
