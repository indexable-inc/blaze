# What is new since the fork: the flake (per-unit nix builds of the daemon and the demo), the
# unit graphs behind them, the Game of Life demo, and live edits (blaze-live). A cold build of
# the flake takes up to two hours, so they run on every push to main in a workflow of their own,
# not in the release train: the train's run would stay open until they ended, and main's next
# train waits for it. A pull request that changes the flake, tools/nix/ or the dependencies (which the
# unit graphs are generated from) checks the unit graphs alone, in two minutes. The train's
# harnesses have live edits too (live_e2e.py, tiers.py). Nothing waits on this workflow; what it
# says is shown on main's commits. The unit graphs were stale for a week before 2026-10-26, and
# nothing said so but this workflow.
#
#   unit graphs   tools/nix/units/*.json are what `tools/nix/unit_graph.py` generates from Cargo.lock now
#   nix           `nix build` of the daemon, the demo and the per-unit builds, and the flake's apps
#   nix (darwin)  the flake evaluates and builds its cheapest outputs on aarch64-darwin
#   demo          demo/life builds and its window opens (xvfb) and stays up
#   live edits    macOS arm64: edit a running program's function, blaze-live applies the patch
#
# The nix store is cached in the GitHub Actions cache. FlakeHub Cache needs an organization
# `indexable-inc` on FlakeHub, which does not exist, and `id-token: write` on the jobs.
name: nix and live
on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "tools/nix/**"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/nix-live.yaml"
  workflow_dispatch:

# A newer push to main or to the pull request cancels the run before it, so what it says is of
# the newest commit; a run by hand is never cancelled.
concurrency:
  group: nix-live-${{ github.event_name }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  unit-graphs:
    name: nix unit graphs are current
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # unit_graph.py runs cargo from the flake's dev shell (the pinned toolchain).
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          use-gha-cache: true
      - run: python3 tools/nix/unit_graph.py
      - name: tools/nix/units is what unit_graph.py writes
        run: |
          git diff --stat -- tools/nix/units
          git diff --exit-code -- tools/nix/units || { echo "::error::tools/nix/units is stale: run tools/nix/unit_graph.py and commit the result"; exit 1; }

  nix:
    name: nix build (x86_64-linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          use-gha-cache: true
      - name: flake evaluates
        run: nix flake check --print-build-logs
      # The daemon as a package, the demo as a package, and the per-unit builds both are made of.
      - name: nix build
        run: nix build --print-build-logs --no-link .#daemon .#run .#life .#daemon-units .#life-bin
      - name: nix run .#blaze
        run: |
          nix run .#blaze -- --help
          nix run .#blaze -- --version || true
      - name: the binaries run each other from next to themselves
        run: |
          for attr in daemon daemon-units; do
            out=$(nix build --no-link --print-out-paths .#$attr)
            for bin in blaze blaze-engine blaze-rustc; do test -x "$out/bin/$bin"; done
          done

  nix-darwin:
    name: nix build (aarch64-darwin)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          use-gha-cache: true
      - name: outputs evaluate
        run: |
          for attr in daemon run life daemon-units life-bin; do
            nix eval --raw ".#packages.aarch64-darwin.$attr.drvPath"; echo
          done
      - name: nix build (the daemon, per cargo unit)
        run: nix build --print-build-logs --no-link .#daemon-units .#run

  demo:
    name: demo/life and blaze-live (linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      # blaze tests blaze (AGENTS.md rule blaze-builds-blaze) from the store main's tests job pushed.
      - uses: ./.github/actions/blaze
        with:
          job: tests
      # blaze-live is a stub where live edits are not supported, and says so.
      - run: nix develop --command blaze test --release -p blaze-live --locked
      # With cargo: what this checks is that the demo builds with rustc, as a user's would.
      - run: cargo build --locked
        working-directory: demo/life
      - name: window opens and stays up
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libwayland-client0
          export LIBGL_ALWAYS_SOFTWARE=1 RUST_BACKTRACE=1
          status=0
          timeout 15 xvfb-run -a --server-args="-screen 0 1280x800x24" demo/life/target/debug/life > life.log 2>&1 || status=$?
          cat life.log
          # timeout's own 124: the window was still up when it was stopped.
          test "$status" = 124 || { echo "::error::the window exited ($status) before it was stopped"; exit 1; }
          ! grep -E -i "panicked|Err\(" life.log

  live-edits:
    name: live edits (macOS arm64)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    # Not required: it runs a daemon, a program and a patch between them on a hosted macOS VM,
    # which has been the least steady thing in the repository. Whatever it says is still shown.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      # blaze tests blaze (AGENTS.md rule blaze-builds-blaze) from the store main's tests job pushed.
      - uses: ./.github/actions/blaze
        with:
          job: tests
      # Where it is real code: the whole of macos.rs and the patch format.
      - run: nix develop --command blaze test --release -p blaze-live --locked
      # The blaze that edits the program: cargo's, with no cache, since the blaze that blaze
      # builds runs about ten times slower until it inlines one function into another
      # (https://github.com/indexable-inc/blaze/issues/899).
      - run: cargo build --release -p blaze-engine
      - name: edit a running program
        run: BLAZE_BIN="$GITHUB_WORKSPACE/target/release/blaze-engine" python3 harness/live_e2e.py
      - name: crash reports
        if: failure()
        run: |
          for report in "$HOME"/Library/Logs/DiagnosticReports/*; do
            case "$report" in *blaze*|*liveprobe*) echo "::group::$report"; head -c 20000 "$report"; echo; echo "::endgroup::";; esac
          done
      # With cargo, as in the demo job.
      - name: the demo builds on macOS
        run: cargo build --locked
        working-directory: demo/life
