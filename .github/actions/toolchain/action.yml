# Rust (the nightly in pins/toolchain) via rustup. Kept for `.github/workflows/site.yaml`'s
# wasm32 renderer (`site/renderer/build.py`) and pre-migration `cargo` jobs.
name: toolchain
description: Rust (the nightly in pins/toolchain) via rustup
inputs:
  components:
    description: rustup components, space separated
    default: ""
  targets:
    description: rustup targets besides the host, space separated
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rustup
    - name: Rust (the nightly in pins/toolchain)
      shell: bash
      run: |
        tc=$(cat pins/toolchain)
        components=""
        for c in ${{ inputs.components }}; do components="$components -c $c"; done
        rustup toolchain install "$tc" --profile minimal $components
        rustup default "$tc"
        for t in ${{ inputs.targets }}; do rustup target add "$t"; done
    # Sandboxed tests use unprivileged user namespaces, which Ubuntu's AppArmor restricts unless cleared.
    - name: user namespaces
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
        fi
