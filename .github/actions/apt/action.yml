# Ubuntu packages for a job, with the .deb files kept in the Actions cache per runner image.
# The runners' Ubuntu mirror sometimes serves at a few tens of kB/s: valgrind and gdb (27 MB)
# once took 11 minutes, longer than the harness they are for. Only main writes the cache.
name: apt
description: apt-get install, with the downloaded packages cached per runner image
inputs:
  packages:
    description: the packages, space separated
    required: true
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: echo "key=apt-$RUNNER_ENVIRONMENT-$ImageOS-${ImageVersion:-}-$RUNNER_ARCH-$(echo '${{ inputs.packages }}' | tr ' ' '+')" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: ~/apt-archives
        key: ${{ steps.key.outputs.key }}
    - shell: bash
      run: |
        mkdir -p ~/apt-archives/partial
        # The ix runner image's sources are snapshot.ubuntu.com, which answers 500, 502 and 503
        # in bursts (the x86-64 cross job's packages, 2026-11-05): apt retries each fetch, with
        # its own backoff, rather than failing the job on the first.
        retries="-o Acquire::Retries=5"
        # The ix runner image ships no package lists, which a hosted image has.
        if [ -z "$(find /var/lib/apt/lists -maxdepth 1 -name '*_Packages' -print -quit)" ]; then sudo apt-get update -qq $retries; fi
        sudo apt-get install -y $retries -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true ${{ inputs.packages }}
        sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
    - if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: ~/apt-archives
        key: ${{ steps.key.outputs.key }}
