# blaze to build and test blaze with (AGENTS.md rule blaze-builds-blaze): the release
# .github/blaze-version names, installed by site/install.sh into ~/.cargo/bin with the Rust it builds
# with (its own toolchain, ~/.blaze/toolchains, docs/self-contained.md: no rustup), and an empty
# store at BLAZE_CACHE. With `llvm: true`, also the LLVM blaze pins
# (crates/hir-ty-codegen/llvm.json), fetched by its sha256 and named by LLVM_SYS_231_PREFIX, for
# a build of blaze, which links it (blaze-engine's default `native`). No Nix: the C compiler and linker are the runner's own (gcc and
# glibc on Ubuntu, Xcode's clang on macOS), so what the build links runs on the runner as it is.
# No shared remote: the v2 blaze pinned since 0.20261105.0 has no `blaze cache build|pull|push`
# (its `blaze cache` is `gc` alone), so every run starts from an empty store until v2 has a remote.
name: blaze
description: the release of blaze .github/blaze-version names, its toolchain, and an empty store
inputs:
  job:
    description: the job whose store this is (build, tests)
    required: true
  llvm:
    description: also the pinned LLVM, as LLVM_SYS_231_PREFIX (true or false)
    default: "false"
runs:
  using: composite
  steps:
    # `blaze test` runs every test in a sandbox made of namespaces a user makes, which
    # Ubuntu's AppArmor keeps users from making unless told otherwise.
    - name: user namespaces
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
        fi
    # The daemon pins its direct-IO buffers with io_uring (crates/blaze-core/src/uring.rs,
    # `Registered`), which needs more locked memory than Ubuntu's 8 MiB RLIMIT_MEMLOCK; without
    # it `blaze serve` exits at start ("io_uring registered buffers: Cannot allocate memory").
    # Each later step's shell is a child of Runner.Worker, so its limit is the one raised.
    - name: locked memory
      if: runner.os == 'Linux'
      shell: bash
      run: |
        worker=$(pgrep -o -f Runner.Worker) || { echo "::error::locked memory: no Runner.Worker process to raise RLIMIT_MEMLOCK of"; exit 1; }
        sudo prlimit --pid "$worker" --memlock=unlimited:unlimited
        prlimit --pid "$worker" --memlock
    - name: locked memory is raised
      if: runner.os == 'Linux'
      shell: bash
      run: |
        [ "$(ulimit -l)" = unlimited ] || { echo "::error::locked memory: RLIMIT_MEMLOCK is $(ulimit -l) KiB in a step after it was raised"; exit 1; }
    # The release .github/blaze-version names, not the newest canary: canaries come every 40
    # minutes, sooner than a cold run (about an hour) ends and pushes, so with the newest every
    # run whose canary changed blaze's sources would be cold. A pull request that moves the gate
    # to a release built from other sources, and main's next run, are cold once; one that moves
    # it to a release of the same sources keeps the store.
    - name: blaze (the release .github/blaze-version names)
      id: install
      shell: bash
      env:
        JOB: ${{ inputs.job }}
      run: |
        # Without --no-toolchain: install.sh has blaze fetch its toolchain now (`blaze toolchain`),
        # as a user's install does, rather than at the first build.
        # install.sh puts blaze in $CARGO_HOME/bin; GitHub's hosted images have that on PATH, ix's
        # image does not.
        bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        export PATH="$bin:$PATH"
        echo "$bin" >> "$GITHUB_PATH"
        sh site/install.sh --version "$(cat .github/blaze-version)" --verbose
        said=$(blaze-engine --version)
        version=$(echo "$said" | awk '$1 == "blaze" { print $2 }')
        [ -n "$version" ] || { echo "::error::blaze-engine --version said no version: $said"; exit 1; }
        if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
          # On an ix runner (the only self-hosted runners that run this action; docs/harness.md
          # "ix runners") the machine is a fork of the
          # snapshot of its label set's last green job on main, its disk included, so a store
          # under $HOME starts with what that job had and the pull below fetches only what is
          # newer. Not under $RUNNER_TEMP: ix's scrub deletes _work/_temp before the snapshot.
          # That disk lives on from job to job, so the store is collected (least recently used
          # packs first) above a bound with room for a few releases' projects.
          echo "BLAZE_CACHE=$HOME/.cache/blaze-ci/store" >> "$GITHUB_ENV"
          echo "BLAZE_CACHE_MAX=200G" >> "$GITHUB_ENV"
        else
          echo "BLAZE_CACHE=$RUNNER_TEMP/blaze-store" >> "$GITHUB_ENV"
          # No limit on the store: its default, a tenth of the free disk (about 3 GB on a hosted
          # runner), left a third of main's packs unpulled ("318 left that do not fit under
          # BLAZE_CACHE_MAX"), so a warm run still rebuilt what they held. A hosted runner's disk
          # lives for one job, so nothing needs collecting.
          echo "BLAZE_CACHE_MAX=off" >> "$GITHUB_ENV"
        fi
        mkdir -p "$(grep -m1 '^BLAZE_CACHE=' "$GITHUB_ENV" | cut -d= -f2-)"
    # The pinned LLVM, as a contributor outside Nix gets it (docs/contributing.md, "LLVM"): llvm.py fetches the archive llvm.json names for this host, checks its
    # sha256 and unpacks it; crates/hir-ty-codegen/build.rs refuses any other prefix. Below
    # /usr/local/lib because llvm-sys's build script names the prefix's `lib` to the linker, and a
    # build script in blaze's sandbox may name only system directories of libraries
    # (crates/blaze-cargo/src/cargo/directives.rs, SYSTEM). The same directory every run, so the
    # store's runs of the build scripts that read LLVM_SYS_231_PREFIX are found.
    # llvm.py takes JSON through typed_input, which needs Python 3.12; the oldest hosted Ubuntu has
    # 3.10. An ix runner's python3 is new enough (blaze.yaml's runs of typed_input scripts).
    - if: inputs.llvm == 'true' && runner.environment == 'github-hosted'
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: LLVM (the pin)
      if: inputs.llvm == 'true'
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) triple=x86_64-unknown-linux-gnu ;;
          Linux-ARM64) triple=aarch64-unknown-linux-gnu ;;
          macOS-ARM64) triple=aarch64-apple-darwin ;;
          *) echo "::error::crates/hir-ty-codegen/llvm.json has no LLVM for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        sudo mkdir -p /usr/local/lib/blaze-llvm
        sudo chown "$(id -u):$(id -g)" /usr/local/lib/blaze-llvm
        python3 .github/scripts/llvm.py "{\"command\": \"fetch\", \"target\": \"$triple\", \"dir\": \"/usr/local/lib/blaze-llvm/$triple\"}"
        echo "LLVM_SYS_231_PREFIX=/usr/local/lib/blaze-llvm/$triple" >> "$GITHUB_ENV"
    # A cold store (a release of other sources, or a project main has not pushed yet) builds blaze in more
    # than a hosted runner's 16 GB (rcache, #664): swap lets that run finish, slowly, where it
    # would be killed, and the warm runs after it never touch it. The pinned 0.20261030 release
    # builds each program whole in one worker that keeps every crate's memos until the build ends
    # (its salsa `lru` evicts only between builds): that worker's resident plus swapped memory
    # was 34.2 GB on 2026-10-30 (green) and passed 36.4 GB, still rising, on 2026-11-04 (run
    # 41755023516), when 20 GB of swap ran out and the runner was shut down. So 40 GB, as the disk
    # allows with 20 GB left for the store and target/, until the release the gate builds with
    # bounds its own memory (#1376; docs/memory-budget.md). Not on an ix runner:
    # its memory grows on demand up to 256 GiB, and ix's scrub refuses to snapshot a machine
    # with swap on, so a job that turned it on would never become its label set's seed.
    - name: swap
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        # On the disk with the most room: /mnt on x86-64, the root on AArch64, which has no /mnt.
        disk=$(df --output=avail,target / /mnt 2>/dev/null | tail -n +2 | sort -n | tail -n 1 | awk '{ print $2 }')
        swap="${disk%/}/blaze.swap"
        avail=$(df --output=avail -BG "$disk" | tail -n 1 | tr -dc 0-9)
        gb=$(( avail - 20 < 40 ? avail - 20 : 40 ))
        [ "$gb" -ge 20 ] || { echo "::error::swap: $disk has ${avail} GB free, too little for 20 GB of swap and 20 GB for the build"; exit 1; }
        sudo fallocate -l "${gb}G" "$swap"
        sudo chmod 600 "$swap"
        sudo mkswap "$swap" > /dev/null
        sudo swapon "$swap"
        free -g
