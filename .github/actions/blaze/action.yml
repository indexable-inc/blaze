# Installs the pinned v2 `blaze` and `blaze-launcher` release (.github/blaze-cli-version) via
# site/install.sh, configures Linux user namespaces and locked memory for sandboxing and io_uring,
# preserves the v2 home store ($HOME/.blaze/v2) across warm ix runner snapshots, and pre-warms the
# pinned toolchain records (`blaze warm-toolchain`). Zero cargo, zero rustc, zero rustup.
name: blaze
description: Install pinned v2 blaze + blaze-launcher (.github/blaze-cli-version), configure Linux sandbox/memlock, and warm toolchain records
inputs:
  warm-toolchain:
    description: run `blaze warm-toolchain` after install (true or false)
    default: "true"
  require-launcher:
    description: fail if `blaze-launcher` is absent beside `blaze` (true or false)
    default: "true"
runs:
  using: composite
  steps:
    # `blaze test` and sandboxed proc-macros/build scripts use unprivileged user namespaces, which
    # Ubuntu's AppArmor restricts unless cleared.
    - name: user namespaces
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
        fi

    # Raise RLIMIT_MEMLOCK on Runner.Worker so every later step inherits unlimited locked memory
    # for io_uring registered buffers and pinned memory regions.
    - name: locked memory
      if: runner.os == 'Linux'
      shell: bash
      run: |
        worker=$(pgrep -o -f Runner.Worker) || { echo "::error::locked memory: no Runner.Worker process to raise RLIMIT_MEMLOCK of"; exit 1; }
        sudo prlimit --pid "$worker" --memlock=unlimited:unlimited
        prlimit --pid "$worker" --memlock
    - name: locked memory is raised
      if: runner.os == 'Linux'
      shell: bash
      run: |
        [ "$(ulimit -l)" = unlimited ] || { echo "::error::locked memory: RLIMIT_MEMLOCK is $(ulimit -l) KiB in a step after it was raised"; exit 1; }

    - name: install pinned v2 blaze (.github/blaze-cli-version)
      id: install
      shell: bash
      env:
        REQUIRE_LAUNCHER: ${{ inputs.require-launcher }}
      run: |
        set -euo pipefail
        bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        export PATH="$bin:$PATH"
        echo "$bin" >> "$GITHUB_PATH"
        version="$(tr -d '[:space:]' < .github/blaze-cli-version)"

        have=""
        if [ -x "$bin/blaze" ]; then
          have=$("$bin/blaze" --version 2>/dev/null | awk '$1 == "blaze" { print $2 }' || true)
        fi
        need_install=false
        if [ "$have" != "$version" ]; then
          need_install=true
        elif [ "$REQUIRE_LAUNCHER" = "true" ] && [ ! -x "$bin/blaze-launcher" ]; then
          need_install=true
        fi
        if [ "$need_install" = "true" ]; then
          if command -v timeout >/dev/null 2>&1; then
            timeout -k 30 300 sh site/install.sh --version "$version" --no-toolchain --verbose
          elif command -v gtimeout >/dev/null 2>&1; then
            gtimeout -k 30 300 sh site/install.sh --version "$version" --no-toolchain --verbose
          else
            sh site/install.sh --version "$version" --no-toolchain --verbose
          fi
        fi

        [ -x "$bin/blaze" ] || { echo "::error::blaze binary missing at $bin/blaze after install"; exit 1; }
        if [ "$REQUIRE_LAUNCHER" = "true" ] && [ ! -x "$bin/blaze-launcher" ]; then
          echo "::error::blaze-launcher missing at $bin/blaze-launcher (v2 release $version must bundle blaze-launcher)"
          exit 1
        fi
        blaze --version

        # Persistent v2 home store on warm ix runners (snapshot preserves $HOME/.blaze/v2 across jobs).
        echo "BLAZE_HOME=$HOME/.blaze" >> "$GITHUB_ENV"
        if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
          echo "BLAZE_STORE_MAX_GB=200" >> "$GITHUB_ENV"
        else
          echo "BLAZE_STORE_MAX_GB=0" >> "$GITHUB_ENV"
        fi
        mkdir -p "$HOME/.blaze/v2"

    - name: warm toolchain records
      if: inputs.warm-toolchain == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v timeout >/dev/null 2>&1; then
          timeout -k 30 600 blaze warm-toolchain
        elif command -v gtimeout >/dev/null 2>&1; then
          gtimeout -k 30 600 blaze warm-toolchain
        else
          blaze warm-toolchain
        fi
