# The repository's scripts (scripts/src/bin/<name>.rs), job-scoped and built standalone with
# pinned v2 `blaze` (.github/blaze-cli-version) and cached as BLAZE_SCRIPTS: a step runs one as
# `"$BLAZE_SCRIPTS/<name>" '<json>'`. Cache hits cost only key hashing and restore; misses build
# only the binaries `bins.sh <job>` needs with `blaze build --standalone` (zero cargo, zero rustc,
# zero rustup) and cache the outputs.
name: script
description: the repository's job-scoped built scripts, from the Actions cache or built with pinned v2 blaze
inputs:
  job:
    description: caller job name (scripts, lean, or release)
    required: true
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        echo "key=$("$GITHUB_ACTION_PATH/key.sh" "${{ inputs.job }}")" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/blaze-scripts" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/check.sh" "${{ steps.key.outputs.dir }}" "${{ steps.key.outputs.key }}" "${{ inputs.job }}"'
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ "$(git config --bool core.sparseCheckout || echo false)" = true ]; then git sparse-checkout disable; fi
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: ./.github/actions/blaze
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/build.sh" "${{ steps.key.outputs.dir }}" "${{ steps.key.outputs.key }}" "${{ inputs.job }}"'
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - shell: bash
      run: echo "BLAZE_SCRIPTS=${{ steps.key.outputs.dir }}" >> "$GITHUB_ENV"
