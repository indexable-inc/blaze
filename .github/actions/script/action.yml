# The repository's scripts (scripts/src/bin/<name>.rs), built and cached as BLAZE_SCRIPTS:
# a step runs one as `"$BLAZE_SCRIPTS/<name>" '<json>'`. Cache hits cost only key hashing and
# restore; misses build with the pinned Rust toolchain (pins/toolchain) and cache the outputs.
name: script
description: the repository's built scripts, from the Actions cache or built with the pinned toolchain
inputs:
  job:
    description: caller job name
    required: true
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        echo "key=$("$GITHUB_ACTION_PATH/key.sh")" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/blaze-scripts" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/check.sh" "${{ steps.key.outputs.dir }}" "${{ steps.key.outputs.key }}"'
    - id: need
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ "$(git config --bool core.sparseCheckout || echo false)" = true ]; then git sparse-checkout disable; fi
        tc=$(cat pins/toolchain)
        echo "install=$(cargo +"$tc" --version >/dev/null 2>&1 && echo false || echo true)" >> "$GITHUB_OUTPUT"
    - if: steps.need.outputs.install == 'true'
      uses: ./.github/actions/toolchain
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/build.sh" "${{ steps.key.outputs.dir }}" "${{ steps.key.outputs.key }}"'
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - shell: bash
      run: echo "BLAZE_SCRIPTS=${{ steps.key.outputs.dir }}" >> "$GITHUB_ENV"
