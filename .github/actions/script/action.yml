# The repository's scripts (scripts/src/bin/<name>.rs, docs/v2/plan/design/scripts.md), built,
# as BLAZE_SCRIPTS: a step runs one as `"$BLAZE_SCRIPTS/<name>" '<json>'`. The binaries are kept
# in the Actions cache under key.sh's key, which covers every input of the build (the comment at
# its top says why), so a hit builds nothing and costs the key's hashing and the restore: seconds,
# needing only the files key.sh reads (a sparse checkout may have just those). A miss checks the
# whole tree out, builds them with cargo and the pinned nightly (build.sh; rustup from
# ./.github/actions/rustup) and saves them: no release builds today's tree, and the tree's own
# blaze is built by cargo too (docs/contributing.md, "CI"). A restored entry that is not what
# build.sh made is an error (check.sh), never rebuilt in place. `local.sh CACHE` runs these steps
# outside Actions.
name: script
description: the repository's built scripts, from the Actions cache or built by cargo with the pinned nightly
inputs:
  job:
    description: the job that asks (its callers name it; a miss builds with cargo, in no blaze store)
    required: true
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        echo "key=$("$GITHUB_ACTION_PATH/key.sh")" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/blaze-scripts" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/check.sh" "${{ steps.key.outputs.dir }}" "${{ steps.key.outputs.key }}"'
    # A miss: the whole tree (blaze loads the workspace), then the release unless a step before
    # installed it.
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ "$(git config --bool core.sparseCheckout || echo false)" = true ]; then git sparse-checkout disable; fi
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: ./.github/actions/rustup
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/build.sh" "${{ steps.key.outputs.dir }}" "${{ steps.key.outputs.key }}"'
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - shell: bash
      run: echo "BLAZE_SCRIPTS=${{ steps.key.outputs.dir }}" >> "$GITHUB_ENV"
