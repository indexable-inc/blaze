<text x="16" y="26" font-size="17" class="b">From saving an edit to the program running it, macOS arm64</text>
<text x="16" y="45" font-size="13" class="d">The median, per live program, over a night's edits in live_latency.py's socket mode, in live-latency.yaml's nightly</text>
<text x="16" y="64" font-size="13" class="d">runs. Down is faster; a gap is a night that program measured nothing.</text>
