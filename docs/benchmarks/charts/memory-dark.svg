<title>How much memory an edit's build takes, against cargo</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#f0f6fc}.d{fill:#9198a1}.b{font-weight:600}.v{font-variant-numeric:tabular-nums}.g{stroke:#262c36}.r{stroke:#9198a1;stroke-width:1.25}.z{fill:#151b23}.o{fill:none;stroke-width:1.25}.p0{fill:#5aa9f5}.w0{stroke:#5aa9f5}.p1{fill:#f0913a}.w1{stroke:#f0913a}.p2{fill:#34c69a}.w2{stroke:#34c69a}</style>
<text x="16" y="26" font-size="17" class="b">How much memory an edit's build takes, against cargo</text>
<text x="16" y="45" font-size="13" class="d">The most memory every process doing the work held at once, ra-jit's against cargo's. ra-jit's is its daemon, which</text>
<text x="16" y="64" font-size="13" class="d">keeps the project loaded between edits, its workers and the command; cargo's is cargo, rustc and the linker. Right</text>
<text x="16" y="83" font-size="13" class="d">of the 1× line ra-jit is better, left of it worse; the scale is logarithmic.</text>
