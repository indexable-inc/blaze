blaze-impls = { path = "crates/blaze-impls" } # The impl index, lang items and crate graph records (docs/v2/plan/design/bottom.md).
blaze-expand = { path = "crates/blaze-expand" }
blaze-scope = { path = "crates/blaze-scope" }
blaze-file-items = { path = "crates/blaze-file-items" } # A file's text to its outline of items, no tree kept (docs/v2/plan/design/bottom.md, `FileItems`).
blaze-surface = { path = "crates/blaze-surface" }
blaze-tokens = { path = "crates/blaze-tokens" } # An expansion's token record, read in place by every reader (docs/v2/plan/design/drive.md, D122).
# The fresh core's vocabulary: record kinds, keys, the store, memo, executor and driver interfaces.
blaze-keyed = { path = "crates/blaze-keyed" }
blaze-run = { path = "crates/blaze-run" } # `blaze run`/`blaze test` as sans-IO machines (docs/v2/plan/design/run.md).
blaze-drive = { path = "crates/blaze-drive" } # One command's request on the new item layer as a sans-IO machine (docs/v2/plan/design/drive.md).
blaze-cli = { path = "crates/blaze-cli" } # The `blaze` binary over blaze-drive, reaching the system through bstd (drive.md, "The system side").
blaze-watch = { path = "crates/blaze-watch" } # The monitor's rings, transport, viewer core and recorder (docs/v2/plan/design/watch.md).
blaze-lir = { path = "crates/blaze-lir" }
blaze-build = { path = "crates/blaze-build" } # A type-checked body to LIR (crates/blaze-cli/tests/ladder/README.md).
blaze-body-build = { path = "crates/blaze-body-build" }
blaze-consteval = { path = "crates/blaze-consteval" } # The constant evaluator (docs/v2/plan/design/consteval.md).
blaze-emit = { path = "crates/blaze-emit" } # The baseline tier: LIR to AArch64 machine code.
blaze-tier = { path = "crates/blaze-tier" } # Piece 0 of the tiers (backend-next.md D99): the seam, the record rows, the template table's form, register descriptions, samples, keys.
blaze-ladder = { path = "crates/blaze-ladder" } # The `blaze run` walking skeleton's straight line.
blaze-world = { path = "crates/blaze-world" } # One world for run and check: the unit graph made into the names library's inputs.
