[workspace]
members = [
    "crates/*",
    # The repository's scripts, built by the pinned released blaze (docs/v2/plan/design/scripts.md).
    "scripts",
    # ix's linter and rewriter (tools/astlog/UPSTREAM).
    "tools/astlog/cli",
    "tools/astlog/core",
    "tools/astlog/edit-applier",
    "tools/astlog/engine",
    "tools/astlog/error-chain",
    "tools/astlog/langs",
]
exclude = [
    # Parked (docs/v2/plan/parked.md): kept on disk, out of the build until the new item layer
    # (docs/v2/plan/design/bottom.md) gives what each waits on. The list there says why.
    # harness, its own workspace with its own lock: a macOS app and daemon blaze does not build
    # (crates/harness/README.md).
    "crates/harness",
    # Experimental (2026-11-16, docs/v2/plan/design/hvbox.md): a Hypervisor.framework sandbox for
    # build steps on macOS. Its own workspace with its own lock; nothing depends on it and
    # nothing selects it.
    "crates/blaze-hvbox",
    # Native macOS shell app (docs/v2/plan/design/sh.md): AppKit/Metal/CoreText through objc2;
    # its own workspace with its own lock while blaze-sh and blaze-vt stay workspace members.
    "crates/blaze-shell",
    "demo",
    "harness",
    # The standard library's own workspace (docs/toolchain.md).
    "library",
    # Patched below; its own tests need dev-dependencies blaze has no use for.
    "vendor/sonic-rs",
    # Patched below; its own tests and benches need dev-dependencies blaze has no use for.
    "vendor/arrow-buffer",
    # Its own tests need dev-dependencies blaze has no use for (vendor/blake3-servil/SOURCE.md).
    "vendor/blake3-servil",
    # Patched below; its own tests need dev-dependencies blaze has no use for (vendor/wasmtime/SOURCE.md).
    "vendor/wasmtime",
    # Charon's library (charon_lib), built only as a dependency of hir-ty-charon
    # (vendor/charon/SOURCE.md).
    "vendor/charon/charon",
    # blaze's zstd, picked per target: patched below (vendor/zstd-sys/SOURCE.md); libzstd-rs-sys
    # is its wasm implementation, built only there (vendor/libzstd-rs-sys/SOURCE.md).
    "vendor/zstd-sys",
    "vendor/libzstd-rs-sys",
    # Patched below; its own tests and benches need dev-dependencies blaze has no use for.
    "vendor/corosensei",
    # Patched below, without `tracing` (docs/v2/plan/design/no-tracing.md, 6.2); each is its own
    # workspace for its tests, whose dev-dependencies stay out of blaze's lock (vendor/*/PATCHES.md).
    "vendor/quinn-proto",
    "vendor/ra-ap-rustc_pattern_analysis",
    # Patched below with a ticket's bytes; its tests and benches need dev-dependencies blaze has
    # no use for (vendor/rustls/SOURCE.md).
    "vendor/rustls",
]
resolver = "2"

[workspace.metadata.blaze]
# `sandboxed-tests` sandboxes every member's tests on macOS, where tests are sandboxed only on
# an opt-in (docs/cargo.md, "Sandboxed tests"), and on the stage 0 at `version` below, which
# predates sandboxed tests by default. On Linux a blaze since notes that it does nothing there.
experimental = ["sandboxed-tests"]
version = "0.20261105.4"
# A build may not change Cargo.lock or blaze.lock, here as under CI: `blaze lock` changes them,
# saying what moved (docs/cargo.md, "Lock files").
lock = "required"
# Every internal workspace member must use `bstd` (`edition = "blaze-2026.11"`), never Rust's `std`.
std = "bstd"

# The pinned LLVM (docs/cargo.md, "Pinned native inputs"): blaze fetches the release
# pins/llvm.json names for the target, checks its sha256, unpacks it read-only
# under its home and sets LLVM_SYS_231_PREFIX to it for these build scripts, over any value the
# shell has. llvm-sys's (vendor/llvm-sys/pin.rs) links it; blaze-stencil's makes its stencils with
# it when `llvm-stencils` is on (the wasm seed builds it without, and asks for no LLVM).
[workspace.metadata.blaze.native.llvm]
pin = "pins/llvm.json"
env = "LLVM_SYS_231_PREFIX"
packages = ["llvm-sys", "blaze-stencil/llvm-stencils"]

[workspace.package]
version = "0.0.0"
rust-version = "1.101"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["blaze contributors"]
repository = "https://github.com/indexable-inc/blaze"
homepage = "https://ix.dev/blaze"
keywords = ["compiler", "jit", "hot-reload", "rust-analyzer", "cargo"]
[profile.dev]
debug = 1

[profile.dev.package]
# These speed up local tests.
syntax-tree.opt-level = 3
rustc-hash.opt-level = 3
foldhash.opt-level = 3
blaze-hash.opt-level = 3
blaze-text-size.opt-level = 3
serde.opt-level = 3
dissimilar.opt-level = 3
miniz_oxide.opt-level = 3
# fence::model's three_threads_two_slots explores ~2^24 states, too many for an unoptimized build
# (the model is blaze-inproc-rt's now; blaze-inproc's own tests run the same fences).
blaze-inproc.opt-level = 3
blaze-inproc-rt.opt-level = 3
# Every key's digest is hashed in tests and build dependencies: optimized, as a build dependency is not by default.
blake3.opt-level = 3
blaze-blake3.opt-level = 3 # every key's digest: its tests hash every length to 4 KiB at 16 alignments
# The tier 0 scripts (`blaze run -p scripts --bin <name>`) are run, not developed: `docs check`
# reads every tracked file, and unoptimized it took 26.5 s. The scripts and what they parse with
# are optimized in dev builds too.
scripts.opt-level = 3
blaze-script.opt-level = 3
regex.opt-level = 3
regex-automata.opt-level = 3
regex-syntax.opt-level = 3
aho-corasick.opt-level = 3
memchr.opt-level = 3
serde_json.opt-level = 3
indexmap.opt-level = 3
toml.opt-level = 3
toml_parser.opt-level = 3
toml_datetime.opt-level = 3
winnow.opt-level = 3
# The names pipeline (lex, outline, expand, resolve) runs inside every front-end test before its own work: a
# test of the new front end resolves core, alloc, std and bstd first. Unoptimized that was about two minutes a
# run, each run under the one build lock (2026-11-16); these crates are run by those tests, not developed by
# them. `cargo check` does no codegen, so only a test build of an edited one of these pays for it.
blaze-scope.opt-level = 3
blaze-expand.opt-level = 3
blaze-file-items.opt-level = 3
blaze-surface.opt-level = 3
blaze-toolchain.opt-level = 3
blaze-lex.opt-level = 3
parser.opt-level = 3
rustc_lexer.opt-level = 3
# Hot compiler pipeline and crypto crates run inside integration tests (variadic_call,
# native_so_descriptor, impls, sha512): opt-level = 2 cuts debug test runtime by ~10x while
# keeping dev rebuilds fast.
blaze-own.opt-level = 2
blaze-ids.opt-level = 2
blaze-lower.opt-level = 2
blaze-ty.opt-level = 2
blaze-solve.opt-level = 2
blaze-typeck.opt-level = 2
blaze-impls.opt-level = 2
blaze-body.opt-level = 2
blaze-body-lower.opt-level = 2
blaze-flow.opt-level = 2
blaze-flow-lower.opt-level = 2
blaze-borrow.opt-level = 2
blaze-consteval.opt-level = 2
blaze-build.opt-level = 2
blaze-lir.opt-level = 2
blaze-emit.opt-level = 2
blaze-ed25519.opt-level = 2
blaze-deflate.opt-level = 2
blaze-zstd.opt-level = 2
# Generic front-end and engine crates (`blaze-ladder` monomorphizes `blaze-typeck`/`blaze-solve`/
# `blaze-flow-lower`/`blaze-build`; `blaze-cli` monomorphizes `blaze-scope::resolve_crate_verified`
# over `JobTexts`/`FilePar`): without opt-level = 2 here, those generic instantiations compile at
# opt-level = 0, causing 40s+ `crate scope` tasks, 120s-600s front2 tests, and 20 KiB/frame stack
# overflows on Linux ARM64 debug runs.
blaze-ladder.opt-level = 2
blaze-cli.opt-level = 2
blaze-tokens.opt-level = 2
blaze-memchr.opt-level = 2
blaze-format.opt-level = 2
blaze-mem.opt-level = 2
blaze-std.opt-level = 2
blaze-world.opt-level = 2
blaze-fetch.opt-level = 2
blaze-cas.opt-level = 2
blaze-engine.opt-level = 2
blaze-drive.opt-level = 2
blaze-code.opt-level = 2
blaze-export.opt-level = 2
blaze-native.opt-level = 2
blaze-manifest.opt-level = 2
blaze-unit-graph.opt-level = 2
blaze-build-script.opt-level = 2
# Launcher runtime and wire (keeps `on_signal` stack frames small on Linux AArch64's 16 KiB
# SIGSTKSZ alternate stack), CAD mesh/field/math/sim (prevents `simplify_plants_are_caught`
# 600s timeouts in dev), and hot base crates underneath `blaze-scope`/`blaze-ladder`/`front2_*`
# (prevents 600s timeouts in `front2_*` integration tests on Linux ARM64 CI).
blaze-launch.opt-level = 2
blaze-launch-rt.opt-level = 2
blaze-launcher.opt-level = 2
blaze-cad-mesh.opt-level = 2
blaze-cad-field.opt-level = 2
blaze-math.opt-level = 2
blaze-sim.opt-level = 2
blaze-columns.opt-level = 2
blaze-swiss.opt-level = 2
blaze-kit.opt-level = 2
blaze-sort.opt-level = 2
blaze-cond.opt-level = 2
blaze-format-core.opt-level = 2
blaze-id.opt-level = 2
blaze-int.opt-level = 2
blaze-core.opt-level = 2
blaze-tier.opt-level = 2
blaze-run.opt-level = 2
blaze-ask.opt-level = 2
blaze-cbor.opt-level = 2
blaze-unicode.opt-level = 2
blaze-radix.opt-level = 2
blaze-hashcons.opt-level = 2
blaze-bitflags.opt-level = 2
blaze-sys.opt-level = 2

[profile.release]
# Emit line-table DWARF packed into a side `.dSYM`/`.dwp` bundle and strip the running binary's
# symbol table: shrinks macOS `__LINKEDIT` by ~13.6 MB and cuts `LC_CODE_SIGNATURE` hashing and
# page-ins at startup while preserving full symbols in `.dSYM` for `lldb`/`samply`/crash reports.
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
# Incremental: `release` is the bootstrap binary the harnesses, the runner and the self-build rebuild
# after every edit, so its rebuild time is the edit loop ("make release mode at least incremental",
# Andrew, 2026-11-03; a release rebuild took 5-12 min). The shipped binary is `dist`, built from
# scratch with incremental off.
incremental = true

# bootstrap: stage 0 refuses build-override and release twins of one crate (crossbeam-channel) as
# one key twice (fixed by crateclash); matching the profiles makes them one unit. Drop at the next stage.
[profile.release.build-override]
opt-level = 3
codegen-units = 16
debug = "line-tables-only"
incremental = true

# As in `profile.dev.package`: build dependencies are built at opt-level 0 otherwise.
[profile.release.package]
blake3.opt-level = 3

[profile.dev-rel]
inherits = "release"
debug = 2

# The binaries a release ships, built with PGO by .github/scripts/build_release.py
# (fed1eb428d:docs/reports/RELEASE-BUILD.md). Thin LTO takes 4-5% off an edit's work in the daemon but
# makes a rebuild of blaze after a one-line change 2.5 times longer, so `release`, which the
# harnesses and CI build after every change, goes without.
[profile.dist]
inherits = "release"
incremental = false
lto = "thin"
# One unit per crate, so LLVM inlines and lays out across all of it; only the release train
# builds `dist`, so its longer build delays no edit.
codegen-units = 1

[patch.'crates-io']
# Links the pinned LLVM statically, with a static libstdc++ on Linux (vendor/llvm-sys/SOURCE.md).
llvm-sys = { path = "vendor/llvm-sys" }
# Statics that name one section share it, as in LLVM's objects (vendor/cranelift-object/SOURCE.md).
cranelift-object = { path = "vendor/cranelift-object" }
# The unwind instructions hir-ty-codegen makes `.eh_frame` rows from (vendor/cranelift-codegen/SOURCE.md).
cranelift-codegen = { path = "vendor/cranelift-codegen" }
# A skipped string's `\u` takes four hex digits, as serde_json's (vendor/sonic-rs/SOURCE.md).
sonic-rs = { path = "vendor/sonic-rs" }
# The integer widths of `#![blaze::arbitrary_ints]` (vendor/rustc_ast_ir/SOURCE.md).
ra-ap-rustc_ast_ir = { path = "vendor/rustc_ast_ir" }
# The one zstd API: C zstd 1.5.7 on native targets; on wasm, where the seed has no C,
# libzstd-rs-sys, zstd's dev branch after 1.5.7 in Rust, whose bytes match C's as the fixtures
# pin (vendor/zstd-sys/SOURCE.md).
zstd-sys = { path = "vendor/zstd-sys" }
# `std` without virtual memory builds, for the wasm seed's Pulley; native code is upstream's
# (vendor/wasmtime/SOURCE.md).
wasmtime = { path = "vendor/wasmtime" }
# rsasm's master after 0.1.3, which has aarch64's exclusive and LSE atomics that compiler_builtins'
# outline atomics are written in (vendor/rsasm/SOURCE.md).
rsasm = { path = "vendor/rsasm" }
# For one release: its trampolines assembled from .S by cc, not `global_asm!`, which stage 0 drops
# (#1659); removed when stage 0 is a release built after 8498b0dfc1 (vendor/corosensei/SOURCE.md).
corosensei = { path = "vendor/corosensei" }
# Upstream with every `tracing` site deleted, as patch series tools/vendor/sync.py replays on each
# bump (docs/v2/plan/design/no-tracing.md, 6.2; vendor/<crate>/PATCHES.md). quinn, quinn-udp and
# wtransport are out of the graph: blaze-http's h3 core drives quinn-proto itself
# (docs/v2/plan/design/http3-sans-io.md).
quinn-proto = { path = "vendor/quinn-proto" }
ra-ap-rustc_pattern_analysis = { path = "vendor/ra-ap-rustc_pattern_analysis" }
# 0.23.46 plus a TLS 1.3 client ticket as bytes, so a process resumes (and sends 0-RTT) with a
# ticket an earlier one got: the remote cache's HTTP/3 reads (vendor/rustls/SOURCE.md).
rustls = { path = "vendor/rustls" }

