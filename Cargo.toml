[workspace]
members = [
    "crates/*",
    "fuzz",
    # ix's linter and rewriter (tools/astlog/UPSTREAM).
    "tools/astlog/cli",
    "tools/astlog/core",
    "tools/astlog/edit-applier",
    "tools/astlog/error-chain",
    "tools/astlog/langs",
]
# `blaze-wasm` turns on a feature of `hir-ty-codegen` that swaps the code generator's output, which
# must not be unified into a build of the native crates.
exclude = [
    "crates/blaze-wasm",
    "demo",
    "harness",
    # The standard library's own workspace (docs/toolchain.md).
    "library",
    # Hegel, built only as a dependency of blaze's tests (vendor/hegeltest/SOURCE.md).
    "vendor/hegeltest",
    "vendor/hegeltest-c",
    "vendor/hegeltest-macros",
    # Patched below; its own tests need dev-dependencies blaze has no use for.
    "vendor/sonic-rs",
    # Its own tests need dev-dependencies blaze has no use for (vendor/blake3-servil/SOURCE.md).
    "vendor/blake3-servil",
]
resolver = "2"

[workspace.metadata.blaze]
experimental = ["sandboxed-tests"]

# blaze-lints' own lints (AGENTS.md rules 3, 9, 11, 13-15, 20, 22). Each is `warn` until its
# count in crates/blaze-lints/baselines/ reaches zero, then `deny`. The other `hot_*` lints are
# set by the hot crates that opt in. Here, not in `[workspace.lints]`: cargo hands that to rustc, which
# refuses the tool `blaze` (E0602).
[workspace.metadata.blaze.lints]
hot_alloc = "warn"
fiber_boundary = "warn"
held_across_wait = "warn"
lock_across_query = "warn"
error_debug = "warn"
blocking_on_pool = "warn"
shared_collection_lock = "warn"
open_wait_loop = "warn"
unnamed_wait = "warn"
wall_clock = "warn"
std_hashmap = "warn"
dropped_error = "warn"
untyped_error = "warn"
hash_order_output = "warn"

# llvm-sys's build script (vendor/llvm-sys/pin.rs) checks the pinned LLVM `nix develop` names.
[workspace.metadata.blaze.sandbox]
build-script-env = ["LLVM_SYS_231_PREFIX"]

[workspace.package]
version = "0.0.0"
rust-version = "1.101"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["blaze contributors"]
repository = "https://github.com/indexable-inc/blaze"
homepage = "https://ix.dev/blaze"
keywords = ["compiler", "jit", "hot-reload", "rust-analyzer", "cargo"]
[profile.dev]
debug = 1

[profile.dev.package]
# These speed up local tests.
syntax-tree.opt-level = 3
rustc-hash.opt-level = 3
foldhash.opt-level = 3
blaze-hash.opt-level = 3
smol_str.opt-level = 3
text-size.opt-level = 3
serde.opt-level = 3
dissimilar.opt-level = 3
miniz_oxide.opt-level = 3
# fence::model's three_threads_two_slots explores ~2^24 states, too many for an unoptimized build.
blaze-inproc.opt-level = 3

[profile.release]
# Set this to 1 or 2 to get more useful backtraces in debugger.
debug = 0

[profile.dev-rel]
inherits = "release"
debug = 2

# The binaries a release ships, built with PGO by .github/scripts/build_release.py
# (docs/reports/RELEASE-BUILD.md). Thin LTO takes 4-5% off an edit's work in the daemon but
# makes a rebuild of blaze after a one-line change 2.5 times longer, so `release`, which the
# harnesses and CI build after every change, goes without.
[profile.dist]
inherits = "release"
lto = "thin"
# One unit per crate, so LLVM inlines and lays out across all of it; only the release train
# builds `dist`, so its longer build delays no edit.
codegen-units = 1

[patch.'crates-io']
# Links the pinned LLVM statically, with a static libstdc++ on Linux (vendor/llvm-sys/SOURCE.md).
llvm-sys = { path = "vendor/llvm-sys" }
# Statics that name one section share it, as in LLVM's objects (vendor/cranelift-object/SOURCE.md).
cranelift-object = { path = "vendor/cranelift-object" }
# The unwind instructions hir-ty-codegen makes `.eh_frame` rows from (vendor/cranelift-codegen/SOURCE.md).
cranelift-codegen = { path = "vendor/cranelift-codegen" }
# A skipped string's `\u` takes four hex digits, as serde_json's (vendor/sonic-rs/SOURCE.md).
sonic-rs = { path = "vendor/sonic-rs" }

