[workspace]
members = [
    "crates/*",
    "fuzz",
    # The repository's scripts, built by the pinned released blaze (docs/v2/plan/design/scripts.md).
    "scripts",
    # ix's linter and rewriter (tools/astlog/UPSTREAM).
    "tools/astlog/cli",
    "tools/astlog/core",
    "tools/astlog/edit-applier",
    "tools/astlog/error-chain",
    "tools/astlog/langs",
]
exclude = [
    # harness, its own workspace with its own lock: a macOS app and daemon blaze does not build
    # (crates/harness/README.md).
    "crates/harness",
    "demo",
    # Extensions (docs/v2/plan/design/extensions.md): crates outside the workspace, as a user's
    # are; blaze-ext-host's tests link the worked example by path.
    "extensions",
    "harness",
    # The standard library's own workspace (docs/toolchain.md).
    "library",
    # Patched below; its own tests need dev-dependencies blaze has no use for.
    "vendor/sonic-rs",
    # Patched below; its own tests and benches need dev-dependencies blaze has no use for.
    "vendor/arrow-buffer",
    # Its own tests need dev-dependencies blaze has no use for (vendor/blake3-servil/SOURCE.md).
    "vendor/blake3-servil",
    # Patched below; its own tests need dev-dependencies blaze has no use for (vendor/wasmtime/SOURCE.md).
    "vendor/wasmtime",
    # Charon's library (charon_lib), built only as a dependency of hir-ty-charon
    # (vendor/charon/SOURCE.md).
    "vendor/charon/charon",
    # blaze's zstd, picked per target: patched below (vendor/zstd-sys/SOURCE.md); libzstd-rs-sys
    # is its wasm implementation, built only there (vendor/libzstd-rs-sys/SOURCE.md).
    "vendor/zstd-sys",
    "vendor/libzstd-rs-sys",
    # Patched below; its own tests and benches need dev-dependencies blaze has no use for.
    "vendor/corosensei",
    # Patched below, without `tracing` (docs/v2/plan/design/no-tracing.md, 6.2); each is its own
    # workspace for its tests, whose dev-dependencies stay out of blaze's lock (vendor/*/PATCHES.md).
    "vendor/quinn-proto",
    "vendor/ra-ap-rustc_pattern_analysis",
]
resolver = "2"

[workspace.metadata.blaze]
experimental = ["sandboxed-tests"]
version = "0.20261105.4"
# A build may not change Cargo.lock or blaze.lock, here as under CI: `blaze lock` changes them,
# saying what moved (docs/cargo.md, "Lock files").
lock = "required"

# blaze-lints' own lints (AGENTS.md rules 3, 12, 14, 18-20, 25, 27) as a released blaze reads
# them: the stage 0 at `version` above, which builds this tree and runs the gate's `blaze check
# --workspace`. It does not know `lints-ratchet` below, nor half the names there, and holds no
# crate at `warn` the way the ratchet's baselines do, so this table stays at `warn` for it. This
# tree's blaze reads `lints-ratchet` in place of this table. Delete this one when `version` is a
# release that reads the ratchet. The other `hot_*` lints are set by the hot crates that opt in.
# Here, not in `[workspace.lints]`: cargo hands that to rustc, which refuses the tool `blaze`
# (E0602).
[workspace.metadata.blaze.lints]
# blaze's own lints come in two kinds (docs/lints.md): `blaze::general` warns in every workspace
# by default; `blaze::internal` needs blaze's types and conventions and waits until a workspace
# turns it on, as this one does. Groups apply before single lints, so each line below wins.
internal = "warn"
# `blaze::hot` stays with the crates that deny it (`#![deny(blaze::hot)]`); its members turned
# on everywhere are named below (`hot_alloc`, `default_hasher`, `cold_error`).
hot = "allow"
# The parallel lints are read in their own lane (docs/lints.md).
parallelizable = "allow"
serial_dependence = "allow"
hot_alloc = "warn"
fiber_boundary = "warn"
held_across_wait = "warn"
lock_across_query = "warn"
# A guard held across IO or a global-heap allocation (docs/v2/plan/design/named-locks.md).
error_debug = "warn"
blocking_on_pool = "warn"
shared_collection_lock = "warn"
open_wait_loop = "warn"
unnamed_wait = "warn"
wall_clock = "warn"
# Was `std_hashmap`; every hash collection whose hasher nobody chose (AGENTS.md rules 12, 25).
default_hasher = "warn"
dropped_error = "warn"
untyped_error = "warn"
hash_order_output = "warn"
# Keys known at compile time looked up by a map filled at run time or a run of compares
# (AGENTS.md rule 12); no baseline yet.
fixed_key_lookup = "warn"
# Code written by agents: a new field or a new answer forces a decision at every site. A struct
# literal of the workspace writes every field (no `..base`), and a parameter that chooses is an
# enum named for the choice, not a `bool` (docs/lints.md).
struct_update = "warn"
bool_param = "warn"
# A `#![blaze::sans_io]` core that reaches the wall clock or IO (AGENTS.md rule 14), and a
# hand-written key that leaves a field out unnamed (rule 21); no baseline yet.
sans_io_core = "warn"
key_ignores_field = "warn"
# A catch-all `match` arm over an enum of the workspace: a new variant is a compile error at
# every match (replaces clippy's wildcard_enum_match_arm and match_wildcard_for_single_variants,
# which blaze check doesn't implement); no baseline yet.
wildcard_arm = "warn"
# Performance: atomics or locks written apart in one 128-byte line of a shared struct, a
# `SeqCst` with no `// seqcst: <why>`, and a `collect` only iterated or asked its length;
# no baseline yet. `large_move` is in `blaze::hot`, set by the hot
# crates that deny it, not here.
false_sharing = "warn"
seqcst_unexplained = "warn"
collect_then_consume = "warn"
# Performance: a key hashed twice (lookup then write), a stat or open per element in hot and
# store crates, a query per element where a batch query exists, and a string key made from an
# interned identifier; no baseline yet.
hash_twice = "warn"
syscall_in_loop = "warn"
query_in_loop = "warn"
string_key = "warn"
# Code size and layout: a generic function whose body past an entry conversion is copied into
# every instantiation, a `Result` error over 128 bytes (and, where `blaze::hot` is on, an error
# built inline outside a `#[cold]` function), and a non-public `Vec`/`String` field nothing
# changes; no baseline yet.
outline_generic_body = "warn"
cold_error = "warn"
frozen_collection = "warn"
# Correctness: a blocking call in async code, a `Relaxed` flag that guards data, a panic in an
# `extern "C"` fn or in `Drop::drop`, and growth per round of a loop that reads input.
# `dos_hasher_on_input` is not named: it yields to `blaze::internal` (on above), since this
# workspace keys maps by fixed-seed hashers on purpose (AGENTS.md rule 25).
blocking_in_async = "warn"
relaxed_publish = "warn"
unwind_across_ffi = "warn"
unbounded_from_input = "warn"
panic_in_drop = "warn"
# Speed: a bounds check left in a range loop, unbuffered file and socket IO, a print locking
# stdout per loop round, a `Vec` used as a queue, an iterator with no `size_hint`, a `String`
# built inside `fmt`, a frozen `Vec<Vec<T>>` field, a needless stable sort, and a `dyn` field
# called in a loop.
bounds_check_in_loop = "warn"
unbuffered_io = "warn"
stdout_lock_in_loop = "warn"
front_vec_ops = "warn"
missing_size_hint = "warn"
fmt_allocates = "warn"
jagged_vec = "warn"
stable_sort_needless = "warn"
dyn_in_hot_field = "warn"
# Drawn from Goose (docs/lints.md): growth without a reserve, scratch made per round, a
# self-linked heap node, a `usize` index field, a small bounded heap field, a padded `Vec` of an
# enum, a `dyn Fn` parameter called in a loop and a large `Box::new`; `checkfree` is `deny` by
# default and fires only on `#[blaze::checkfree]` functions.
push_without_reserve = "warn"
scratch_in_loop = "warn"
boxed_recursive_node = "warn"
wide_index = "warn"
bounded_heap_field = "warn"
enum_vec_padded = "warn"
dyn_fn_param = "warn"
box_large_new = "warn"
# Zero findings since every span outside a `blaze*` crate named `target: "blaze"`.
unrecorded_span = "deny"
# `lenient_deserialize` (a serde `Deserialize` derive without `#[serde(deny_unknown_fields)]`,
# which drops an unknown field silently; AGENTS.md rule 3) is on through `internal` above, at
# `warn`; other workspaces opt in.

# Every lint of blaze's at `deny` in every crate, as this tree's blaze reads them (in place of
# `lints` above; docs/lints.md, "Workspace levels and the ratchet"). A crate that still trips a
# lint is held at `warn` on it by its line in the lint's baseline, `baselines/blaze.<lint>.txt`:
# `crate<TAB>count`, or `crate<TAB>unmeasured` until a counted run. The baselines only shrink
# (harness/v2/guards.py `ratchet`, in the gate's `lint-baselines` job), and `blaze check
# --workspace --target aarch64-unknown-linux-gnu --baselines crates/blaze-lints/baselines
# --bless-baselines` records each run's counts and drops each crate at zero, which turns the
# lint to `deny` for it. A new crate is held to every lint from its first line. A table of its
# own: a released blaze reads no table it does not know.
[workspace.metadata.blaze.lints-ratchet]
baselines = "crates/blaze-lints/baselines"
# The whole of each group, the today-`deny` lints among them (the effects lints, `checkfree`,
# `program_lifetime`, `unrecorded_span`), which no baseline loosens.
general = "deny"
internal = "deny"
edition = "deny"
pedantic_perf = "deny"
reach = "deny"
proc_macro = "deny"
# Every use of Rust's std that blaze's own standard library replaces (docs/lints.md#std_use,
# docs/v2/plan/design/std.md, step S3), in `edition` above and named here: on by Andrew's
# decision of 2026-11-11 ahead of the switch. `ready::BSTD_IN_TREE` is `false`: bstd builds and
# its tests run under a blaze built from this tree (`blaze build -p blaze-std`, `blaze test -p
# blaze-std`; arm64 Linux, 2026-11-12), but it is not yet an API these crates can port to, since
# cargo still builds them and rustc refuses bstd's blaze-only syntax (decision D25).
# harness/v2/std_uses.py is the worklist.
std_use = "deny"
# A package not on the latest blaze edition (docs/lints.md#not_latest_edition): allowed here while
# cargo builds blaze (decision D25, docs/v2/plan/decisions.json), since no crate cargo builds can
# say `edition = "blaze-2026.11"`. Removed when the tree moves onto the edition.
not_latest_edition = "allow"
# Arithmetic whose meaning is the profile's (docs/lints.md#implicit_overflow,
# docs/v2/plan/design/explicit-overflow.md), in `edition` above: crates opt in at their root
# (`#![deny(blaze::implicit_overflow)]`), `blaze-std` and `blaze-mem` first, once a stage-0
# release knows the lint; the rest of the tree has not said what its overflow means yet.
implicit_overflow = "allow"
# A `todo!()` outside test code is a typed hole (docs/v2/plan/design/proved-unreachable.md,
# "`blaze::todo`: typed holes"), in `general` above and named here: a warning in a local check,
# so code checks while a hole in it is still open. The merge gate denies it on its command
# line, `blaze check --deny blaze::todo` (.github/workflows/blaze.yaml, `lint-baselines`): a
# command line's level comes after this table's.
todo = "warn"
# A write through a `&mut` left half done by an early exit (docs/lints.md#half_done), in
# `internal` above and named here: many findings are deliberate (a counter bumped before a
# fallible call), so it warns, held at each crate's count by its baseline, until the real ones are
# fixed and the rest say why.
half_done = "warn"
# The rest of the suspicious-code lints (docs/lints.md#suspicious-code), in `internal` above: at
# `warn` until each has a baseline (`blaze check --new-baseline`, once the tree can check
# itself), since `deny` with none fails the first run; then each goes to `deny` but
# `option_question_mark_hides` and `shadow_changes_meaning`, which stay at `warn` (many findings
# are a judgement, not a bug).
skipped_pair = "warn"
hidden_exit = "warn"
question_mark_converts = "warn"
option_question_mark_hides = "warn"
unseen_target = "warn"
glob_import = "warn"
shadow_changes_meaning = "warn"
versioned_name = "warn"
unused_parameter = "warn"
fallback = "warn"
placeholder_body = "warn"
test_asserts_nothing = "warn"
assertion_cannot_fail = "warn"
test_misses_its_subject = "warn"
ignored_without_reason = "warn"
doc_names_nothing = "warn"
# The complexity lints (docs/lints.md#complexity), in `internal` above: at `warn` until
# `crates/blaze-lints/baselines/items.tsv` holds each existing item at its value (a bless, once
# the tree can check itself), since `deny` with no held values fails every item over a bound;
# then each goes to `deny`, and only new code is held to the bounds.
function_weight = "warn"
path_count = "warn"
live_state = "warn"
effect_breadth = "warn"
exits = "warn"
long_function = "warn"
long_file = "warn"
many_params = "warn"
wide_type = "warn"
deep_nesting = "warn"
fan_out = "warn"
module_cycle = "warn"
# The correct-by-construction lints (docs/lints.md#correct-by-construction), in `internal`
# above: at `warn` until a baseline holds what the tree has today. `unit_mismatch` is a bug
# wherever it fires and goes to `deny` then; the others stay findings to fix toward a type.
proof_forgotten = "warn"
unit_mismatch = "warn"
primitive_meaning = "warn"
sentinel_value = "warn"
state_in_flags = "warn"
bool_pair_state = "warn"
out_parameter = "warn"
parallel_collections = "warn"
untyped_index = "warn"
validated_but_raw = "warn"
# The claim lints (docs/lints.md#claims, docs/v2/plan/design/claims.md), in `internal` above.
# A doc the effect walk refutes is a bug wherever it is. A promise held by nothing, a stale
# pointer and a SAFETY comment naming no invariant are held at each crate's count by their
# baselines (`unmeasured` until the tree can check itself), so new ones fail. A provable claim
# warns (its fix writes the attribute); a body comment's claim is advice.
claim_contradicts_facts = "deny"
claim_without_evidence = "deny"
evidence_is_stale = "deny"
safety_without_invariant = "deny"
claim_is_derivable = "warn"
comment_claims = "allow"
# The duplicate-code lints (docs/lints.md#duplicates), in `internal` above. A function, a block,
# a type or a constant written twice and a pasted block left half renamed are denied, each held
# at its crate's count by its baseline (`unmeasured` until the tree can check itself), so only
# new copies fail. A near copy, a body written in several impls and the anti-unification
# findings (one function, one test table, one generic) are a judgement of where the shared code
# goes, so they warn. Across crates is the workspace pass's (blaze-findings), not wired yet.
near_duplicate = "warn"
same_impl_fn = "warn"
extractable_duplicate = "warn"
tests_differ_by_literal = "warn"
impls_differ_by_type = "warn"
duplicate_across_crates = "warn"
# The test-strength lints (docs/lints.md#test-strength), in `internal` above: at `warn` until
# each has a baseline (`blaze check --new-baseline`, once the tree can check itself), since
# `deny` with none fails the first run. Then `result_part_unobserved`, `weak_assertion` and
# `mirror_assertion` go to `deny` (a test that cannot catch the bug it is for); the other four
# stay at `warn`, held at each crate's count, since reaching or pinning everything is a goal,
# not a rule.
result_part_unobserved = "warn"
weak_assertion = "warn"
mirror_assertion = "warn"
pseudo_tested = "warn"
unreached_by_tests = "warn"
error_path_untested = "warn"
property_over_examples = "warn"
# The structural lints (docs/lints.md#structural), in `internal` above: code written by hand
# that the type's structure gives. The bug forms (a field-wise body or a key pair that leaves a
# field out, a variant list that drifted, a conversion that crosses or drops a field) are meant
# to be `deny`; they are held at `warn` until each has a baseline (`blaze check
# --new-baseline`, once the tree can check itself), since `deny` with none fails the first run.
# An impl exactly the derive warns (its fix is mechanical); the rest are advice.
impl_misses_field = "warn"
variant_list_drift = "warn"
conversion_misses_field = "warn"
hand_written_derivable = "warn"
hand_kept_variant_list = "allow"
hand_written_codec = "allow"
field_wise_conversion = "allow"
hand_written_visitor = "allow"
repeated_field_list = "allow"
registry_spread = "allow"
# `blaze::hot` is the lints of code where the time goes, each decided here. `allow` outside
# hot code, as docs/lints.md#profile_hot says, for the three that find what is right in cold
# code and `large_move` (moves of over 512 bytes, and lopsided enums, "in hot code" by its own
# rule): a clone, a call that allocates or a call through a vtable is not a fault where it
# runs once. Hot crates deny the group (`#![deny(blaze::hot)]`), and a profile raises them in
# the functions it shows hot (`profile_hot`, denied through `general`).
hot = "allow"
# The four members that hold everywhere: a global-heap allocation with no `// alloc: <why>`
# and a call to the global allocator where one was handed in (AGENTS.md rule bump-allocate), a
# hash collection whose hasher nobody chose (rules standard-structures, deterministic-output),
# and an error built inline where `#[cold]` belongs.
hot_alloc = "deny"
implicit_allocator = "deny"
default_hasher = "deny"
cold_error = "deny"
# The environment is read in the settings modules `.clippy.toml`'s `env-read-allowed` names
# (rule keys-cover-every-input; was `disallowed-methods` at warn).
env_read = "deny"
# The parallel lints find loops that could run in parallel, a suggestion, not a fault; read in
# their own lane (docs/lints.md).
parallelizable = "allow"
serial_dependence = "allow"
# Not run by `blaze check` (the release build reports it from LLVM's code), so no run of the
# ratchet counts it: at `deny` a crate whose baseline a check emptied would fail its release
# build. Turned on for one build by `RUSTFLAGS="-W blaze::vecreport"` (docs/lints.md#vecreport).
vecreport = "allow"

# The pinned LLVM (docs/cargo.md, "Pinned native inputs"): blaze fetches the release
# crates/hir-ty-codegen/llvm.json names for the target, checks its sha256, unpacks it read-only
# under its home and sets LLVM_SYS_231_PREFIX to it for these build scripts, over any value the
# shell has. llvm-sys's (vendor/llvm-sys/pin.rs) links it; blaze-stencil's makes its stencils with
# it when `llvm-stencils` is on (the wasm seed builds it without, and asks for no LLVM).
[workspace.metadata.blaze.native.llvm]
pin = "crates/hir-ty-codegen/llvm.json"
env = "LLVM_SYS_231_PREFIX"
packages = ["llvm-sys", "blaze-stencil/llvm-stencils"]

[workspace.package]
version = "0.0.0"
rust-version = "1.101"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["blaze contributors"]
repository = "https://github.com/indexable-inc/blaze"
homepage = "https://ix.dev/blaze"
keywords = ["compiler", "jit", "hot-reload", "rust-analyzer", "cargo"]
[profile.dev]
debug = 1

[profile.dev.package]
# These speed up local tests.
syntax-tree.opt-level = 3
rustc-hash.opt-level = 3
foldhash.opt-level = 3
blaze-hash.opt-level = 3
smol_str.opt-level = 3
text-size.opt-level = 3
serde.opt-level = 3
dissimilar.opt-level = 3
miniz_oxide.opt-level = 3
# fence::model's three_threads_two_slots explores ~2^24 states, too many for an unoptimized build
# (the model is blaze-inproc-rt's now; blaze-inproc's own tests run the same fences).
blaze-inproc.opt-level = 3
blaze-inproc-rt.opt-level = 3
# blaze-engine's build script hashes the code generator's sources (blaze-codegen-code), which
# reruns on every edit of them: optimized, as a build dependency is not by default.
blake3.opt-level = 3
blaze-codegen-code.opt-level = 3
# The tier 0 scripts (`blaze run -p scripts --bin <name>`) are run, not developed: `docs check`
# reads every tracked file, and unoptimized it took 26.5 s. The scripts and what they parse with
# are optimized in dev builds too.
scripts.opt-level = 3
blaze-script.opt-level = 3
regex.opt-level = 3
regex-automata.opt-level = 3
regex-syntax.opt-level = 3
aho-corasick.opt-level = 3
memchr.opt-level = 3
serde_json.opt-level = 3
indexmap.opt-level = 3
toml.opt-level = 3
toml_parser.opt-level = 3
toml_datetime.opt-level = 3
winnow.opt-level = 3

[profile.release]
# Set this to 1 or 2 to get more useful backtraces in debugger.
debug = 0
# Incremental: `release` is the bootstrap binary the harnesses, the runner and the self-build rebuild
# after every edit, so its rebuild time is the edit loop ("make release mode at least incremental",
# Andrew, 2026-11-03; a release rebuild took 5-12 min). The shipped binary is `dist`, built from
# scratch with incremental off.
incremental = true

# bootstrap: stage 0 refuses build-override and release twins of one crate (crossbeam-channel) as
# one key twice (fixed by crateclash); matching the profiles makes them one unit. Drop at the next stage.
[profile.release.build-override]
opt-level = 3
codegen-units = 16
debug = 0
incremental = true

# As in `profile.dev.package`: build dependencies are built at opt-level 0 otherwise.
[profile.release.package]
blake3.opt-level = 3
blaze-codegen-code.opt-level = 3

[profile.dev-rel]
inherits = "release"
debug = 2

# The binaries a release ships, built with PGO by .github/scripts/build_release.py
# (fed1eb428d:docs/reports/RELEASE-BUILD.md). Thin LTO takes 4-5% off an edit's work in the daemon but
# makes a rebuild of blaze after a one-line change 2.5 times longer, so `release`, which the
# harnesses and CI build after every change, goes without.
[profile.dist]
inherits = "release"
incremental = false
lto = "thin"
# One unit per crate, so LLVM inlines and lays out across all of it; only the release train
# builds `dist`, so its longer build delays no edit.
codegen-units = 1

[patch.'crates-io']
# Links the pinned LLVM statically, with a static libstdc++ on Linux (vendor/llvm-sys/SOURCE.md).
llvm-sys = { path = "vendor/llvm-sys" }
# Statics that name one section share it, as in LLVM's objects (vendor/cranelift-object/SOURCE.md).
cranelift-object = { path = "vendor/cranelift-object" }
# The unwind instructions hir-ty-codegen makes `.eh_frame` rows from (vendor/cranelift-codegen/SOURCE.md).
cranelift-codegen = { path = "vendor/cranelift-codegen" }
# A skipped string's `\u` takes four hex digits, as serde_json's (vendor/sonic-rs/SOURCE.md).
sonic-rs = { path = "vendor/sonic-rs" }
# `ALIGNMENT` on wasm64 too, for the wasm64 seed (vendor/arrow-buffer/SOURCE.md).
arrow-buffer = { path = "vendor/arrow-buffer" }
# The integer widths of `#![blaze::arbitrary_ints]` (vendor/rustc_ast_ir/SOURCE.md).
ra-ap-rustc_ast_ir = { path = "vendor/rustc_ast_ir" }
# The one zstd API: C zstd 1.5.7 on native targets; on wasm, where the seed has no C,
# libzstd-rs-sys, zstd's dev branch after 1.5.7 in Rust, whose bytes match C's as the fixtures
# pin (vendor/zstd-sys/SOURCE.md).
zstd-sys = { path = "vendor/zstd-sys" }
# `std` without virtual memory builds, for the wasm seed's Pulley; native code is upstream's
# (vendor/wasmtime/SOURCE.md).
wasmtime = { path = "vendor/wasmtime" }
# rsasm's master after 0.1.3, which has aarch64's exclusive and LSE atomics that compiler_builtins'
# outline atomics are written in (vendor/rsasm/SOURCE.md).
rsasm = { path = "vendor/rsasm" }
# For one release: its trampolines assembled from .S by cc, not `global_asm!`, which stage 0 drops
# (#1659); removed when stage 0 is a release built after 8498b0dfc1 (vendor/corosensei/SOURCE.md).
corosensei = { path = "vendor/corosensei" }
# Upstream with every `tracing` site deleted, as patch series tools/vendor/sync.py replays on each
# bump (docs/v2/plan/design/no-tracing.md, 6.2; vendor/<crate>/PATCHES.md). quinn, quinn-udp and
# wtransport are out of the graph: blaze-http's h3 core drives quinn-proto itself
# (docs/v2/plan/design/http3-sans-io.md).
quinn-proto = { path = "vendor/quinn-proto" }
ra-ap-rustc_pattern_analysis = { path = "vendor/ra-ap-rustc_pattern_analysis" }

[workspace.dependencies]
# local crates
macros = { path = "crates/macros", version = "0.0.0" }
base-db = { path = "crates/base-db", version = "0.0.0" }
