blaze-fetch = { path = "crates/blaze-fetch" }
blaze-toolchain = { path = "crates/blaze-toolchain" } # The toolchain as records: its manifest, the pinned id, the shelf reader (toolchain.md).
blaze-format = { path = "crates/blaze-format" }
# The record half of blaze-format on `core` alone, for the new item layer's `no_std` crates;
# blaze-format re-exports it whole, with its `alloc` feature on.
blaze-format-core = { path = "crates/blaze-format-core" }
# Compression by tier of blaze-format buffers (hot, warm, cold under zstd): the store's, split
# out so blaze-format brings no third-party package.
blaze-format-tiers = { path = "crates/blaze-format-tiers" }
# The bottom of the tree depends on no crate from outside the workspace
# (docs/v2/plan/design/bottom.md, "Also decided on 2026-11-15"): its adapters to such crates are
# features, on here for the crates above, and the bottom crates name each other by path without
# them. blaze's own BLAKE3, bit for bit official BLAKE3:
blaze-blake3 = { path = "crates/blaze-blake3" }
blaze-ed25519 = { path = "crates/blaze-ed25519" } # Ed25519 verification written here; the shared cache's head check
# The SwissTable group probe and `Index`, re-exported as `blaze_mem::swiss`.
