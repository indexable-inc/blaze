hir-ty-print = { path = "crates/hir-ty-print", version = "0.0.0" }
hir-ty-identity = { path = "crates/hir-ty-identity" }
hir-ty-charon = { path = "crates/hir-ty-charon", version = "0.0.0" }
hir-ty-lean = { path = "crates/hir-ty-lean", version = "0.0.0" }
hir-ty-pure = { path = "crates/hir-ty-pure", version = "0.0.0" }
hir-ty-suspend = { path = "crates/hir-ty-suspend", version = "0.0.0" }
hir-ty-share = { path = "crates/hir-ty-share", version = "0.0.0" }
hir-ty-coherence = { path = "crates/hir-ty-coherence", version = "0.0.0" }
hir-ty-specialization = { path = "crates/hir-ty-specialization", version = "0.0.0" }
hir-ty-ub = { path = "crates/hir-ty-ub", version = "0.0.0" }
hir-ty-wfcheck = { path = "crates/hir-ty-wfcheck", version = "0.0.0" }
hir-ty-codegen = { path = "crates/hir-ty-codegen", default-features = false }
blaze-macro-eval = { path = "crates/blaze-macro-eval" }
blaze-manifest = { path = "crates/blaze-manifest" }
blaze-metadata = { path = "crates/blaze-metadata" }
blaze-new = { path = "crates/blaze-new" }
blaze-tree = { path = "crates/blaze-tree" }
blaze-resolve = { path = "crates/blaze-resolve" }
blaze-source = { path = "crates/blaze-source" }
blaze-units = { path = "crates/blaze-units" }
blaze-lower = { path = "crates/blaze-lower" }
blaze-shader = { path = "crates/blaze-shader" }
blaze-doc = { path = "crates/blaze-doc" }
blaze-fmt = { path = "crates/blaze-fmt" }
blaze-fuzz = { path = "crates/blaze-fuzz" }
blaze-core = { path = "crates/blaze-core" }
blaze-graph = { path = "crates/blaze-graph" }
blaze-image = { path = "crates/blaze-image" }
blaze-profile = { path = "crates/blaze-profile" }
ix-prof = { path = "crates/ix-prof", default-features = false }
blaze-explore = { path = "crates/blaze-explore" }
blaze-explore-core = { path = "crates/blaze-explore-core" }
blaze-protocol = { path = "crates/blaze-protocol" }
blaze-report = { path = "crates/blaze-report" }
blaze-screen = { path = "crates/blaze-screen" }
blaze-script = { path = "crates/blaze-script" }
blaze-serde = { path = "crates/blaze-serde" }
blaze-serde-derive = { path = "crates/blaze-serde-derive" }
blaze-ui = { path = "crates/blaze-ui" }
# v2 (docs/v2/plan.md)
blaze-alloc-count = { path = "crates/blaze-alloc-count" }
blaze-bytes = { path = "crates/blaze-bytes" }
blaze-api = { path = "crates/blaze-api" }
# The daemon's clients with no process launch (docs/client.md): the library, its C ABI and its
# Node-API addon.
blaze-client = { path = "crates/blaze-client" }
blaze-thin = { path = "crates/blaze-thin" }
blaze-client-c = { path = "crates/blaze-client-c" }
blaze-napi = { path = "crates/blaze-napi" }
blaze-cas = { path = "crates/blaze-cas" }
blaze-kernel = { path = "crates/blaze-kernel" }
blaze-front-items = { path = "crates/blaze-front-items" }
blaze-gc = { path = "crates/blaze-gc" }
blaze-check = { path = "crates/blaze-check" }
blaze-spin = { path = "crates/blaze-spin" }
blaze-sys = { path = "crates/blaze-sys" }
blaze-codegen = { path = "crates/blaze-codegen" }
blaze-codegen-code = { path = "crates/blaze-codegen-code" }
blaze-dbsp = { path = "crates/blaze-dbsp" }
blaze-diff = { path = "crates/blaze-diff", version = "0.0.0" }
blaze-diff-mir = { path = "crates/blaze-diff-mir", version = "0.0.0" }
blaze-diagnostics = { path = "crates/blaze-diagnostics", version = "0.0.0" }
blaze-expansion = { path = "crates/blaze-expansion" }
blaze-ext = { path = "crates/blaze-ext" }
blaze-ext-host = { path = "crates/blaze-ext-host" }
# `blaze audit`: sources pinned by strong digests, advisories, yanked versions (sans-IO).
blaze-audit = { path = "crates/blaze-audit" }
blaze-fetch = { path = "crates/blaze-fetch" }
blaze-format = { path = "crates/blaze-format" }
blaze-hash = { path = "crates/blaze-hash" }
# blaze's sans-IO HTTP/1.1 client and its tokio driver (blaze-registry's `HyperHttp`).
blaze-http = { path = "crates/blaze-http", default-features = false }
blaze-ids = { path = "crates/blaze-ids" }
# The fresh core's vocabulary: record kinds, keys, the store, memo, executor and driver interfaces.
blaze-keyed = { path = "crates/blaze-keyed" }
# Lint findings as records, their three-class scheduler, wait modes and the adoption ladder.
blaze-findings = { path = "crates/blaze-findings" }
blaze-lir = { path = "crates/blaze-lir" }
blaze-lint-defs = { path = "crates/blaze-lint-defs", version = "0.0.0" }
blaze-radix = { path = "crates/blaze-radix" }
blaze-record = { path = "crates/blaze-record" }
blaze-remote = { path = "crates/blaze-remote" }
# The request certificate, its slot and the client's own check, with no compiler in it.
blaze-certify = { path = "crates/blaze-certify" }
blaze-rng = { path = "crates/blaze-rng" }
blaze-sha256 = { path = "crates/blaze-sha256" }
# blaze's own test engine and simulation kit (docs/v2/plan/design/sim.md).
blaze-sim = { path = "crates/blaze-sim" }
# Typed SQL (docs/v2/plan/design/sql.md): the checker, and its drivers for C SQLite and Postgres.
blaze-sql = { path = "crates/blaze-sql" }
blaze-sqlite = { path = "crates/blaze-sqlite" }
blaze-pg = { path = "crates/blaze-pg" }
# C SQLite itself, built from the amalgamation; blaze-sqlite is its only user and takes nothing of rusqlite.
libsqlite3-sys = { version = "0.39.1", features = ["bundled"] }
# bstd, blaze's own standard library (docs/v2/plan/design/std.md).
blaze-std = { path = "crates/blaze-std" }
blaze-items = { path = "crates/blaze-items" }
blaze-item-hash = { path = "crates/blaze-item-hash" }
blaze-link = { path = "crates/blaze-link", default-features = false }
blaze-store-check = { path = "crates/blaze-store-check" }
blaze-phf = { path = "crates/blaze-phf", version = "0.0.0" }
# fastcompile (docs/v2/plan/design/compile-time.md)
blaze-global = { path = "crates/blaze-global", default-features = false }
blaze-hashcons = { path = "crates/blaze-hashcons" }
blaze-history = { path = "crates/blaze-history" }
blaze-inproc = { path = "crates/blaze-inproc" }
blaze-launch = { path = "crates/blaze-launch" }
blaze-pack = { path = "crates/blaze-pack" }
blaze-launch-host = { path = "crates/blaze-launch-host" }
blaze-launch-rt = { path = "crates/blaze-launch-rt" }
blaze-program = { path = "crates/blaze-program" }
blaze-mutants = { path = "crates/blaze-mutants" }
blaze-inproc-rt = { path = "crates/blaze-inproc-rt" }
blaze-intent = { path = "crates/blaze-intent" }
blaze-lints = { path = "crates/blaze-lints" }
blaze-lazy = { path = "crates/blaze-lazy", default-features = false }
blaze-stencil = { path = "crates/blaze-stencil", default-features = false }
blaze-testsel = { path = "crates/blaze-testsel" }
blaze-query = { path = "crates/blaze-query" }
blaze-query-macros = { path = "crates/blaze-query-macros" }
# The session memo that replaces blaze-query under the front end, and its attributes.
blaze-memo = { path = "crates/blaze-memo" }
blaze-memo-macros = { path = "crates/blaze-memo-macros" }
blaze-reclaim = { path = "crates/blaze-reclaim" }
blaze-mem = { path = "crates/blaze-mem" }
blaze-usercode = { path = "crates/blaze-usercode" }
blaze-v2-proof = { path = "crates/blaze-v2-proof" }
blaze-vfs = { path = "crates/blaze-vfs" }
# WASI preview 1 for wasm guests at both pointer widths, and the bootstrap seed's runner
# (docs/future/bootstrap.md).
blaze-wasi = { path = "crates/blaze-wasi" }
blaze-seed-run = { path = "crates/blaze-seed-run" }
intern = { path = "crates/intern", version = "0.0.0" }
mbe = { path = "crates/mbe", version = "0.0.0" }
parser = { path = "crates/parser", version = "0.0.0" }
paths = { path = "crates/paths", version = "0.0.0" }
proc-macro-api = { path = "crates/proc-macro-api", version = "0.0.0" }
span = { path = "crates/span", version = "0.0.0" }
stdx = { path = "crates/stdx", version = "0.0.0" }
syntax = { path = "crates/syntax", version = "0.0.0" }
const-ast = { path = "crates/const-ast", version = "0.0.0" }
syntax-bridge = { path = "crates/syntax-bridge", version = "0.0.0" }
target-features = { path = "crates/target-features", version = "0.0.0" }
test-utils = { path = "crates/test-utils", version = "0.0.0" }
tt = { path = "crates/tt", version = "0.0.0" }
edition = { path = "crates/edition", version = "0.0.0" }

# The pinned nightly's lexer and format-string parser, re-vendored on every bump
# (harness/toolchain_bump.py).
rustc_lexer = { path = "crates/rustc_lexer" }
rustc_parse_format = { path = "vendor/rustc_parse_format", version = "0.0.0" }
ra-ap-rustc_index = { version = "0.179", default-features = false }
# rustc's layout code, from the tag of the stable in `harness/toolchain`.
rustc_abi = { path = "crates/rustc_abi", version = "0.0.0", default-features = false }
unicode-properties = { version = "0.1.4", default-features = false }
ra-ap-rustc_pattern_analysis = { version = "0.179", default-features = false }
ra-ap-rustc_ast_ir = { version = "0.179", default-features = false }
rustc_apfloat = "0.2.3"
# The trait solver, with fixes of rustc's backported.
rustc_type_ir = { path = "vendor/rustc_type_ir", version = "0.0.0", default-features = false }
rustc_next_trait_solver = { path = "vendor/rustc_next_trait_solver", version = "0.0.0", default-features = false }

# rust-analyzer's libraries, from crates.io
la-arena = { version = "0.3.1" }

# non-local crates
# `blaze_usercode::roots`' one-pass scan of a run's written files for every spelling of its roots.
aho-corasick = "1.1.5"
anyhow = "1.0.104"
arrayvec = "0.7.8"
bitflags = "2.13.2"
# Official BLAKE3: `blaze_ids::b3`'s backend where blake3-servil doesn't build (Windows, x86-64
# macOS), and the reference beside it. `neon`: aarch64 picks NEON at compile time; x86_64
# detects AVX-512 at run time without a feature. `wasm32_simd`: its SIMD128 code (Rust, no C) on
# wasm32, the seed's; it does nothing on any other target.
blake3 = { version = "1.8", default-features = false, features = ["std", "neon", "wasm32_simd"] }
# BLAKE3-Servil (johnservil/BLAKE3 `servil`, 0.8.0 on official 1.8.7): `blaze_ids::b3`'s
# backend on x86-64 Linux and AArch64 Linux and macOS (docs/v2/plan.md).
# Its kernels are chosen at run time; `std` alone, and its pool's threads start only in
# `initialize_multithreaded`, which blaze never calls.
blake3-servil = { path = "vendor/blake3-servil", default-features = false, features = ["std"] }
camino = "1.2.6"
# The Cranelift hir-ty-codegen compiles with.
# `=`: the version of vendor/cranelift-codegen, which every crate here that needs it must match.
cranelift-codegen = "=0.137.1"
cranelift-frontend = "=0.137.1"
# The reference interpreter and CLIF reader blaze-stencil's tests check each stencil with.
cranelift-interpreter = "=0.137.1"
cranelift-reader = "=0.137.1"
# The runtime a proc macro's wasm32-wasip1 module runs on, in process (rule `proc-macros-on-wasm`,
# crates/blaze-macro-eval/src/wasm.rs). `=`: the release whose Cranelift is 0.137.1, the one above,
# so the patched `vendor/cranelift-codegen` is the only Cranelift in the tree. No component
# model, async, GC, WASI crates or pooling allocator: blaze answers the module's imports itself.
# No `parallel-compilation`: it compiles on rayon's pool, and a second pool beside blaze's
# deadlocked the self-build (blaze_graph::par is the one pool). `vendor/wasmtime` by the patch above.
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }
# `vendor/llvm-sys` by the patch above.
llvm-sys = "231"
# The stackful fibers blaze-graph's scheduler parks a waiting job on (docs/v2/plan/design/fibers.md, Phase 2).
corosensei = "0.3.4"
crossbeam-channel = "0.5.17"
crossbeam-deque = "0.8.8"
crossbeam-queue = "0.3.14"
base64 = "0.23"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# QUIC under blaze-http's h3 core (the explorer's WebTransport on 127.0.0.1): quinn-proto's
# sans-IO endpoint, on rustls with ring, the crypto rustls already uses here; no `log`, no
# `bloom` (no 0-RTT or Retry tokens to remember).
quinn-proto = { version = "0.11.19", default-features = false, features = ["rustls-ring"] }
# quinn-proto's buffer types, as h3 hands it datagrams.
bytes = "1.11.1"
# The explorer's ECDSA P-256 certificate, made at start and rotated before it expires.
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
# blaze's own profiler (crates/blaze-profile): the schema's Arrow types, the live feed's IPC
# batches and the Parquet history. Pure Rust; DuckDB stays outside blaze (`blaze debug sql`).
arrow-array = { version = "60.1.0", default-features = false }
# The live feed's client feeds its long-lived IPC streams to `StreamDecoder` as `Buffer`s.
arrow-buffer = { version = "60.1.0", default-features = false }
arrow-ipc = { version = "60.1.0", default-features = false, features = ["zstd"] }
arrow-schema = { version = "60.1.0", default-features = false }
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd", "simdutf8"] }
# `zdict_builder` trains the store's dictionary per kind; `zstdmt` lets long cold values use workers.
zstd = { version = "0.14.3", default-features = false, features = ["zdict_builder", "zstdmt"] }
# `tt`'s proc-macro wire views its columns as bytes with no unsafe code of its own.
zerocopy = { version = "0.8.63", default-features = false, features = ["derive"] }
# `safe-decode`: a rotted pack decodes to an error, never to an out-of-bounds read.
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode"] }
# rustc renders its diagnostics with exactly this version; another lays some snippets out differently.
annotate-snippets = "=0.12.16"
# No `wasm`: it pulls a second wasmparser, and nothing here reads Wasm through `object`.
object = { version = "0.40", default-features = false, features = ["read_core", "std", "archive", "elf", "macho", "coff", "pe"] }
addr2line = { version = "0.26", default-features = false }
gimli = { version = "0.33", default-features = false, features = ["read", "write", "std"] }
either = "1.19.0"
expect-test = "1.5.1"
indexmap = { version = "2.14.2", features = ["serde"] }
# hir-ty's MIR provider table, which hir-ty-mir registers into.
inventory = "0.3.25"
itertools = "0.15.0"
libc = "0.2.191"
memchr = "2.8.3"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
syntax-tree = { path = "crates/syntax-tree", version = "0.0.0" }
semver = "1.0.28"
serde = { version = "1.0.229" }
serde_derive = { version = "1.0.229" }
serde_json = "1.0.154"
# blaze-ci's webhook payload decode, validating at SIMD speed (docs/v2/plan.md).
sonic-rs = { version = "0.5", default-features = false }
rustc-literal-escaper = "0.0.8"
smallvec = { version = "1.16.4", features = [
    "const_new",
    "union",
    "const_generics",
] }
smol_str = "0.3.7"
text-size = "1.1.1"
toml = "1.1.8"
# Debug and trace callsites compile out of release builds: blaze's one subscriber there, the trace
# recorder (crates/blaze-cargo/src/trace.rs), takes INFO and above.
tracing = { version = "0.1.44", default-features = false, features = ["std", "release_max_level_debug"] }
tracing-tree = "0.4.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "registry",
    "fmt",
    "local-time",
    "std",
    "time",
    "tracing-log",
] }
triomphe = { version = "0.1.17", default-features = false, features = ["std"] }
unicode-width = "0.2.3"
url = "2.5.8"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    # `CONTEXT` in `Win32_System_Diagnostics_Debug`.
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
thin-vec = "0.2.21"
hashbrown = { version = "0.17.1", features = [
    "inline-more",
    "nightly",
    "serde",
], default-features = false }
# We need to freeze this as `1.0.26` breaks the compilation of `rustc_lexer` during our in-tree
# libraries publish
unicode-ident = "=1.0.24"
# rustc's pins (`Cargo.lock` of the pinned nightly): the identifier lints' Unicode tables.
unicode-normalization = "=0.1.25"
unicode-security = "=0.1.2"

# Dependencies of one member, moved to the root (dedup, 2026-10-30).
blaze-cargo = { path = "crates/blaze-cargo", default-features = false }
blaze-registry = { path = "crates/blaze-registry", default-features = false }
cargo-platform = "0.3.3"
cargo-util-schemas = "=0.14.3"
cov-mark = "2.2.0"
cranelift-module = "=0.137.1"
cranelift-object = "=0.137.1"
diff = "=0.1.13"
dissimilar = "1.0.11"
drop_bomb = "0.1.5"
dunce = "1.0.5"
filetime = "0.2.29"
flate2 = { version = "1.1.10", default-features = false }
# bstd::image's inflate (crates/blaze-std): the no-alloc core only (`inflate::core` into a buffer
# the caller sized), the one flate2's rust backend already brings into the lock.
miniz_oxide = { version = "0.9.1", default-features = false }
# bstd::video's VideoToolbox provider (crates/blaze-std, macOS only): the hardware HEVC session,
# CoreVideo's pool buffers and CoreMedia's sample buffers. Default features off: their defaults
# pull in frameworks the encoder never uses (the harness's harness-video takes the same sets).
objc2-core-foundation = "0.3.2"
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CMBase", "CMTime", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "objc2-core-audio-types"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "objc2", "VTBase", "VTErrors", "VTSession", "VTCompressionSession", "VTCompressionProperties", "objc2-core-media", "objc2-core-video"] }
# blaze-hash's hasher (`crates/blaze-hash`), not a crate's own pick.
foldhash = "0.2.0"
fst = { version = "0.4.7", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
glob = "0.3.4"
# A request's method, status and header names (blaze-http, and blaze-registry with or without `net`).
http = "1.5.0"
# blaze-http's parsing of an answer's head.
httparse = "1.10.1"
# The persistent maps of blaze-resolve: im-rc's maintained fork (im-rc has had no release since 2021).
imbl = "7.0.2"
inkwell = { version = "0.11.0", default-features = false }
# The assembler of a blaze without LLVM (the seed): hir-ty-codegen's `asm/rsasm.rs`.
rsasm = { version = "=0.1.3", default-features = false, features = ["x86", "aarch64"] }
lzma-rust2 = { version = "0.24.0", default-features = false }
# blaze's map shared between threads (`blaze_hash::SharedMap`): lock-free reads, no guard held across calls.
papaya = "0.2.5"
# SHA-512 for blaze-fetch's pins; SHA-256 is blaze-sha256's.
sha2 = "0.11"
# blaze's locks and condition variables: `std::sync`'s are disallowed (`.clippy.toml`).
parking_lot = "0.12.5"
pathdiff = "0.2.3"
percent-encoding = "2.3.2"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rustc-demangle = "0.1.28"
rustc-stable-hash = "0.1.2"
rustc_hashes = { version = "0.179.0", package = "ra-ap-rustc_hashes" }
rustc_index = { version = "0.179.0", package = "ra-ap-rustc_index", default-features = false }
rustfmt-unicode-width = { version = "=0.1.14", package = "unicode-width" }
serde-untagged = "0.1.9"
shell-escape = "=0.1.5"
stacker = "0.1.25"
syn = "2.0.117"
synstructure = "0.13.2"
tar = { version = "0.4.46", default-features = false }
target-lexicon = "0.13.5"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.54.1"
toml_edit = { version = "=0.25.12", default-features = false }
uds_windows = "1.2.1"
unicode-segmentation = "=1.12.0"
wasm-encoder = { version = "0.263.0", default-features = false }
winnow = { version = "1.0.4", default-features = false }
zip = { version = "9.1.3", default-features = false }

# astlog, ix's Datalog over tree-sitter trees (tools/astlog/UPSTREAM), and what only it uses. The
# grammars are the languages blaze lints: Rust, TOML and Python.
astlog-core = { path = "tools/astlog/core" }
ast-merge-langs = { path = "tools/astlog/langs" }
edit-applier = { path = "tools/astlog/edit-applier" }
error-chain = { path = "tools/astlog/error-chain" }
clap = "4.6.7"
ignore = "0.4.33"
regex = { version = "1.13.1", default-features = false, features = ["perf", "std", "unicode-perl"] }
similar = "3.2.1"
snafu = "0.8.9"
tree-sitter = "0.26.13"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"

[workspace.lints.cargo]
unused_dependencies = "allow"

[workspace.lints.rust]
# remember to update RUSTFLAGS in ci.yml if you add something here, and crates/blaze-live/Cargo.toml's
# [lints], a written-out copy of these

elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(bootstrap)',
    "cfg(no_async_drops)",
    "cfg(blaze_check)",
] }
unused_extern_crates = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
## lint groups
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

## allow following lints
too_long_first_doc_paragraph = "allow"
# subjective
single_match = "allow"
# () makes a fine error in most cases
result_unit_err = "allow"
# We don't expose public APIs that matter like this
len_without_is_empty = "allow"
# We have macros that rely on this currently
enum_variant_names = "allow"
# Builder pattern disagrees
new_ret_no_self = "allow"
# Has a bunch of false positives
useless_asref = "allow"
# Has false positives
assigning_clones = "allow"
# Does not work with macros
vec_init_then_push = "allow"
# Our tests have a lot of these
literal_string_with_formatting_args = "allow"
# This lint has been empowered but now also triggers on cases where its invalid to do so
# due to it ignoring move analysis
unnecessary_map_or = "allow"

## Following lints should be tackled at some point
too_many_arguments = "allow"
type_complexity = "allow"
wrong_self_convention = "allow"

## deny: allocation, dyn and clones are controlled mechanically
## (docs/v2/plan.md). The lints marked `no baseline yet` were lowered from deny to be
## ratcheted by counts in crates/blaze-lints/baselines/, which holds no file yet: blaze cannot
## finish its own check of the workspace, so nothing holds their counts today
## (docs/cargo.md#lints; `blaze check --baselines DIR --new-baseline LINT` starts one).
redundant_clone = "warn" # no baseline yet; back to deny at zero findings
clone_on_ref_ptr = "warn" # no baseline yet; back to deny at zero findings
implicit_clone = "warn" # no baseline yet; back to deny at zero findings
unnecessary_to_owned = "warn" # no baseline yet; back to deny at zero findings
inefficient_to_string = "warn" # no baseline yet; back to deny at zero findings
format_collect = "warn" # no baseline yet; back to deny at zero findings
needless_pass_by_value = "deny"
large_types_passed_by_value = "warn" # no baseline yet; back to deny at zero findings
box_collection = "warn" # no baseline yet; back to deny at zero findings
vec_box = "warn" # no baseline yet; back to deny at zero findings
rc_buffer = "warn" # no baseline yet; back to deny at zero findings
large_enum_variant = "warn" # no baseline yet; back to deny at zero findings
# in `perf` (deny above): warn until they have no findings
useless_vec = "warn" # no baseline yet; back to deny at zero findings
useless_borrows_in_formatting = "warn" # no baseline yet; back to deny at zero findings

## deny: every unsafe block says why it is sound, one operation each
## (docs/v2/plan/design/unsafe.md)
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn" # no baseline yet; back to deny at zero findings

## warn at following lints
# CI raises these to deny
# deny (int-1112): a `dbg!` left in prints to stderr on every run and is never what a change
# means; the tree has none outside lint fixtures' strings.
dbg_macro = "deny"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

## restriction lints for code written by agents: more typing, and each choice made where it
## is written (`blaze check` implements each of these; crates/blaze-lints/src/lints/mod.rs)
# an `#[allow]` that no longer suppresses anything is never noticed; `#[expect]` is. These two are
# the "unexplained allow" check (any `#[allow]`, an `#[expect]` with no reason), so blaze has no
# lint of its own for it (docs/lints.md#suspicious-code); `--fix` turns an outer `allow` into
# `expect`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# `let _ = f()` of a `#[must_use]` value throws away what it says
let_underscore_must_use = "warn"
# Copy-paste mistakes in one expression (docs/lints.md#duplicates): `eq_op`, `ifs_same_cond` and
# `self_assignment` are in `correctness`, denied above. Two branches written alike is the same
# mistake, so `if_same_then_else` (in `style`) is denied too; `match_same_arms` (pedantic) warns,
# since arms kept apart for their patterns' sake are common. Like the list below, `blaze check`
# does not implement these yet.
if_same_then_else = "deny"
match_same_arms = "warn"
# Listed in clippy's table but not implemented by `blaze check`, so turning them on does nothing
# until they are: string_slice, missing_assert_message, let_underscore_lock, unused_async,
# unused_self. wildcard_imports and shadow_unrelated are `blaze::glob_import` and
# `blaze::shadow_changes_meaning` instead (in `internal`; their levels are in `lints-ratchet`). wildcard_enum_match_arm and
# match_wildcard_for_single_variants are `blaze::wildcard_arm` instead, which checks the
# workspace's enums only (clippy's also fires on other crates' enums such as
# `std::io::ErrorKind`).

str_to_string = "warn"
