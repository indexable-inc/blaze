[package]
name = "blaze-manifest"
description = "Cargo.toml and .cargo/config.toml read as the pinned nightly's cargo reads them"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
# The version cargo 1.99 renders its manifest diagnostics with, so that they read the same.
annotate-snippets = "=0.12.17"
cargo-platform = "0.3.3"
# cargo 1.99's own schema of Cargo.toml, so that what deserializes and the messages of what does
# not are cargo's: docs/resolve.md, "Decisions".
cargo-util-schemas = "=0.14.3"
glob = "0.3.3"
pathdiff = "0.2.3"
rustc-hash.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde-untagged = "0.1.9"
# The versions cargo 1.99 prints `cargo config get` with.
shell-escape = "=0.1.5"
toml_edit = { version = "=0.25.12", default-features = false, features = ["display"] }
# `preserve_order`: `package.metadata` and `workspace.metadata` keep the manifest's order, as
# cargo's do.
toml = { workspace = true, features = ["preserve_order"] }
url.workspace = true

[dev-dependencies]
dunce = "1"

[lints]
workspace = true
