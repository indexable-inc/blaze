[package]
name = "blaze-manifest"
description = "Cargo.toml and .cargo/config.toml read as the pinned nightly's cargo reads them"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-own.workspace = true
# `package.metadata` and `workspace.metadata`, kept in the manifest's order as cargo's are.
blaze-data.workspace = true
# Cargo.toml and .cargo/config.toml, read with every key's byte range (`schema`), and the
# `cargo config get` output written in cargo's spelling.
blaze-toml.workspace = true
# Package versions and requirements, with cargo's matching.
blaze-semver.workspace = true
# The version cargo 1.99 renders its manifest diagnostics with, so that they read the same.
annotate-snippets.workspace = true
# The user's home directory (`blaze_core::home`), the one answer to it.
blaze-core.workspace = true
blaze-hash.workspace = true
blaze-ids.workspace = true
blaze-resolve.workspace = true
blaze-serde.workspace = true
blaze-source.workspace = true
# The blaze editions and their spellings, shared with the front end (`edition = "blaze-2026.11"`).
edition.workspace = true
blaze-glob.workspace = true
pathdiff.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The versions cargo 1.99 prints `cargo config get` with.
shell-escape.workspace = true
stdx.workspace = true
url.workspace = true

[dev-dependencies]
blaze-sim.workspace = true
dunce.workspace = true

[lints]
workspace = true
