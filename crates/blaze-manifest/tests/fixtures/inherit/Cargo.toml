resolver = "2"

[workspace.package]
version = "1.2.3"
edition = "2021"
license = "MIT"
authors = ["Ada <ada@example.com>"]
description = "shared"
homepage = "https://example.com"
repository = "https://example.com/repo"
documentation = "https://docs.example.com"
keywords = ["one", "two"]
