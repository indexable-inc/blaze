[package]
name = "blaze-toolchain"
description = "The toolchain as records (docs/v2/plan/design/toolchain.md): the manifest record that lists each standard-library crate's source pack by digest and, per target, the sysroot's units; the pinned id the binary opens; the shelf reader that verifies it; and the tool that cuts it from the tree"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[[bin]]
name = "blaze-toolchain"
path = "src/bin/blaze-toolchain.rs"
required-features = ["tool"]

[features]
# The tool that cuts the toolchain from the tree: the binary blaze links only the library.
tool = ["dep:blaze-manifest", "dep:edition", "dep:blaze-toml", "dep:blaze-script", "dep:serde_json"]

[dependencies]
# The allocator as a value and the owning types the record is made in.
blaze-own.workspace = true
# The pack form each crate's files are in, read in place; BLAKE3; a `.crate`'s record.
blaze-fetch.workspace = true
# A pack's refusal in words (`Show`).
blaze-text.workspace = true
# The sysroot's units as the edition rule takes them (`Sysroot`); the tool's resolution.
blaze-unit-graph.workspace = true
blaze-manifest = { workspace = true, default-features = false, optional = true }
edition = { workspace = true, optional = true }
# The tool reads a root's `[patch]` tables: where a patched path package's folder is.
blaze-toml = { workspace = true, optional = true }
# The tool's one typed JSON input (scripts.md, tier 0).
blaze-script = { workspace = true, optional = true }
# The tool reads the recorded rustc answers (crates/blaze-units/src/stdlib/rustc.json).
serde_json = { workspace = true, optional = true }

[dev-dependencies]
blaze-own = { workspace = true, features = ["std"] }

[lints]
workspace = true
