[package]
name = "blaze-llvm"
description = "The optimizing tier's LLVM (docs/v2/plan/design/backend-next.md, D100 points 7, 8, 9 and 14): LIR to LLVM IR with blaze's facts supplied as attributes and callees offered as bodies (lower.rs, D2), and one compile of a module through the named custom pipeline with the inliner's remarks read back and the optimized bitcode kept (compile.rs, D1). One fresh LLVM context per call: alone and batched give equal bytes."
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# Linked only (`use llvm_sys as _;`): vendor/llvm-sys's build script links the pinned LLVM 23.1.4
# (crates/hir-ty-codegen/llvm.json, `LLVM_SYS_231_PREFIX`) and blaze's wrappers
# (wrappers/passes.cpp, which holds the remark stream's three functions: see
# wiring/llvm-sys/blaze-llvm-remarks-1.md). Every function this crate calls it declares itself
# (src/ffi.rs).
llvm-sys.workspace = true
# `View`, `Op` and the tables: what is lowered.
blaze-lir.workspace = true
# `Names`, `Outside`, `Named`, `Machine`: how outside references are named and what is compiled for.
blaze-tier.workspace = true
# `Symbol`: the name of every function in a module and in a remark.
blaze-code = { path = "../blaze-code" }
# `AVec`, `AString`, `Alloc`: every list in the caller's allocator.
blaze-own.workspace = true
# `lock::Lock`: `init`'s one-time registration, waited on with a deadline.
blaze-core.workspace = true

[dev-dependencies]
blaze-own = { workspace = true, features = ["std"] }

[lints]
workspace = true
