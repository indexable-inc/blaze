[workspace]

[package]
name = "blaze-shell"
description = "Native macOS GUI shell rendered by blaze's Metal + blaze-ui SDF/glyph shaders + CoreText, powered by blaze-sh structured values, O(1) CoW session forks, blaze-vt PTY blocks, and live Rust cells via blaze run"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
authors = ["blaze contributors"]

[lib]
name = "blaze_shell"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "blaze-shell"
path = "src/main.rs"

[dependencies]
blaze-own = { path = "../blaze-own", features = ["std"] }
bgit = { path = "../bgit" }
blaze-base64 = { path = "../blaze-base64" }
blaze-git = { path = "../blaze-git" }
blaze-html = { path = "../blaze-html" }
blaze-preview = { path = "../blaze-preview" }
blaze-sniff = { path = "../blaze-sniff" }
blaze-ssh = { path = "../blaze-ssh" }
blaze-vim = { path = "../blaze-vim" }
blaze-vt = { path = "../blaze-vt" }
blaze-sh = { path = "../blaze-sh" }
blaze-ui = { path = "../blaze-ui" }
blaze-json = { path = "../blaze-json" }
blaze-shell-config = { path = "../blaze-shell-config" }
blaze-cli-spec = { path = "../blaze-cli-spec" }
blaze-diag-parse = { path = "../blaze-diag-parse" }
blaze-dust = { path = "../blaze-dust" }
blaze-git-meta = { path = "../blaze-git-meta" }
blaze-sys = { path = "../blaze-sys" }
blaze-sysmon = { path = "../blaze-sysmon" }
blaze-term-api = { path = "../blaze-term-api" }
blaze-tiling = { path = "../blaze-tiling" }
blaze-data = { path = "../blaze-data" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
