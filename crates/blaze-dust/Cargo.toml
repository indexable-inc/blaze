[package]
name = "blaze-dust"
description = "Pure no_std, zero-unsafe, sans-IO progressive directory-size (dust/du) state machine with hardlink deduplication and bounded traversal on blaze-own explicit allocators"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
authors = ["blaze contributors"]

[lib]
name = "blaze_dust"
path = "src/lib.rs"
doctest = false

[dependencies]
blaze-own = { path = "../blaze-own" }
