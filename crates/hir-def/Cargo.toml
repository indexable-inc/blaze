[package]
name = "hir-def"
version = "0.0.0"
repository.workspace = true
description = "Early name and import resolution for rust-analyzer."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
blaze-core.workspace = true
blaze-id.workspace = true
blaze-surface.workspace = true
blaze-own.workspace = true
blaze-bitflags.workspace = true
blaze-hash.workspace = true
cov-mark.workspace = true
drop_bomb.workspace = true
hashbrown.workspace = true
la-arena.workspace = true
blaze-trace.workspace = true
rustc_apfloat.workspace = true

rustc_parse_format.workspace = true
rustc_abi.workspace = true
# The integer widths of `#![blaze::arbitrary_ints]`.
ra-ap-rustc_ast_ir.workspace = true

# local deps
stdx.workspace = true
intern.workspace = true
base-db.workspace = true
syntax.workspace = true
hir-expand.workspace = true
cfg.workspace = true
tt.workspace = true
span.workspace = true
syntax-bridge.workspace = true
blaze-format.workspace = true
blaze-format-tiers.workspace = true
blaze-dbsp.workspace = true
blaze-ids.workspace = true
blaze-mem.workspace = true
# `blaze_vfs::FILE_DOMAIN` alone: the id a late read of an included file is asked by
# (`deps::late`), the host's answer to a file ask.
blaze-vfs.workspace = true
inventory.workspace = true
blaze-phf.workspace = true
blaze-memo.workspace = true
blaze-record.workspace = true

# XID_Start and XID_Continue: a stability attribute's feature name is an identifier.
blaze-unicode.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-graph.workspace = true
blaze-sim.workspace = true
fst.workspace = true
# The census of std's surfaces (`deps::std_census`): the one gather (`gather::gather`), the
# tool id it is keyed under, and std's graph, cfg and target data from the one source the
# command takes them from (`stdlib::cfg`, `stdlib::target`).
blaze-unitkey.workspace = true
blaze-keyed.workspace = true

# local deps
test-utils.workspace = true
hir-expand = { workspace = true, features = ["fixture"] }

[lints]
workspace = true
