[package]
name = "blaze-tree"
description = "cargo tree, made by blaze: cargo's graph of packages and features, built on blaze-resolve's resolve and printed as cargo prints it"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
blaze-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
blaze-format.workspace = true
blaze-ids.workspace = true
blaze-manifest.workspace = true
blaze-metadata.workspace = true
blaze-query.workspace = true
blaze-resolve.workspace = true
blaze-units = { workspace = true, features = ["query"] }

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-vfs.workspace = true

[lints]
workspace = true
