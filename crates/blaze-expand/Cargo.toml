[package]
name = "blaze-expand"
description = "Macro expansion for the item layer (docs/v2/plan/design/bottom.md, `Expansion` and `MacroDef`): one pure function from a macro's definition and one call's tokens to a portable expansion record, its key, its outside reads and its errors as values"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# `ContentId`, `CrateItemKey`, `ItemKey`, `Portable`: what a record names a crate, a module
# and a definition's content by.
blaze-id.workspace = true
# `Writer`, `Slice`, `open_as`, `leb`: the expansion's stored record (its columns, read back).
blaze-format.workspace = true
# The schema's words (`Edition`, `CallShape`, `Range`, `MacroKind` and the builtin and proc
# macro names) and the `MacroDef` record a `MacroDefinition` is written to and read from.
blaze-surface.workspace = true
# `Vec`: every owning collection, in the allocator the caller names.
blaze-own.workspace = true
# `Hasher`: the keys and a definition's content hash.
blaze-ids.workspace = true
# `frame::task`: the task frame mbe writes its output tree into.
blaze-mem.workspace = true
# `DeclarativeMacro`: the matcher and transcriber of `macro_rules!` and `macro`, driven pure.
mbe.workspace = true
# The token trees mbe and the derives read and write, converted to and from the portable form.
tt.workspace = true
span.workspace = true
intern.workspace = true
# `parse_to_token_tree`: text to tokens, for `lex_through_tt`; `is_single_token_op`.
syntax-bridge.workspace = true
# `LexedStr`: the lexer's kinds and lengths, which `lex` reads straight into a stream.
parser.workspace = true

[dev-dependencies]
blaze-sim.workspace = true
# `Alloc::global()`: the tests' handle.
blaze-own = { workspace = true, features = ["std"] }

[lints]
workspace = true
