[package]
name = "blaze-front"
description = "The front end's tasks under the keyed driver (docs/v2/plan/design/host.md, read-addressed.md): a unit's Surface record and a body's Body record, each read-addressed (its shape asked through Universe::answer, filed by record::write_read); sans-IO"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# The kinds, keys, records, fact ids and the one answer the tasks read and write.
blaze-keyed.workspace = true
blaze-ids.workspace = true
blaze-format.workspace = true
# The database and the edit a surface is given in.
base-db.workspace = true
# The front end the tasks run.
hir-expand.workspace = true
hir-def.workspace = true
hir-ty.workspace = true
hir-ty-borrowck.workspace = true
# A body's own effect summary, a fact it makes.
hir-ty-pure.workspace = true
# A body's identity and the classification of what its check read into facts.
blaze-item-hash.workspace = true
blaze-items.workspace = true
# What a late read answers (`outside::var_answer`, `outside::file_answer`): the one rule the
# host's outside table and a task's check of what its expansions saw share.
blaze-host.workspace = true
# The spans of the surface task (`surface: ...`): where a unit's surface spends its time.
tracing.workspace = true
# Who read a row a body task refused (`record_readers`), told on that failure alone; and
# `Reads::Kept`, the body tests' database marking item boundaries as the command's does.
blaze-memo.workspace = true
# The text of a refused task's lines, in an allocator named where it is made.
blaze-mem.workspace = true

[dev-dependencies]
# The seeds of the body task's model tests.
blaze-rng.workspace = true
# The fixture database the tests build crates in.
hir-expand = { workspace = true, features = ["fixture"] }

[lints]
workspace = true
