[package]
name = "blaze-ci"
description = "blaze v2's CI on the project's warm VM: a webhook for a push or PR opens a view on the running daemon, builds its diff and posts check runs; the release train, latest wins"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[[bin]]
name = "blaze-ci"
path = "src/bin/blaze-ci.rs"

[dependencies]
base64.workspace = true
blaze-api.workspace = true
blaze-core.workspace = true
blaze-format.workspace = true
blaze-hash.workspace = true
blaze-ids.workspace = true
blaze-protocol.workspace = true
blaze-vfs.workspace = true
crossbeam-channel.workspace = true
hashbrown.workspace = true
parking_lot.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sonic-rs.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-query.workspace = true
blaze-spin.workspace = true

[lints]
workspace = true
