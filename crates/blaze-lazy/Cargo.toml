[package]
name = "blaze-lazy"
description = "blaze v2's lazy compilation: a run compiles only the functions that execute; every other function is a stub whose first call fetches its code: the stubs and resolver, the single-flight fetcher, the plan of what is compiled ahead"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-core.workspace = true
blaze-bytes.workspace = true
blaze-hash.workspace = true
blaze-inproc.workspace = true
blaze-codegen.workspace = true
blaze-ids.workspace = true
blaze-items.workspace = true
blaze-mem.workspace = true
blaze-spin.workspace = true
# Tier-up: when a run's code is recompiled at a higher tier (`blaze_stencil::tier`).
blaze-stencil.workspace = true
crossbeam-queue.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-cas.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
