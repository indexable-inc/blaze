[package]
name = "hir-ty-coherence"
version = "0.0.0"
repository.workspace = true
description = "blaze's sealed-trait relaxation of the orphan rules (`#[blaze::sealed]`): the checks that keep it coherent."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
either.workspace = true
tracing.workspace = true

rustc_type_ir.workspace = true

# local deps
base-db.workspace = true
blaze-mem.workspace = true
hir-def.workspace = true
hir-ty.workspace = true

[dev-dependencies]
blaze-query.workspace = true
# The tests' database links hir-ty-mir for the MIR providers.
hir-ty-mir.workspace = true
hir-expand = { workspace = true, features = ["fixture"] }

[lints]
workspace = true
