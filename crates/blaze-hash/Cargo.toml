[package]
name = "blaze-hash"
description = "blaze v2's in-memory hashing: maps and sets on a port of foldhash with a fixed seed, and the identity hasher for keys that are hashes already"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

# Adapters to crates from outside the workspace, which the crates above turn on (the root
# manifest's `blaze-hash` entry): with none on, this crate's dependencies are blaze-own and
# blaze-swiss, workspace crates with no dependency from outside it (docs/v2/plan/design/bottom.md,
# "Also decided on 2026-11-15").
[features]
# serde's forms of `Map` and `Set`, written by hand in `hash_map` and `hash_set`.
serde = ["dep:serde"]
# `SharedMap`, `SharedSet` and `SharedByHash`: papaya's lock-free tables on these hashers.
shared = ["dep:papaya"]

[dependencies]
blaze-own.workspace = true
blaze-swiss.workspace = true
papaya = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-sim.workspace = true
# What `fold` is a port of: `fold_is_foldhash` holds it to this, and `hash_cost` measures its
# random-seeded form.
foldhash.workspace = true
# What `IndexMap` replaces: the other side of `collections_cost`'s rows.
indexmap.workspace = true

[lints]
workspace = true
