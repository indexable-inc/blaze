[package]
name = "hir-firewall"
description = "A body edit recomputes nothing of the crates that depend on its crate: edits one function body at a time and checks that no query homed in a dependent crate runs again and that the code compiled again is that function's"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-hash.workspace = true
blaze-memo.workspace = true

base-db.workspace = true
blaze-codegen.workspace = true
blaze-ids.workspace = true
hir.workspace = true
hir-def.workspace = true
hir-expand.workspace = true
hir-ty.workspace = true
hir-ty-codegen.workspace = true
hir-ty-share.workspace = true
syntax.workspace = true

[dev-dependencies]
blaze-macro-eval.workspace = true
# tests/real.rs plans the build with blaze-units' engine (`Config`, `Database`, `MemTree`).
blaze-query.workspace = true
blaze-serde.workspace = true
blaze-sim.workspace = true
blaze-units.workspace = true
blaze-vfs.workspace = true
blaze-lower.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
hir-expand = { workspace = true, features = ["fixture"] }

# One fixture crate of many bodies, one body edited at a time: the time to check the crate
# again against the bound (docs/v2/plan/design/item-hash.md); prints a verdict.
[[bench]]
name = "edit"
harness = false

[lints]
workspace = true
