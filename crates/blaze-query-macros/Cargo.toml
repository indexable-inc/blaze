[package]
name = "blaze-query-macros"
description = "blaze-query's front-end attributes: #[tracked], #[input], #[interned], derive(Supertype) and derive(Value), over blaze_query::db"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
proc-macro = true
doctest = false

[dependencies]
blaze-hash.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "extra-traits", "visit", "visit-mut"] }

[dev-dependencies]
blaze-query.workspace = true

[lints]
workspace = true
