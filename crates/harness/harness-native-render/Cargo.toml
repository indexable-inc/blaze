[package]
name = "harness-native-render"
description = "The native stack's renderer, shared by the harness app and harness-video: Metal (Slang shaders), den's text shaper and glyph atlas, Slug vector marks, and the paint pass that turns a flecs UI world's painted nodes into one frame's Draw"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[dependencies]
harness-native-flecs = { path = "../harness-native-flecs" }
harness-native-api = { path = "../harness-native-api" }
harness-native-blaze = { path = "../harness-native-blaze" }
harness-native-ui-node-api = { path = "../harness-native-ui-node-api" }
harness-native-ui-layout-api = { path = "../harness-native-ui-layout-api" }
harness-native-ui-layout = { path = "../harness-native-ui-layout" }
harness-native-ui-look-api = { path = "../harness-native-ui-look-api" }
harness-native-ui-text-api = { path = "../harness-native-ui-text-api" }
harness-native-ui-motion-api = { path = "../harness-native-ui-motion-api" }
harness-native-ui-draw-api = { path = "../harness-native-ui-draw-api" }
harness-native-ui-draw = { path = "../harness-native-ui-draw" }
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
libc = "0.2"
# den's typesetter: HarfRust shapes, read-fonts reads, ICU4X breaks, unicode-bidi orders. Pinned exactly as den pins them.
harfrust = "=0.14.0"
read-fonts = "=0.45.0"
icu_segmenter = "=2.3.0"
icu_properties = "=2.3.0"
unicode-bidi = "=0.3.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-core-text = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"
block2 = "0.6"

[lints.rust]
unsafe_code = "allow"
