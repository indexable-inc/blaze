[package]
name = "harness-native-render"
description = "The native stack's renderer, shared by the harness app and harness-video: Metal (shaders in Slang and in Rust, harness-native-shaders), den's text shaper and glyph atlas, Slug vector marks, and the paint pass that turns a flecs UI world's painted nodes into one frame's Draw"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[dependencies]
harness-native-flecs = { path = "../harness-native-flecs" }
harness-native-api = { path = "../harness-native-api" }
harness-native-blaze = { path = "../harness-native-blaze" }
harness-native-kip = { path = "../harness-native-kip" }
# Kip's shaders (src/kip.rs): `artifact = "gpu"` is blaze's device build of the crate for `naga-unknown-unknown`, its
# entries lowered to MSL and the file named in BLAZE_GPU_MSL_HARNESS_NATIVE_SHADERS; `lib = true` also links its host
# library, whose slots (`mascot::<entry>::<param>`) and types the host binds by. A blaze extension: cargo refuses it.
harness-native-shaders = { path = "../harness-native-shaders", artifact = "gpu", lib = true }
harness-native-ui-timeline-api = { path = "../harness-native-ui-timeline-api" }
tree-sitter-highlight = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter = "0.25"
harness-native-ui-node-api = { path = "../harness-native-ui-node-api" }
harness-native-ui-input-api = { path = "../harness-native-ui-input-api" }
harness-native-ui-layout-api = { path = "../harness-native-ui-layout-api" }
harness-native-ui-layout = { path = "../harness-native-ui-layout" }
harness-native-ui-look-api = { path = "../harness-native-ui-look-api" }
harness-native-ui-text-api = { path = "../harness-native-ui-text-api" }
harness-native-ui-inline = { path = "../harness-native-ui-inline" }
harness-native-ui-motion-api = { path = "../harness-native-ui-motion-api" }
harness-native-ui-draw-api = { path = "../harness-native-ui-draw-api" }
harness-native-ui-draw = { path = "../harness-native-ui-draw" }
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
libc = "0.2"
# den's typesetter: HarfRust shapes, read-fonts reads, ICU4X breaks, unicode-bidi orders. Pinned exactly as den pins them.
harfrust = "=0.14.0"
read-fonts = "=0.45.0"
icu_segmenter = "=2.3.0"
icu_properties = "=2.3.0"
unicode-bidi = "=0.3.18"
# LaTeX math (math.rs): RaTeX, a pure-Rust port of KaTeX's parser and layout, gives a display list of positioned
# glyphs, rules and outlines that the painter draws itself. Pinned exactly: it is 0.x and its layout moves between patch releases.
# Only the four crates the typesetter's API is in are named; their own (ratex-lexer and a few small ones) come with them.
ratex-types = "=0.1.14"
ratex-font = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-core-text = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"
block2 = "0.6"
# The embedded browser's frames (media/browser.rs): IOSurfaces over Mach ports.
harness-mach = { path = "../harness-mach" }
# Video elements (media/video.rs): AVPlayer, its item's video output, CoreVideo's Metal texture cache. Default features off:
# their defaults pull in crates (MediaToolbox, CoreAudio...) the player never uses.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVAsset", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "objc2-core-foundation", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime", "objc2"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVMetalTexture", "CVMetalTextureCache", "CVReturn", "objc2", "objc2-metal"] }

[dev-dependencies]
# shader_port.rs checks harness-native-shaders' port of shaders/harness.slang against this crate's structs, binding table
# and HDR curves until it replaces the Slang.
gpu = { path = "../../gpu" }
# Property tests: Hegel, imported as `hegel` (blaze's vendor/hegeltest).
hegeltest = { path = "../../../vendor/hegeltest", default-features = false, features = ["static-engine"] }

[lints.rust]
unsafe_code = "allow"
