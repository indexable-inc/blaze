[package]
name = "harness-proto"
description = "The one versioned schema harness's daemon, its clients and its chat logs speak: typed messages and chat events in deterministic CBOR, framed"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
ciborium = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"], optional = true }

[features]
tokio = ["dep:tokio"]
