[package]
name = "harness"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
crossterm = "0.29.0"
libc = "0.2.191"
parking_lot = "0.12.5"
parquet = { version = "60.1.0", default-features = false, features = ["zstd"] }
portable-pty = "0.9.0"
ratatui = "0.30.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
harness-vt = { path = "../harness-vt" }
harness-chat = { path = "../harness-chat" }
harness-proto = { path = "../harness-proto", features = ["tokio"] }
