[package]
name = "harness-native-ui-view"
description = "Views as entity trees: build and keep node trees of primitive and composite prefabs from a feature module (copied from den, github.com/andrewgazelka/den)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
harness-native-flecs = { path = "../harness-native-flecs" }
harness-native-ui-input-api = { path = "../harness-native-ui-input-api" }
harness-native-ui-layout-api = { path = "../harness-native-ui-layout-api" }
harness-native-ui-node-api = { path = "../harness-native-ui-node-api" }
harness-native-ui-text-api = { path = "../harness-native-ui-text-api" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
