[package]
name = "hyperion-flecs-c"
description = "Compiles the vendored flecs v4.2.0 amalgamation (vendor/flecs, from indexable-inc/flecs indexable/v4.2; custom build: core plus log, addons by feature) with cc, -O2, for the host and for wasm32-unknown-unknown (with the small C library in wasm-libc/)."
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
links = "denflecs"
build = "build.rs"

[features]
# Core features that flecs 4.2 moved out of the core into addons (all were core in 4.1).
prefab = []
constraint_traits = []
cached_queries = []
query_plans = []
system = []
pipeline = ["system", "cached_queries", "query_plans"]
meta = []
script = ["meta"]
json = ["meta"]
# flecs.script.input (the on.click / on.enter async events) and the async/await it needs.
script_input = ["script"]
# The REST API (flecs.dev/explorer, the Flecs Shell) with the world and pipeline statistics it reports, and the script shell
# it runs commands in. Compiled in only; a host turns it on at run time.
rest = ["pipeline", "json", "script"]

[build-dependencies]
cc = "1"
