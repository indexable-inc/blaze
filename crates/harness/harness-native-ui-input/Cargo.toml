[package]
name = "harness-native-ui-input"
description = "Hot-swappable hit testing over Laid: sets Hovered, Pressed and Focused, emits Activated (copied from den, github.com/andrewgazelka/den)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false


[dependencies]
harness-native-flecs = { path = "../harness-native-flecs" }
harness-native-api = { path = "../harness-native-api" }
harness-native-ui-node-api = { path = "../harness-native-ui-node-api" }
harness-native-ui-input-api = { path = "../harness-native-ui-input-api" }
harness-native-ui-motion-api = { path = "../harness-native-ui-motion-api" }
harness-native-ui-layout-api = { path = "../harness-native-ui-layout-api" }
harness-native-ui-spring-api = { path = "../harness-native-ui-spring-api" }

[lints.rust]
# The module exports are `no_mangle` statics and `extern "C"` fns (harness-native-api `module!`).
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "warn"
