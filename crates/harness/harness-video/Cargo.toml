[package]
name = "harness-video"
description = "Renders a video from a flecs scene: the native stack's UI (prims, layout, motion, draw) on a fixed frame clock, a timeline of Cues as data, Metal offscreen, encoded by ffmpeg"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "harness-video"
path = "src/main.rs"

[dependencies]
harness-native-flecs = { path = "../harness-native-flecs", features = ["json"] }
harness-native-ecs = { path = "../harness-native-ecs" }
harness-native-api = { path = "../harness-native-api" }
harness-native-render = { path = "../harness-native-render" }
harness-native-ui-node-api = { path = "../harness-native-ui-node-api" }
harness-native-ui-layout-api = { path = "../harness-native-ui-layout-api" }
harness-native-ui-layout = { path = "../harness-native-ui-layout" }
harness-native-ui-input-api = { path = "../harness-native-ui-input-api" }
harness-native-ui-input = { path = "../harness-native-ui-input" }
harness-native-ui-motion = { path = "../harness-native-ui-motion" }
harness-native-ui-draw-api = { path = "../harness-native-ui-draw-api" }
harness-native-ui-draw = { path = "../harness-native-ui-draw" }
harness-native-ui-prims = { path = "../harness-native-ui-prims" }
harness-native-ui-timeline-api = { path = "../harness-native-ui-timeline-api" }
harness-native-ui-timeline = { path = "../harness-native-ui-timeline" }
hyperion-ecs = { path = "../vendor/hyperion-ecs", features = ["pipeline", "meta"] }
hyperion-flecs-c = { path = "../vendor/hyperion-flecs-c", features = ["prefab", "constraint_traits", "pipeline", "script", "script_input"] }
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = "0.3"

[lints.rust]
unsafe_code = "allow"
