[package]
name = "blaze-vim"
description = "Sans-IO, no_std Vim modal editing engine with pluggable TextBuffer and TextObjectResolver traits (words, quotes, delimiters, paragraphs, path/arg/pipeline segments, or AST objects); explicit allocator, zero external dependencies"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-own.workspace = true

[dev-dependencies]
blaze-sim.workspace = true
blaze-own = { workspace = true, features = ["testing"] }

[lints]
workspace = true
