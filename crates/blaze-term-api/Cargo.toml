[package]
name = "blaze-term-api"
description = "Pure no_std, zero-unsafe, sans-IO terminal entity and symbol registry protocol (JSON-RPC, OSC 7770, canonical snapshots)"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
authors = ["blaze contributors"]

[lib]
name = "blaze_term_api"
path = "src/lib.rs"
doctest = false

[dependencies]
blaze-own.workspace = true
blaze-data.workspace = true
blaze-json.workspace = true
blaze-base64.workspace = true
