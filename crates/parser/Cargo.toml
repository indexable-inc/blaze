[package]
name = "parser"
version = "0.0.0"
repository.workspace = true
description = "The Rust parser for rust-analyzer."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
blaze-ids.workspace = true
blaze-mem.workspace = true
blaze-phf.workspace = true
rustc_lexer.workspace = true
stdx.workspace = true
blaze-trace.workspace = true

edition.workspace = true

[dev-dependencies]
blaze-core.workspace = true
test-utils.workspace = true

blaze-alloc-count.workspace = true
blaze-sim.workspace = true

[[bench]]
name = "lex"
harness = false

[features]
# `LexedStr::lexes_alike`, the fast lexer against `rustc_lexer` alone, for the fuzz target; only
# fuzz/ turns it on.
fuzz = []

[lints]
workspace = true
