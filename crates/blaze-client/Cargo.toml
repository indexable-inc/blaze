[package]
name = "blaze-client"
description = "A client of blaze's daemon with no process launch: a sans-IO core that multiplexes requests of the agent API on one connection, a blocking driver over the daemon's Unix socket, and `blaze-fast`, a small command line on it (docs/client.md)"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[[bin]]
name = "blaze-fast"
path = "src/bin/blaze-fast.rs"
test = false

[dependencies]
blaze-api.workspace = true
blaze-core.workspace = true
blaze-protocol.workspace = true
blaze-report.workspace = true
serde = { workspace = true, features = ["derive"] }
sonic-rs.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
blaze-rng.workspace = true
hegeltest.workspace = true

[lints]
workspace = true
