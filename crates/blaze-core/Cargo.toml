[package]
name = "blaze-core"
description = "blaze's sans-IO core: effects a state machine asks for, completions it is given, and the drivers that run them (a deterministic simulation, threads, io_uring)"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-hash.workspace = true
blaze-mem.workspace = true
# `SortedTexts`: a listing's names as one buffer and its ends (`listing`). Already under
# blaze-mem, so no new crate in the graph.
blaze-own.workspace = true
# The channel's queues (`chan`), and the queues the drivers hand work through.
blaze-queue.workspace = true
blaze-radix.workspace = true
blaze-rng.workspace = true
blaze-spin.workspace = true
# `trust::pem`: the PEM bundles of the machine's TLS roots (portable; only reading the system's
# store is per-OS).
blaze-base64.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The one home of system calls (docs/v2/plan/design/sys.md): the drivers move onto it call by
# call, and `libc` above goes when the last has. On macOS its table of calls resolved at first
# use (`blaze_sys::macos::cold`).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
blaze-sys.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Authorization"] }

[target.'cfg(blaze_check)'.dependencies]
blaze-check.workspace = true

[lints]
workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-ids.workspace = true
blaze-sim.workspace = true
