[package]
name = "blaze-core"
description = "blaze's sans-IO core: effects a state machine asks for, completions it is given, and the drivers that run them (a deterministic simulation, threads, io_uring)"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-hash.workspace = true
blaze-mem.workspace = true
blaze-radix.workspace = true
blaze-rng.workspace = true
crossbeam-channel.workspace = true
crossbeam-queue.workspace = true
parking_lot.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The one home of system calls (docs/v2/plan/design/sys.md): the drivers move onto it call by
# call, and `libc` above goes when the last has.
[target.'cfg(target_os = "linux")'.dependencies]
blaze-sys.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Authorization"] }

[target.'cfg(blaze_check)'.dependencies]
blaze-check.workspace = true

[lints]
workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-ids.workspace = true
# The test engine (`blaze_sim::check`): it depends on blaze-rng alone, so nothing circles.
blaze-sim.workspace = true
blaze-spin.workspace = true
hegeltest.workspace = true
