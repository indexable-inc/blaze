[package]
name = "blaze-algebra-body"
description = "Proof-carrying MIR <-> symbolic algebra compiler pass: lifts verified blaze-body numeric functions into blaze-algebra ExprGraphs, applies forward/reverse symbolic differentiation, exact polynomial normalization and e-graph simplification, and splices back into verified blaze-body MIR"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-algebra.workspace = true
blaze-body.workspace = true
blaze-math.workspace = true
blaze-own.workspace = true

[dev-dependencies]
blaze-body-build.workspace = true
blaze-body-lower.workspace = true
blaze-build.workspace = true
blaze-flow-lower.workspace = true
blaze-lir = { workspace = true, features = ["eval"] }
blaze-own = { workspace = true, features = ["testing"] }
blaze-sim.workspace = true
blaze-typeck = { workspace = true, features = ["testing"] }

[lints]
workspace = true
