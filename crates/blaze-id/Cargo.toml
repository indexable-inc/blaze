[package]
name = "blaze-id"
description = "An item's identity: its portable key, the `Portable` bound that keeps snapshot-local ids out of records and long-lived tables, and the two ways between an id and its key (docs/v2/plan/design/identity.md)"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# Doc tests run here, unlike most of the workspace's crates: `Portable`'s refusal of an
# interned id is a `compile_fail` doc test, and its control a doc test that compiles.

[dependencies]
# `ContentId` and `Fingerprint`: the hashes a key is made of.
blaze-ids.workspace = true
# `HashMap`: what a carried table is.
blaze-hash.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
blaze-sim.workspace = true

[lints]
workspace = true
