[package]
name = "blaze-script"
description = "What a repository script needs and nothing of blaze's: the one typed JSON input, JSON written as the Python scripts wrote it, a program run with its output captured. Built by the pinned released blaze, so it depends on no crate of crates/ (docs/v2/plan/design/scripts.md)"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# Both keep a JSON object's and a table's keys in the order they were written, as Python's do.
serde_json = { workspace = true, features = ["preserve_order"] }
toml = { workspace = true, features = ["preserve_order"] }
regex.workspace = true

[lints]
workspace = true
