[package]
name = "blaze-splice"
description = "blaze's patcher: an edit's functions written into the running program or the executable of the last build (ELF, Mach-O, PE and wasm), and a cold build patched onto an empty ELF image"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
blaze-in-place = { path = "../blaze-in-place" }
# What the program reads of a patch for its statics (`lasting.rs`, `macho.rs`).
blaze-live = { path = "../blaze-live" }
memmap2 = "0.9"
object = { version = "0.37", default-features = false, features = ["read", "write", "std", "archive", "elf", "macho", "coff", "pe", "wasm"] }
pdb = "0.8"
rustc-hash.workspace = true
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
sha2 = "0.10"
wasmparser = { version = "0.236", default-features = false, features = ["std"] }
wasm-encoder = { version = "0.244", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
