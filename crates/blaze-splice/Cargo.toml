[package]
name = "blaze-splice"
description = "blaze's splice: an edit's functions written into the executable of the last link, ELF, Mach-O, PE and wasm"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
blaze-in-place = { path = "../blaze-in-place" }
# What the program reads of a patch for its statics (`lasting.rs`, `macho.rs`).
blaze-live = { path = "../blaze-live" }
memmap2 = "0.9"
object = { version = "0.40", default-features = false, features = ["read", "write", "std", "archive", "elf", "macho", "coff", "pe", "wasm"] }
pdb = "0.8"
rustc-hash.workspace = true
sha2 = "0.11"
wasmparser = { version = "0.258", default-features = false, features = ["std"] }
wasm-encoder = { version = "0.258", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
