[package]
name = "blaze-vfs"
description = "blaze v2's source of truth: a content-addressed Merkle tree of every file, named heads, views (a branch, a PR, a CI job as a root), and the journal that makes them durable through blaze-core's effects"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-bytes.workspace = true
blaze-core.workspace = true
blaze-format.workspace = true
blaze-hash.workspace = true
blaze-ids.workspace = true
blaze-image.workspace = true
blaze-mem.workspace = true
blaze-protocol.workspace = true
blaze-reclaim.workspace = true
hashbrown.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
smallvec.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true

[target.'cfg(blaze_check)'.dependencies]
blaze-check.workspace = true

[lints]
workspace = true
