[package]
name = "blaze-protocol"
description = "blaze's wire protocol between the daemon and its clients: length-prefixed frames of deterministic CBOR (RFC 8949 4.2.1)"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
# `cbor::reference`: the codec as it was before it wrote in place and read in one pass, the
# oracle of the differential tests here and in blaze-api. Tests only.
reference = []

[dependencies]
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-fuzz.workspace = true
blaze-hash.workspace = true
blaze-ids.workspace = true
hegeltest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
