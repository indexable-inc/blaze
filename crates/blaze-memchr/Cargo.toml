[package]
name = "blaze-memchr"
description = "blaze's byte search, in place of the crates.io `memchr`: the first or last of one, two or three bytes and the first of a byte string, a vector of lanes at a time (NEON on aarch64, SSE2 on x86-64, eight bytes in a word elsewhere), with memchr's own paths (`memchr`, `memchr2`, `memchr_iter`, `memmem::find_iter`, `memmem::Finder`) so rustc's copied lexer names it unchanged; `no_std`, no dependency from outside the workspace"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# `u32 -> usize` for a lane's index, in place of `as`.
blaze-int.workspace = true

[dev-dependencies]
blaze-sim.workspace = true

[lints]
workspace = true
