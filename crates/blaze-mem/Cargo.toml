[package]
name = "blaze-mem"
description = "blaze v2's memory, the way a game engine manages it: frame allocators per worker, request and revision arenas, pools with worker caches, reserved regions that never move, generational handles, and per-subsystem counters (docs/v2/plan/design/memory.md)"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-reclaim.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(blaze_check)'.dependencies]
blaze-check.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-rng.workspace = true
hegeltest.workspace = true

# Random reads over 1 GiB on base, transparent and reserved huge pages, in page walks per read
# against the bound; prints a verdict.
[[bench]]
name = "huge"
harness = false

# The warm take and give of a `Kept` block, on one thread and several, in ns per pair.
[[bench]]
name = "kept"
harness = false

[lints]
workspace = true

# Every thread's cold-build memory traffic at once (a shared node column, a row heap, frame
# tasks with spans): wall, CPU, faults and every virtual-memory call, with its slowest. An
# example, not a bench: the 0.20261105.4 release refuses every `harness = false` bench target
# ("the root of `kept` (bench test for the host) can't have a module appended").
[[example]]
name = "mm"
