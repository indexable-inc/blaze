[package]
name = "blaze-lints"
description = "clippy's lints, owned by blaze: computed from rust-analyzer's analysis, with clippy's names, levels, groups, configuration and messages"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# The version rustc 1.101 renders its diagnostics with (`rustc_errors`'s
# `annotate_snippet_emitter_writer.rs`), so that ours read byte for byte as clippy's do.
annotate-snippets = "=0.12.17"
cfg.workspace = true
hir.workspace = true
hir-expand.workspace = true
ide-db.workspace = true
intern.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
span.workspace = true
syntax.workspace = true
toml.workspace = true

[dev-dependencies]
expect-test.workspace = true
test-fixture.workspace = true

[lints]
workspace = true
