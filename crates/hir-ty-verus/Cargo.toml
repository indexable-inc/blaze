[package]
name = "hir-ty-verus"
version = "0.0.0"
repository.workspace = true
description = "Formal verification of blaze_verify's native specification clauses: blaze's HIR lowered into Verus's VIR, proved through AIR by Z3 (docs/v2/plan/design/verus.md)."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
blaze-core.workspace = true
blaze-hash.workspace = true
blaze-ids.workspace = true
blaze-query.workspace = true
tracing.workspace = true

rustc_type_ir.workspace = true

# local deps
base-db.workspace = true
hir-def.workspace = true
hir-ty.workspace = true
intern.workspace = true
syntax.workspace = true

# Verus's verifier, vendored (vendor/verus/SOURCE.md); outside the workspace, so by path.
air = { path = "../../vendor/verus/air" }
vir = { path = "../../vendor/verus/vir" }
num-bigint = "0.5.1"

[dev-dependencies]
hir-expand = { workspace = true, features = ["fixture"] }
hir-ty-mir.workspace = true

[lints]
workspace = true
