[package]
name = "blaze-query"
description = "blaze v2's query database: queries keyed by input hashes, a fingerprint on every dependency edge, facts as the narrowest thing a query read, many views at once, and why a query reran"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-bytes.workspace = true
blaze-core.workspace = true
blaze-format.workspace = true
blaze-graph.workspace = true
blaze-hash.workspace = true
blaze-ids.workspace = true
blaze-image.workspace = true
blaze-mem.workspace = true
blaze-protocol.workspace = true
blaze-query-macros.workspace = true
blaze-reclaim.workspace = true
blaze-vfs.workspace = true
either.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
intern.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
smallvec.workspace = true
thin-vec.workspace = true
triomphe.workspace = true

[target.'cfg(blaze_check)'.dependencies]
blaze-check.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
crossbeam-channel.workspace = true
hegeltest.workspace = true

[lints]
workspace = true
