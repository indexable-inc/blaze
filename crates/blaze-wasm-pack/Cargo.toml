[package]
name = "blaze-wasm-pack"
description = "A cargo workspace as one file for blaze's in-browser compiler: made of a front end `blaze serve` lowered, loaded with no cargo"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# No codegen here: `blaze serve` depends on this, and `blaze-wasm`'s `hir-ty-codegen` feature
# must not reach the native build.
[dependencies]
blaze-hash.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
triomphe.workspace = true

base-db.workspace = true
blaze-query.workspace = true
cfg.workspace = true
hir.workspace = true
hir-expand.workspace = true
intern.workspace = true
span.workspace = true
syntax-bridge.workspace = true
tt.workspace = true

[lints]
workspace = true
