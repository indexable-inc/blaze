    { path = "hir_ty_codegen::home::Homes", reason = "one home rule (AGENTS.md rules 21, 30, 31): the crate an instance is compiled in is `hir_ty_mir::mir::home::env_of`, which a codegen `Instance` reaches through `Instance::home_env`; there is no per-task state to thread", allow-invalid = true },
