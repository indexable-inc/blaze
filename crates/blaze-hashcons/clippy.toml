disallowed-methods = [
    { path = "std::process::Command::new", replacement = "toolchain::command", reason = "the latter forces the choice of a working directory" },
    { path = "std::sync::mpsc::channel", replacement = "crossbeam_channel::unbounded", reason = "one channel for every thread handoff: crossbeam's" },
    { path = "std::sync::mpsc::sync_channel", replacement = "crossbeam_channel::bounded", reason = "one channel for every thread handoff: crossbeam's" },
    # AGENTS.md rules 12 and 3: waits go through the scheduler, configuration is typed. Time through the injected clock (rule 14) is `blaze::wall_clock`'s, which knows its paths: clippy refuses a `lint` key here.
    { path = "std::thread::sleep", reason = "on a pool thread a wait goes through the scheduler, elsewhere through a driver's timer (AGENTS.md rule 12)" },
    { path = "std::hint::spin_loop", reason = "the one bounded spin-then-park helper of `blaze_graph` spins (AGENTS.md rules 12 and 18)" },
    { path = "std::thread::spawn", reason = "name the thread, `std::thread::Builder::new().name(..)`: an unnamed thread is unreadable in samples and the profile" },
    { path = "std::thread::scope", reason = "parallel work runs on blaze's one pool (`blaze_graph::par`), which the scheduler prioritises and the profile sees: a scoped thread is a second, unscheduled pool" },
    { path = "std::thread::available_parallelism", reason = "the pool owns the worker count (`blaze_graph`'s workers); a second count sizes work for cores another pool is using" },
    { path = "std::thread::yield_now", reason = "a yield is a spin with no bound: wait through the scheduler, or the bounded spin-then-park helper (AGENTS.md rules 12 and 18)" },
    { path = "std::thread::park", reason = "on a pool thread a wait goes through the scheduler (AGENTS.md rule 12); a driver parks through its own wait" },
    { path = "std::thread::park_timeout", reason = "on a pool thread a wait goes through the scheduler (AGENTS.md rule 12); a driver parks through its own wait" },
    # Rule deadline-waits: a thread blocks in the kernel only through `blaze_core::wait`, on an absolute deadline; the wait module and the IO backends hold the raw calls, each with #[expect(clippy::disallowed_methods, reason = ..)].
