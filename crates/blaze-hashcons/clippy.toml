    { path = "parking_lot::RwLockReadGuard", replacement = "blaze_core::lock::ReadGuard", reason = "named and recorded (docs/v2/plan/design/named-locks.md): blaze's one lock home is `blaze_core::lock`, whose locks take a name and record who waited behind whom on the slow path only; and no lock on the hot path (docs/v2/plan/design/concurrency.md): a lock that must be says why it is never held across a call, with this lint expected on it", allow-invalid = true },
    { path = "parking_lot::RwLockWriteGuard", replacement = "blaze_core::lock::WriteGuard", reason = "named and recorded (docs/v2/plan/design/named-locks.md): blaze's one lock home is `blaze_core::lock`, whose locks take a name and record who waited behind whom on the slow path only; and no lock on the hot path (docs/v2/plan/design/concurrency.md): a lock that must be says why it is never held across a call, with this lint expected on it", allow-invalid = true },
