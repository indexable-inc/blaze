# A hot crate's lints (docs/v2/plan/design/concurrency.md): the root `.clippy.toml`, which clippy
# does not read for a crate that has its own, plus no lock. Keep the first part equal to the root's,
# less `std::sync::{Mutex, RwLock}`, which the second bans with no replacement.
disallowed-types = [
    { path = "std::collections::HashMap", replacement = "blaze_hash::HashMap", reason = "SipHash, seeded per map: blaze's maps are on `blaze_hash`'s fixed hasher, or `blaze_hash::ByHash` for keys that are hashes" },
    { path = "std::collections::HashSet", replacement = "blaze_hash::HashSet", reason = "SipHash, seeded per set: as for `HashMap`" },
    { path = "std::collections::hash_map::RandomState", replacement = "blaze_hash::FixedState", reason = "SipHash, seeded per map" },
    { path = "std::hash::RandomState", replacement = "blaze_hash::FixedState", reason = "SipHash, seeded per map" },
    { path = "rustc_hash::FxHashMap", replacement = "blaze_hash::HashMap", reason = "one hasher for blaze's maps: `blaze_hash`'s, which no key shape makes a worst case", allow-invalid = true },
    { path = "rustc_hash::FxHashSet", replacement = "blaze_hash::HashSet", reason = "one hasher for blaze's maps: `blaze_hash`'s", allow-invalid = true },
    { path = "rustc_hash::FxBuildHasher", replacement = "blaze_hash::FixedState", reason = "one hasher for blaze's maps: `blaze_hash`'s", allow-invalid = true },
    { path = "rustc_hash::FxHasher", replacement = "blaze_hash::FixedHasher", reason = "one hasher for blaze's maps: `blaze_hash`'s", allow-invalid = true },
    { path = "ahash::AHashMap", replacement = "blaze_hash::HashMap", reason = "one hasher for blaze's maps: `blaze_hash`'s", allow-invalid = true },
    { path = "ahash::AHashSet", replacement = "blaze_hash::HashSet", reason = "one hasher for blaze's maps: `blaze_hash`'s", allow-invalid = true },
    { path = "ahash::RandomState", replacement = "blaze_hash::FixedState", reason = "one hasher for blaze's maps: `blaze_hash`'s", allow-invalid = true },
    { path = "ahash::AHasher", replacement = "blaze_hash::FixedHasher", reason = "one hasher for blaze's maps: `blaze_hash`'s", allow-invalid = true },
    { path = "std::sync::Condvar", replacement = "parking_lot::Condvar", reason = "waits on the guard in place, with no poisoning to handle" },
    { path = "std::sync::MutexGuard", replacement = "parking_lot::MutexGuard", reason = "the guard of `parking_lot::Mutex`, which replaces std's" },
    { path = "std::sync::RwLockReadGuard", replacement = "parking_lot::RwLockReadGuard", reason = "the guard of `parking_lot::RwLock`, which replaces std's" },
    { path = "std::sync::RwLockWriteGuard", replacement = "parking_lot::RwLockWriteGuard", reason = "the guard of `parking_lot::RwLock`, which replaces std's" },
    { path = "std::sync::mpsc::Sender", replacement = "crossbeam_channel::Sender", reason = "one channel for every thread handoff: crossbeam's, which also has `select!`, bounded and many-receiver channels" },
    { path = "std::sync::mpsc::SyncSender", replacement = "crossbeam_channel::Sender", reason = "one channel for every thread handoff: crossbeam's, which also has `select!`, bounded and many-receiver channels" },
    { path = "std::sync::mpsc::Receiver", replacement = "crossbeam_channel::Receiver", reason = "one channel for every thread handoff: crossbeam's, which also has `select!`, bounded and many-receiver channels" },
    { path = "std::collections::LinkedList", replacement = "std::collections::VecDeque", reason = "a heap allocation per element and a pointer chase per step" },

    { path = "std::sync::Mutex", reason = "no lock on the hot path (docs/v2/plan/design/concurrency.md): readers publish and load with release and acquire, writers claim slots with a compare-and-swap, and a guard held across a query call can deadlock or invert priorities. A lock that must be is a named type whose comment says why it is never held across a call, with this lint allowed on it" },
    { path = "std::sync::RwLock", reason = "a read writes no shared memory (docs/v2/plan/design/concurrency.md): an RwLock's read side is an atomic write to one shared counter, so readers on every core contend on its cache line. Publish immutable values with one release store and read them with acquire loads" },
    { path = "parking_lot::Mutex", reason = "no lock on the hot path (docs/v2/plan/design/concurrency.md); see std::sync::Mutex", allow-invalid = true },
    { path = "parking_lot::RwLock", reason = "a read writes no shared memory (docs/v2/plan/design/concurrency.md); see std::sync::RwLock", allow-invalid = true },
    { path = "blaze_mem::lock::SpinLock", reason = "no lock on the hot path (docs/v2/plan/design/concurrency.md), and a spin lock has no fairness and no named wait (T4, 2026-11-02); see std::sync::Mutex", allow-invalid = true },
    { path = "dashmap::DashMap", reason = "each shard of a DashMap is an RwLock, so a lookup writes a shared counter (docs/v2/plan/design/concurrency.md). Use an append-only open-addressed table published with release stores", allow-invalid = true },
    # AGENTS.md rule 9, standard-structures: one choice per need.
    { path = "std::sync::OnceLock", reason = "global state: build the value where the program starts (or as a query) and pass it to what needs it; a process-wide singleton (the allocator, the profile ring) says why with #[expect(clippy::disallowed_types, reason = ..)]" },
    { path = "std::sync::LazyLock", reason = "global state: build the value where the program starts (or as a query) and pass it to what needs it; a process-wide singleton (the allocator, the profile ring) says why with #[expect(clippy::disallowed_types, reason = ..)]" },
    { path = "std::cell::OnceCell", reason = "global state: build the value where the program starts (or as a query) and pass it to what needs it; a process-wide singleton (the allocator, the profile ring) says why with #[expect(clippy::disallowed_types, reason = ..)]" },
    { path = "std::cell::LazyCell", reason = "global state: build the value where the program starts (or as a query) and pass it to what needs it; a process-wide singleton (the allocator, the profile ring) says why with #[expect(clippy::disallowed_types, reason = ..)]" },
    { path = "once_cell::sync::Lazy", reason = "global state: build the value where the program starts (or as a query) and pass it to what needs it; a process-wide singleton (the allocator, the profile ring) says why with #[expect(clippy::disallowed_types, reason = ..)]", allow-invalid = true },
    { path = "once_cell::sync::OnceCell", reason = "global state: build the value where the program starts (or as a query) and pass it to what needs it; a process-wide singleton (the allocator, the profile ring) says why with #[expect(clippy::disallowed_types, reason = ..)]", allow-invalid = true },
    { path = "once_cell::unsync::Lazy", reason = "global state: build the value where the program starts (or as a query) and pass it to what needs it; a process-wide singleton (the allocator, the profile ring) says why with #[expect(clippy::disallowed_types, reason = ..)]", allow-invalid = true },
    { path = "once_cell::unsync::OnceCell", reason = "global state: build the value where the program starts (or as a query) and pass it to what needs it; a process-wide singleton (the allocator, the profile ring) says why with #[expect(clippy::disallowed_types, reason = ..)]", allow-invalid = true },
    { path = "std::sync::Barrier", reason = "a pool thread waits through the scheduler (AGENTS.md rule 9): join on a counter or a job" },
    { path = "std::hash::DefaultHasher", replacement = "blaze_hash::FixedHasher", reason = "SipHash: slow, and not `blaze_hash`'s one hasher" },
    { path = "std::collections::hash_map::DefaultHasher", replacement = "blaze_hash::FixedHasher", reason = "SipHash: slow, and not `blaze_hash`'s one hasher" },
    { path = "hir_ty_share::ShareKey", replacement = "hir_ty_identity::CompileIdentity", reason = "one definition of code identity (docs/v2/plan/design/code-identity.md): the share walk is compile identity now", allow-invalid = true },
    { path = "hir_ty_share::ShareInstance", replacement = "hir_ty_identity::Instance", reason = "one definition of code identity (docs/v2/plan/design/code-identity.md): the share walk is compile identity now", allow-invalid = true },
    { path = "hir_ty_share::ShareDef", replacement = "hir_ty_identity::Subject", reason = "one definition of code identity (docs/v2/plan/design/code-identity.md): the share walk is compile identity now", allow-invalid = true },
    { path = "hir_ty_share::BodyOptions", replacement = "hir_ty_identity::Compiled", reason = "one definition of code identity (docs/v2/plan/design/code-identity.md): the share walk is compile identity now", allow-invalid = true },
    { path = "hir_ty_share::OptionsSet", replacement = "hir_ty_identity::OptionsSet", reason = "one definition of code identity (docs/v2/plan/design/code-identity.md): the share walk is compile identity now", allow-invalid = true },
    { path = "hir_ty_codegen::home::Homes", reason = "one home rule (AGENTS.md rules 18, 26, 27): the crate an instance is compiled in is `hir_ty_mir::mir::home::env_of`, which a codegen `Instance` reaches through `Instance::home_env`; there is no per-task state to thread", allow-invalid = true },
]

disallowed-methods = [
    { path = "std::process::Command::new", replacement = "toolchain::command", reason = "the latter forces the choice of a working directory" },
    { path = "std::sync::mpsc::channel", replacement = "crossbeam_channel::unbounded", reason = "one channel for every thread handoff: crossbeam's" },
    { path = "std::sync::mpsc::sync_channel", replacement = "crossbeam_channel::bounded", reason = "one channel for every thread handoff: crossbeam's" },
    # AGENTS.md rules 9 and 3: waits go through the scheduler, configuration is typed. Time through the injected clock (rule 11) is `blaze::wall_clock`'s, which knows its paths: clippy refuses a `lint` key here.
    { path = "std::thread::sleep", reason = "on a pool thread a wait goes through the scheduler, elsewhere through a driver's timer (AGENTS.md rule 9)" },
    { path = "std::hint::spin_loop", reason = "the one bounded spin-then-park helper of `blaze_graph` spins (AGENTS.md rules 9 and 13)" },
    { path = "std::thread::spawn", reason = "name the thread, `std::thread::Builder::new().name(..)`: an unnamed thread is unreadable in samples and the profile" },
    { path = "std::thread::scope", reason = "parallel work runs on blaze's one pool (`blaze_graph::par`), which the scheduler prioritises and the profile sees: a scoped thread is a second, unscheduled pool" },
    { path = "std::thread::available_parallelism", reason = "the pool owns the worker count (`blaze_graph`'s workers); a second count sizes work for cores another pool is using" },
    { path = "std::thread::yield_now", reason = "a yield is a spin with no bound: wait through the scheduler, or the bounded spin-then-park helper (AGENTS.md rules 9 and 13)" },
    { path = "std::thread::park", reason = "on a pool thread a wait goes through the scheduler (AGENTS.md rule 9); a driver parks through its own wait" },
    { path = "std::thread::park_timeout", reason = "on a pool thread a wait goes through the scheduler (AGENTS.md rule 9); a driver parks through its own wait" },
    { path = "std::env::var", reason = "configuration is typed and read once at the entry point, with no default for a missing value (AGENTS.md rule 3)" },
    { path = "std::env::var_os", reason = "configuration is typed and read once at the entry point, with no default for a missing value (AGENTS.md rule 3)" },
    { path = "std::process::exit", reason = "return a typed error from `main`, so destructors and the profile's flush run" },
    { path = "std::mem::forget", replacement = "std::mem::ManuallyDrop::new", reason = "says what it keeps from being dropped" },
    { path = "hir_ty::attach_db", replacement = "blaze_query::db::attach", reason = "one way to attach a database (AGENTS.md rule 26): blaze-query's, part of the task's stack and carried with it across fibers, which hands back the type it was lent", allow-invalid = true },
    { path = "hir_ty::attach_db_allow_change", replacement = "blaze_query::db::attach", reason = "one way to attach a database (AGENTS.md rule 26): blaze-query's, part of the task's stack and carried with it across fibers, which hands back the type it was lent", allow-invalid = true },
    { path = "hir_ty::next_solver::attach_db", replacement = "blaze_query::db::attach", reason = "one way to attach a database (AGENTS.md rule 26): blaze-query's, part of the task's stack and carried with it across fibers, which hands back the type it was lent", allow-invalid = true },
    { path = "hir_ty::next_solver::attach_db_allow_change", replacement = "blaze_query::db::attach", reason = "one way to attach a database (AGENTS.md rule 26): blaze-query's, part of the task's stack and carried with it across fibers, which hands back the type it was lent", allow-invalid = true },
    { path = "hir::attach_db", replacement = "blaze_query::db::attach", reason = "one way to attach a database (AGENTS.md rule 26): blaze-query's, part of the task's stack and carried with it across fibers, which hands back the type it was lent", allow-invalid = true },
    { path = "hir::attach_db_allow_change", replacement = "blaze_query::db::attach", reason = "one way to attach a database (AGENTS.md rule 26): blaze-query's, part of the task's stack and carried with it across fibers, which hands back the type it was lent", allow-invalid = true },
    { path = "hir_ty::with_attached_db", replacement = "blaze_query::db::with_attached_db", reason = "one way to attach a database (AGENTS.md rule 26): blaze-query's, part of the task's stack and carried with it across fibers, which hands back the type it was lent", allow-invalid = true },
    { path = "hir_ty::next_solver::with_attached_db", replacement = "blaze_query::db::with_attached_db", reason = "one way to attach a database (AGENTS.md rule 26): blaze-query's, part of the task's stack and carried with it across fibers, which hands back the type it was lent", allow-invalid = true },
    { path = "hir_ty_share::share_key", replacement = "hir_ty_identity::instance_identity", reason = "one definition of code identity (docs/v2/plan/design/code-identity.md): the share walk is compile identity now", allow-invalid = true },
    { path = "hir_ty_codegen::home::Homes::home", reason = "one home rule (AGENTS.md rules 18, 26, 27): codegen's copy missed the lang-item, feature and macro-only-dependency checks; a codegen `Instance` gets its environment from `Instance::home_env(db, asked)`, which calls `hir_ty_mir::mir::home::env_of`. No machine fix: those take no `&mut self` and different arguments", allow-invalid = true },
    { path = "hir_ty_pure::home::env_of", reason = "one home rule (AGENTS.md rules 18, 26, 27): the rule lives in the front end; in hir-ty-pure call `walk::home_env(db, env, instance)`, elsewhere `hir_ty_mir::mir::home::env_of(db, env, code, args)`. No machine fix: that takes the crate of the instance's code and its arguments, not an instance", allow-invalid = true },
    { path = "hir_ty_pure::home::home", reason = "one home rule (AGENTS.md rules 18, 26, 27): the rule lives in the front end; call `hir_ty_mir::mir::home::home(db, asker, code, args)`. No machine fix: that takes the crate of the instance's code and its arguments, not an instance", allow-invalid = true },
    { path = "hir_ty_pure::home::stands_for", replacement = "hir_ty_mir::mir::home::stands_for", reason = "one home rule (AGENTS.md rules 18, 26, 27): the rule lives in the front end", allow-invalid = true },
    { path = "blaze_codegen::driver::owners::Owner::of", reason = "one ownership rule (AGENTS.md rules 18, 26): an instance's or static's owner for the dependency image is the front end's, `Described::owner` and `DescribedStatic::owner`, which `HirFrontend::workspace` decides (a crate an edit reaches, every crate in a build that links no image); an `Origin` is the settings' concept and says neither. No machine fix: read the described owner instead", allow-invalid = true },
    { path = "blaze_diagnostics::lints::syntax::early::macros::matchers::tokens::Punct::glue", reason = "one copy of rustc's punctuation glue (AGENTS.md rule 26): `tt::glue` / `tt::glue_str`; the matchers' `Punct` reads it through `Punct::glued`. No machine fix: that takes the next character, not a `Punct`", allow-invalid = true },
    { path = "hir_ty_mir::mir::monomorphization::opaque_of_impl", reason = "one model of a trait method's `impl Trait` (AGENTS.md rules 4, 26): it is rustc's synthesized associated type, `hir_ty::rpitit::RpititId`, which normalizes to the impl's item (`hir_ty::rpitit::impl_rpitit_tys`) as any projection does. No machine fix: the solver normalizes the projection, nothing calls a hook", allow-invalid = true },
    { path = "hir_ty::db::HirDatabase::opaque_of_impl", reason = "one model of a trait method's `impl Trait` (AGENTS.md rules 4, 26): the trait's item is a projection the solver normalizes (`hir_ty::rpitit`). No machine fix: normalize the projection", allow-invalid = true },
    { path = "rustc_type_ir::Interner::opaque_of_impl", reason = "the vendor hook (rustc_type_ir patch `0002-opaque-of-impl`, deleted) is gone with the opaque model of a trait method's `impl Trait`: rustc's projection needs none (`hir_ty::rpitit`). No machine fix", allow-invalid = true },
    { path = "hir_ty_codegen::wasm_object::import_symbol", reason = "one home for a wasm import's symbol (AGENTS.md rule 26): `link_name_for` names it `module.field`, as rustc mangles it, and `wasm_import` gives the module and field back. No machine fix: those take the function, not its module and field", allow-invalid = true },
    { path = "hir_ty_codegen::wasm_object::from_elf", reason = "v1's relocatable wasm object writer had no caller: v2 writes wasm modules itself (`hir_ty_codegen::v2`'s wasm writer, `blaze_link`'s wasm link)", allow-invalid = true },
    { path = "blaze_link::stage::uses", reason = "one rule for \"a GOT cell or PLT stub is no user\" (AGENTS.md rule 26): `What::is_linkers_cell`. No machine fix: it is a method of the piece's `What`", allow-invalid = true },
    { path = "blaze_link::state::zeroed", replacement = "crate::model::zeroed", reason = "one rule for which regions have no bytes in the file (AGENTS.md rule 26): `model::zeroed`, beside `model::reserved`", allow-invalid = true },
    { path = "blaze_link::pe::zeroed", replacement = "crate::model::zeroed", reason = "one rule for which regions have no bytes in the file (AGENTS.md rule 26): `model::zeroed`", allow-invalid = true },
    { path = "blaze_link::elf::in_file", reason = "one rule for which regions have no bytes in the file (AGENTS.md rule 26): `!model::zeroed(class)`", allow-invalid = true },
    { path = "blaze_diagnostics::lower::type_must_be_known::crate_name", reason = "one copy of rustc's `tcx.crate_name` in blaze-diagnostics (AGENTS.md rule 26): `Cx::crate_name`. No machine fix: it is a method of the context", allow-invalid = true },
    { path = "hir_def::span_names::crate_name", reason = "one rule for a crate's name (AGENTS.md rules 3, 26): `base_db::Crate::named` where a message, trace or span names a crate, `base_db::Crate::rust_name` (a typed `UnnamedCrate` error) where a path, symbol, key or lookup needs one; never a stand-in name. No machine fix: they are methods of the crate", allow-invalid = true },
    { path = "hir_def::deps::crate_name", reason = "one rule for a crate's name (AGENTS.md rules 3, 26): `base_db::Crate::named` where a message, trace or span names a crate, `base_db::Crate::rust_name` (a typed `UnnamedCrate` error) where a path, symbol, key or lookup needs one; never a stand-in name. No machine fix: they are methods of the crate", allow-invalid = true },
    { path = "hir_def::deps::serve::crate_name", reason = "one rule for a crate's name (AGENTS.md rules 3, 26): `base_db::Crate::named` where a message, trace or span names a crate, `base_db::Crate::rust_name` (a typed `UnnamedCrate` error) where a path, symbol, key or lookup needs one; never a stand-in name. No machine fix: they are methods of the crate", allow-invalid = true },
    { path = "hir_ty_codegen::fncache::crate_name", reason = "one rule for a crate's name (AGENTS.md rules 3, 26): `base_db::Crate::named` where a message, trace or span names a crate, `base_db::Crate::rust_name` (a typed `UnnamedCrate` error) where a path, symbol, key or lookup needs one; never a stand-in name. No machine fix: they are methods of the crate", allow-invalid = true },
    { path = "blaze_items::hash::crate_name", reason = "one rule for a crate's name (AGENTS.md rules 3, 26): `base_db::Crate::named` where a message, trace or span names a crate, `base_db::Crate::rust_name` (a typed `UnnamedCrate` error) where a path, symbol, key or lookup needs one; never a stand-in name. No machine fix: they are methods of the crate", allow-invalid = true },
    { path = "hir_ty_identity::crate_named", reason = "one rule for a crate's name (AGENTS.md rules 3, 26): `base_db::Crate::named` where a message, trace or span names a crate, `base_db::Crate::rust_name` (a typed `UnnamedCrate` error) where a path, symbol, key or lookup needs one; never a stand-in name. No machine fix: they are methods of the crate", allow-invalid = true },
    { path = "blaze_stencil::patch::scan::sign_extend", replacement = "crate::enc::sign_extend", reason = "one copy of sign extension in blaze-stencil (AGENTS.md rule 26): `enc::sign_extend`", allow-invalid = true },
    { path = "blaze_link::pe::Segment::reserve", reason = "one rule for a dev run's reservations (AGENTS.md rule 26): `model::reserved(class)`, or `Segment::Reserve(_)`, which carries the `model::Reserve`. No machine fix: it takes the class, not the segment", allow-invalid = true },
    { path = "blaze_link::macho::Segment::reserves", reason = "one rule for a dev run's reservations (AGENTS.md rule 26): `Segment::Reserve(_)`, which carries the `model::Reserve`, or `model::reserved(class)`. No machine fix: it is a pattern", allow-invalid = true },
]

disallowed-macros = [
    { path = "lazy_static::lazy_static", reason = "global state: build the value where the program starts (or as a query) and pass it to what needs it; a process-wide singleton (the allocator, the profile ring) says why with #[expect(clippy::disallowed_types, reason = ..)]", allow-invalid = true },
    { path = "serde::Serialize", replacement = "blaze_serde::Serialize", reason = "blaze builds with its own derive (no syn, quote or proc-macro2): crates/blaze-serde-derive", allow-invalid = true },
    { path = "serde::Deserialize", replacement = "blaze_serde::Deserialize", reason = "blaze builds with its own derive (no syn, quote or proc-macro2): crates/blaze-serde-derive", allow-invalid = true },
    { path = "serde_derive::Serialize", replacement = "blaze_serde::Serialize", reason = "blaze builds with its own derive (no syn, quote or proc-macro2): crates/blaze-serde-derive", allow-invalid = true },
    { path = "serde_derive::Deserialize", replacement = "blaze_serde::Deserialize", reason = "blaze builds with its own derive (no syn, quote or proc-macro2): crates/blaze-serde-derive", allow-invalid = true },
]
