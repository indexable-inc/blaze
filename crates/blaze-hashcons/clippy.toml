# A hot crate's lints (docs/v2/plan/design/concurrency.md): the root `.clippy.toml`, which clippy
# does not read for a crate that has its own, plus no lock. Keep the first part equal to the root's,
# less `std::sync::{Mutex, RwLock}`, which the second bans with no replacement.
disallowed-types = [
    # Locks: raw ones are banned for `blaze_core::lock`'s, and in a hot crate those are banned too.
    { path = "std::sync::Mutex", replacement = "blaze_core::lock::Lock", reason = "named and recorded (docs/v2/plan/design/named-locks.md): blaze's one lock home is `blaze_core::lock`, whose locks take a name and record who waited behind whom on the slow path only; and no lock on the hot path (docs/v2/plan/design/concurrency.md): a lock that must be says why it is never held across a call, with this lint expected on it" },
    { path = "std::sync::RwLock", replacement = "blaze_core::lock::ReadLock", reason = "named and recorded (docs/v2/plan/design/named-locks.md): blaze's one lock home is `blaze_core::lock`, whose locks take a name and record who waited behind whom on the slow path only; and no lock on the hot path (docs/v2/plan/design/concurrency.md): a lock that must be says why it is never held across a call, with this lint expected on it" },
    { path = "std::sync::Condvar", replacement = "blaze_core::lock::Signal", reason = "named and recorded (docs/v2/plan/design/named-locks.md): blaze's one lock home is `blaze_core::lock`, whose locks take a name and record who waited behind whom on the slow path only; and no lock on the hot path (docs/v2/plan/design/concurrency.md): a lock that must be says why it is never held across a call, with this lint expected on it" },
    { path = "std::sync::MutexGuard", replacement = "blaze_core::lock::LockGuard", reason = "named and recorded (docs/v2/plan/design/named-locks.md): blaze's one lock home is `blaze_core::lock`, whose locks take a name and record who waited behind whom on the slow path only; and no lock on the hot path (docs/v2/plan/design/concurrency.md): a lock that must be says why it is never held across a call, with this lint expected on it" },
    { path = "std::sync::RwLockReadGuard", replacement = "blaze_core::lock::ReadGuard", reason = "named and recorded (docs/v2/plan/design/named-locks.md): blaze's one lock home is `blaze_core::lock`, whose locks take a name and record who waited behind whom on the slow path only; and no lock on the hot path (docs/v2/plan/design/concurrency.md): a lock that must be says why it is never held across a call, with this lint expected on it" },
    { path = "std::sync::RwLockWriteGuard", replacement = "blaze_core::lock::WriteGuard", reason = "named and recorded (docs/v2/plan/design/named-locks.md): blaze's one lock home is `blaze_core::lock`, whose locks take a name and record who waited behind whom on the slow path only; and no lock on the hot path (docs/v2/plan/design/concurrency.md): a lock that must be says why it is never held across a call, with this lint expected on it" },
    { path = "parking_lot::Mutex", replacement = "blaze_core::lock::Lock", reason = "named and recorded (docs/v2/plan/design/named-locks.md): blaze's one lock home is `blaze_core::lock`, whose locks take a name and record who waited behind whom on the slow path only; and no lock on the hot path (docs/v2/plan/design/concurrency.md): a lock that must be says why it is never held across a call, with this lint expected on it", allow-invalid = true },
    { path = "parking_lot::RwLock", replacement = "blaze_core::lock::ReadLock", reason = "named and recorded (docs/v2/plan/design/named-locks.md): blaze's one lock home is `blaze_core::lock`, whose locks take a name and record who waited behind whom on the slow path only; and no lock on the hot path (docs/v2/plan/design/concurrency.md): a lock that must be says why it is never held across a call, with this lint expected on it", allow-invalid = true },
    { path = "parking_lot::Condvar", replacement = "blaze_core::lock::Signal", reason = "named and recorded (docs/v2/plan/design/named-locks.md): blaze's one lock home is `blaze_core::lock`, whose locks take a name and record who waited behind whom on the slow path only; and no lock on the hot path (docs/v2/plan/design/concurrency.md): a lock that must be says why it is never held across a call, with this lint expected on it", allow-invalid = true },
