[package]
name = "blaze-hashcons"
description = "blaze v2's hash-consing of query values: equal values stored once in sharded append-only arenas, compared by ID, their content fingerprint computed once at intern, persisted by content and interned again on load"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-core.workspace = true
blaze-format.workspace = true
# `ContentMap`'s table: a `Map` on `BuildKeyHasher`, keyed by the content ID itself.
blaze-hash.workspace = true
blaze-ids.workspace = true
blaze-mem.workspace = true
blaze-swiss.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
# `testing::heap()`, the allocator `to_bytes` is handed in the tests (D170 C1: no `Global`).
blaze-own = { workspace = true, features = ["testing"] }
blaze-sim.workspace = true

[lints]
workspace = true
