[package]
name = "hir-ty"
version = "0.0.0"
repository.workspace = true
description = "The type system for rust-analyzer."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
blaze-hash.workspace = true
cov-mark.workspace = true
crossbeam-queue.workspace = true
itertools.workspace = true
arrayvec.workspace = true
parking_lot.workspace = true
smallvec.workspace = true
serde.workspace = true
serde_derive.workspace = true
either.workspace = true
tracing = { workspace = true, features = ["attributes"] }
la-arena.workspace = true
triomphe.workspace = true
indexmap.workspace = true
inventory.workspace = true
rustc_apfloat.workspace = true
bitflags.workspace = true

rustc_abi.workspace = true
ra-ap-rustc_index.workspace = true
ra-ap-rustc_ast_ir.workspace = true
rustc_type_ir.workspace = true
rustc_next_trait_solver.workspace = true

# These moved to dev deps if `setup_tracing` was a macro and dependents also
# included these
tracing-subscriber.workspace = true
tracing-tree.workspace = true

# local deps
blaze-dbsp.workspace = true
blaze-format.workspace = true
blaze-hashcons.workspace = true
blaze-ids.workspace = true
blaze-phf.workspace = true
blaze-query.workspace = true
blaze-reclaim.workspace = true
blaze-mem.workspace = true
hashbrown.workspace = true
stdx.workspace = true
macros.workspace = true
intern.workspace = true
cfg.workspace = true
hir-def.workspace = true
hir-expand.workspace = true
base-db.workspace = true
syntax.workspace = true
span.workspace = true
target-features.workspace = true
thin-vec.workspace = true

[target.'cfg(blaze_check)'.dependencies]
blaze-check.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-graph.workspace = true
crossbeam-channel.workspace = true
expect-test.workspace = true
hir-expand = { workspace = true, features = ["fixture"] }

[features]
in-rust-tree = ["hir-expand/in-rust-tree"]

# The impls of a trait for a type in a crate of many dependencies, read from the crates that
# can name both against the walk over every crate; prints both and whether it gains.
[[bench]]
name = "impls"
harness = false

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["serde"]
