[package]
name = "hir-ty-codegen"
description = "blaze's code generator: rust-analyzer's MIR to machine code through Cranelift, LLVM or wasm"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
# The files predate the crate: its root is the module file it was compiled from in hir-ty.
path = "mod.rs"
doctest = false

[dependencies]
blaze-hash.workspace = true
blaze-serde.workspace = true
either.workspace = true
hashbrown.workspace = true
la-arena.workspace = true
parking_lot.workspace = true
postcard.workspace = true
blaze-query.workspace = true
serde.workspace = true
serde_derive.workspace = true
smallvec.workspace = true
tracing.workspace = true
triomphe.workspace = true
rustc-demangle.workspace = true
rustc-stable-hash.workspace = true

rustc_abi.workspace = true
ra-ap-rustc_ast_ir.workspace = true
ra-ap-rustc_index.workspace = true
rustc_type_ir.workspace = true

base-db.workspace = true
cfg.workspace = true
hir-def.workspace = true
hir-expand.workspace = true
hir-ty.workspace = true
hir-ty-mir.workspace = true
hir-ty-identity.workspace = true
hir-ty-share.workspace = true
intern.workspace = true
span.workspace = true
stdx.workspace = true
syntax.workspace = true

blaze-codegen.workspace = true
blaze-core.workspace = true
blaze-format.workspace = true
blaze-ids.workspace = true
blaze-items.workspace = true
blaze-mem.workspace = true
blaze-stencil.workspace = true

cranelift-codegen = { workspace = true, features = ["enable-serde", "x86", "arm64"] }
cranelift-frontend.workspace = true
cranelift-module = { workspace = true, features = ["enable-serde"] }
cranelift-object.workspace = true
target-lexicon.workspace = true
object = { workspace = true, features = ["read", "std", "elf", "macho", "coff"] }
wasm-encoder = { workspace = true, features = ["std"] }
# The LLVM backend, against the LLVM 23 blaze pins (llvm.json, checked by vendor/llvm-sys/pin.rs).
# inkwell's llvm-sys (vendor/llvm-sys) links it statically, with libstdc++ on Linux. Nothing of
# LLVM's calls into libffi, so inkwell need not link it.
inkwell = { workspace = true, features = ["llvm23-1-prefer-static", "target-x86", "target-aarch64", "no-libffi-linking"], optional = true }

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-cas.workspace = true
blaze-v2-proof.workspace = true
blaze-store-check.workspace = true
hegeltest.workspace = true
hir.workspace = true
hir-expand = { workspace = true, features = ["fixture"] }

[features]
llvm = ["dep:inkwell"]
# The LLVM producer of wasm32 code (`llvm.rs` `Machine::create_for`), for an LLVM built with
# the WebAssembly target; the pinned one (llvm.json) is not yet.
llvm-wasm = ["llvm", "inkwell/target-webassembly"]
# The compiler as a WebAssembly module itself: see `crates/blaze-wasm`.
wasm = []

[lints]
workspace = true
