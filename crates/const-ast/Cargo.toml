[package]
name = "const-ast"
version = "0.0.0"
repository.workspace = true
description = "Typed views over a flat syntax tree as const fns, for const macros (docs/future/const-macros.md)."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

# No dependencies: the const evaluator runs this crate's source as part of a const macro's
# crate graph, so it is `no_std` and reads nothing but `core`.
[dependencies]

[dev-dependencies]
syntax.workspace = true

[features]
# `SOURCE`, the crate's own files, for a host to put in a const macro's crate graph (hir-ty-mir
# turns it on). Off in that graph itself, where this source is what the const evaluator runs.
source = []

[lints]
workspace = true
