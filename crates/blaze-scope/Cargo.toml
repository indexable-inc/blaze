[package]
name = "blaze-scope"
description = "Name resolution of the item layer (docs/v2/plan/design/bottom.md, \"Name resolution without resolving a crate\"): a sans-IO machine that computes one module's scope from its own declarations and per-name reads of other modules' scopes, a group machine that solves a cycle of modules found at run time as a least fixpoint, and the read list each scope is valid by"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# `ItemKey`, `CrateItemKey`, `ContentId`: every module, item and crate is named by its key.
blaze-id.workspace = true
# `HashMap`: the machine's single-owner indexes, in the allocator it is made in.
blaze-hash.workspace = true
# The words of the item layer (`Namespace`, `Def`, `Binding`, `Visibility`, ...), the working
# forms of the records the machine reads and writes (`DeclsBuilder`, `CrateRootBuilder`,
# `ScopeBuilder`) and `Items`, which `RecordFacts` reads them through: one home for each.
blaze-surface.workspace = true
# `Vec`: every list of the machine, in the allocator it is made in.
blaze-own.workspace = true

[dev-dependencies]
blaze-sim.workspace = true
# `testing::MemSurface`: the records the fixtures write, read back through `RecordFacts`.
blaze-surface = { workspace = true, features = ["testing"] }

[lints]
workspace = true
