[package]
name = "blaze-http"
description = "blaze's HTTP: an HTTP/1.1 client and an HTTP/3 WebTransport endpoint, each a sans-IO core (deadlines on an injected clock; TLS through rustls, QUIC through quinn-proto), driven on blaze-core's effects"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-own.workspace = true
blaze-core.workspace = true
# A proxy's `Proxy-Authorization: Basic` credentials.
blaze-base64.workspace = true
# The SHA-256 of a pinned certificate (h3's `serverCertificateHashes` check).
blaze-sha256.workspace = true
# quinn-proto's datagram buffers. Under `h3`.
bytes = { workspace = true, optional = true }
# Gzip bodies, decoded as they come.
blaze-deflate.workspace = true
# Requests written and answers read: blaze's own HTTP/1.1 core.
blaze-h1.workspace = true
# Addresses: blaze's checked URL and host-and-port, ASCII only, userinfo refused.
blaze-url.workspace = true
# TLS, sans-IO (`ClientConnection` driven by hand), on ring.
rustls.workspace = true
# QUIC under h3: quinn-proto's sans-IO endpoint and connections, on rustls with ring. Under `h3`.
quinn-proto = { workspace = true, optional = true }

[features]
# HTTP/3 and WebTransport (`h3`): quinn-proto and `bytes`. Off for a program that only fetches
# over HTTP/1.1 (blaze's binary), whose closure is then the TLS stack alone.
h3 = ["dep:quinn-proto", "dep:bytes"]

[dev-dependencies]
# The certificates of the in-memory rustls server the TLS test speaks to and of the h3 pair.
rcgen.workspace = true
# The driver loop's simulation under scheduled wakes (`driver/tests.rs`).
blaze-sim.workspace = true

[lints]
workspace = true
