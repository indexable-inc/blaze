[package]
name = "blaze-http"
description = "blaze's HTTP: an HTTP/1.1 client and an HTTP/3 WebTransport endpoint, each a sans-IO core (deadlines on an injected clock; TLS through rustls, QUIC through quinn-proto) with a thin tokio driver"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-core.workspace = true
# A proxy's `Proxy-Authorization: Basic` credentials.
base64.workspace = true
# The SHA-256 of a pinned certificate (h3's `serverCertificateHashes` check).
blaze-sha256.workspace = true
# quinn-proto's datagram buffers.
bytes.workspace = true
# Gzip bodies, decoded as they come; the pure-Rust backend, as blaze-engine's.
flate2 = { workspace = true, features = ["rust_backend"] }
# A request's method.
http.workspace = true
# An answer's head.
httparse.workspace = true
# TLS, sans-IO (`ClientConnection` driven by hand), on ring.
rustls.workspace = true
# QUIC under h3: quinn-proto's sans-IO endpoint and connections, on rustls with ring.
quinn-proto.workspace = true
# A proxy address's user and password, percent-decoded.
percent-encoding.workspace = true
# The machine's roots (`roots::native`), read once as a client is made; not the core's.
rustls-native-certs.workspace = true
# Addresses and where their redirects lead.
url.workspace = true
# The tokio drivers' sockets, DNS, timers and channels, and h3's `select!`.
tokio = { workspace = true, optional = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[features]
default = []
# `tokio_driver` and `h3::tokio_driver`. Without it the crate is the core alone, with no runtime under it.
tokio = ["dep:tokio"]

[dev-dependencies]
# The certificates of the in-memory rustls server the TLS test speaks to and of the h3 pair.
rcgen.workspace = true

[lints]
workspace = true
