[package]
name = "blaze-fmt"
description = "rustfmt owned by blaze: rustfmt's formatting over rust-analyzer's syntax trees, with no rustc crates"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
# The versions the pinned nightly's rustfmt is built with (rust-lang/rust's Cargo.lock at
# 12433c307): widths, grapheme breaks and the line diff of `--check` are theirs.
annotate-snippets.workspace = true
diff.workspace = true
unicode-segmentation.workspace = true
rustfmt-unicode-width.workspace = true
unicode-properties = { workspace = true, features = ["general-category"] }
itertools.workspace = true
# `required_version` in a rustfmt.toml is a semver requirement.
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

blaze-manifest.workspace = true
intern.workspace = true
parser.workspace = true
# The pinned nightly's lexer, cooked into rustc's tokens by `parse::lexer`.
rustc_lexer.workspace = true
syntax.workspace = true

# `cargo fmt -q` sends rustfmt's standard output to /dev/null, as cargo-fmt does its child's.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
expect-test.workspace = true

[lints]
workspace = true
