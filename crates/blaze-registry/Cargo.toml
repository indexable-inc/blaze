[package]
name = "blaze-registry"
description = "blaze's reading of registries and fetching of sources as cargo 1.99 does them, into cargo's directories and blaze's store, with no cargo"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
blaze-format.workspace = true
blaze-hash.workspace = true
blaze-resolve.workspace = true
blaze-source.workspace = true
# The index's lines and `[source]` replacement, read as the load reads them.
blaze-units.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
semver = { workspace = true, features = ["serde"] }
url.workspace = true
percent-encoding.workspace = true
blaze-sha256.workspace = true
flate2 = { workspace = true, features = ["default"] }
tar.workspace = true
filetime.workspace = true
# Where `.crate` files are kept, by their sha256.
blaze-cas.workspace = true
blaze-ids.workspace = true
# The configuration credentials are read from, as cargo's `GlobalContext` holds it.
blaze-manifest.workspace = true
toml.workspace = true
# The HTTP stack the rest of blaze uses (crates/blaze-engine/Cargo.toml): hyper 1 over rustls with ring.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { workspace = true, features = ["http1", "native-tokio", "ring", "tls12"] }
http-body-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true


[lints]
workspace = true
