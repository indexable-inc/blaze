[package]
name = "blaze-registry"
description = "blaze's reading of registries and fetching of sources as cargo 1.99 does them, into cargo's directories and blaze's store, with no cargo"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
blaze-format.workspace = true
blaze-hash.workspace = true
blaze-resolve.workspace = true
blaze-serde.workspace = true
blaze-source.workspace = true
# The index's lines and `[source]` replacement, read as the load reads them.
blaze-units.workspace = true
parking_lot.workspace = true
# `PackageCacheLock`'s file lock, let go of as it drops.
stdx.workspace = true
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
semver = { workspace = true, features = ["serde"] }
url.workspace = true
percent-encoding.workspace = true
blaze-sha256.workspace = true
flate2 = { workspace = true, features = ["default"] }
tar.workspace = true
filetime.workspace = true
# Where `.crate` files are kept: blaze-fetch's objects in the store, found by their sha256.
blaze-cas.workspace = true
blaze-fetch.workspace = true
# The configuration credentials are read from, as cargo's `GlobalContext` holds it.
blaze-manifest.workspace = true
toml.workspace = true
# The HTTP stack the rest of blaze uses (crates/blaze-engine/Cargo.toml): hyper 1 over rustls with ring.
hyper = { workspace = true, optional = true, features = ["client", "http1"] }
# The method, status and header names `api` asks with, which the seed has without hyper and tokio.
http.workspace = true
http-body-util = { workspace = true, optional = true }
# `http::client`'s own pool of HTTP/1 connections (no hyper-util: it pulls in `tracing`), its TLS
# with the machine's roots, and the socket under both.
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
default = ["net"]
# `http::HyperHttp` over hyper and rustls on ring. Without it (the seed profile, which builds
# offline from vendored sources) every request is `http::NoNet`, naming its URL.
net = [
    "dep:hyper",
    "dep:http-body-util",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio-rustls",
    "dep:tokio",
]

[dev-dependencies]
# The keep-alive server `http::client`'s pool test asks.
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }

[lints]
workspace = true
