[package]
name = "blaze-macro-wasm"
description = "Proc macros compiled to WebAssembly and run by blaze under Wasmtime, as dtolnay's watt runs them: the `proc_macro` that stands in for the standard library's there, and the host it asks"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
tracing.workspace = true
ra-ap-rustc_lexer.workspace = true
rustc-hash.workspace = true
sha2 = "0.10"
# The one `wasmtime` 49's Cranelift names its targets with.
target-lexicon = "0.13"
# The version whose Cranelift is the one hir-ty-codegen compiles with (`cranelift-codegen` 0.136).
wasmtime = { version = "49", default-features = false, features = ["cranelift", "parallel-compilation", "runtime", "std"] }

base-db.workspace = true
salsa.workspace = true
hir-expand.workspace = true
intern.workspace = true
load-cargo.workspace = true
paths.workspace = true
proc-macro-api.workspace = true
blaze-store.workspace = true
span.workspace = true
tt.workspace = true

[lints]
workspace = true
