[package]
name = "blaze-explore"
description = "The explorer's daemon side: the HTTP/3 WebTransport server on 127.0.0.1 that https://ix.dev/explore connects to, pinning its self-signed certificate by hash; builds, spans, tiles, views, SQL over the history and the live feed as Arrow IPC"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[[bin]]
name = "blaze-explore-probe"
path = "src/bin/blaze-explore-probe.rs"
test = false

[dependencies]
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
base64.workspace = true
blaze-hash.workspace = true
blaze-profile.workspace = true
blaze-sha256.workspace = true
blaze-web.workspace = true
crossbeam-channel.workspace = true
rcgen.workspace = true
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
wtransport.workspace = true

[dev-dependencies]
blaze-rng.workspace = true

[lints]
workspace = true
