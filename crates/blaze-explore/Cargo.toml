[package]
name = "blaze-explore"
description = "The explorer's daemon side: the daemon as a source of ix-prof's explorer (the HTTP/3 WebTransport server on 127.0.0.1 that https://ix.dev/explore connects to); the blaze layer: builds, spans, tiles, views, SQL over the history and the flight recorder's live feed"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[[bin]]
name = "blaze-explore-probe"
path = "src/bin/blaze-explore-probe.rs"
test = false

[dependencies]
blaze-core.workspace = true
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
# The downloads in flight, which are tasks of the live feed.
blaze-fetch.workspace = true
blaze-hash.workspace = true
blaze-profile.workspace = true
# The plane's records as tasks (`now::Records`), one conversion with the build's live model.
blaze-protocol.workspace = true
blaze-serde.workspace = true
# The explorer's server, which serves this crate's source.
ix-prof = { workspace = true, features = ["explore"] }
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
# The probe's echo server: blaze-http's sans-IO HTTP/3 core and its tokio driver.
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
blaze-http = { workspace = true, features = ["tokio"] }

[dev-dependencies]
blaze-rng.workspace = true
# A stop that never comes, for the ops' tests.
crossbeam-channel.workspace = true

[lints]
workspace = true
