[package]
name = "blaze-ecs"
description = "Zero-dependency, `#![no_std]`, `#![forbid(unsafe_code)]`, `#![blaze::sans_io]` Flecs 4.2-equivalent relational Entity-Component-System (`World`, generational `Entity`, `(Rel, Target)` pairs with `ChildOf` cascade & `IsA` prefab inheritance, incrementally synced `CachedQuery`, reactive observers, conflict-free phased `Pipeline`, `blaze-data` reflection, sans-IO Explorer HTTP/JSON/TAB API, and Relational ECS UI + WebGPU scene engine); compiles natively to `wasm32-unknown-unknown`"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# Format-neutral values for live component reflection and Explorer JSON/TAB snapshots.
blaze-data.workspace = true
# Explicit integer conversions (zero `as` casts).
blaze-int.workspace = true
# Zero-copy JSON parser and writer for the sans-IO Explorer API and WASM client.
blaze-json.workspace = true
# Deterministic `#![no_std]` math (`sqrt`, etc.) for the ECS force-graph and WebGPU layout.
blaze-math.workspace = true
# Explicit-allocator owning collections (`Vec`, `String`, `Box`, `Alloc`).
blaze-own.workspace = true
# Deterministic TAB snapshots for Explorer `/api/world.tab`.
blaze-tab.workspace = true

[dev-dependencies]
# `blaze_own::testing::heap()`: root allocator for unit and property tests (D102).
blaze-own = { workspace = true, features = ["testing"] }
# Deterministic simulation / property testing oracle.
blaze-sim.workspace = true

[lints]
workspace = true
