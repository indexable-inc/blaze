[package]
name = "blaze-profile"
description = "Where the time of a blaze build goes: the flight recorder, the profile history the daemon writes (spans, child processes, test runs, the client's rows), BLAZE_PROFILE's trace export, the stall watchdog and the CPU sampler"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-arrow-ipc.workspace = true
blaze-columns.workspace = true
blaze-core.workspace = true
blaze-graph.workspace = true
blaze-hash.workspace = true
blaze-ids.workspace = true
blaze-kit.workspace = true
blaze-mem.workspace = true
blaze-own.workspace = true
blaze-parquet.workspace = true
blaze-report.workspace = true
blaze-v2-proof.workspace = true
blaze-queue.workspace = true
ix-prof.workspace = true
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
stdx.workspace = true
blaze-trace.workspace = true

[target.'cfg(unix)'.dependencies]
blaze-sys.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
blaze-sys.workspace = true

[dev-dependencies]
blaze-own = { workspace = true, features = ["testing"] }
blaze-sim.workspace = true

[lints]
workspace = true
