[package]
name = "blaze-format"
description = "blaze v2's zero-copy format: pointer-free, aligned, position-independent records whose bytes in memory are their bytes on disk, each under a versioned schema hash"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# The records, views and writer; this crate re-exports them at their old paths. `alloc` for
# `Writer`'s default and `Persist`. Nothing here may bring a third-party package: compression by
# tier, which needs zstd, is blaze-format-tiers (split out 2026-11-15).
blaze-format-core = { path = "../blaze-format-core", features = ["alloc"] }
# By path, not `.workspace`: the workspace entry turns on blaze-ids' adapter feature (serde),
# which a member's entry cannot turn off.
blaze-ids = { path = "../blaze-ids" }
# The own collections the `_in` forms write into (`blaze_own::Vec<u8, A>`, `String<A>`), in the
# caller's allocator: the bstd move off `alloc`'s.
blaze-own = { path = "../blaze-own" }

[dev-dependencies]
blaze-alloc-count.workspace = true
# `Alloc::global()`, the allocator a test names at its top (blaze-own's `std` feature).
blaze-own = { path = "../blaze-own", features = ["std", "testing"] }
blaze-sim.workspace = true
blaze-v2-proof.workspace = true

[lints]
workspace = true
