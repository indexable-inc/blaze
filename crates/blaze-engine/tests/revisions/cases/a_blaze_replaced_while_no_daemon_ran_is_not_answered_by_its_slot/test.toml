about = "A blaze replaced while no daemon ran does not answer from the slot the old one wrote (track 10, task C): run, run, `blaze stop`, the engine copied over itself (the same bytes under a new inode and times, so its stamp moves), run: the slot's first premise is the engine's stamp, so the client leaves the run to a daemon, which starts, and the output is the built program's. The control of each revision is its expected output altered, which fails."
drivers = ["real"]

[[revision]]
action = "run"
prints = "hello 1, hello 2, hello 3\n"
status = 3
as_built = true

[[revision]]
steps = []
action = "run"
prints = "hello 1, hello 2, hello 3\n"
status = 3
as_built = true

[[revision]]
steps = ["stop", "replace engine"]
action = "run"
prints = "hello 1, hello 2, hello 3\n"
status = 3
as_built = true
starts = 1
daemon_after = true
