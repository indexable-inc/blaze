about = "A body edit makes that function's code again and no other's, runs and verifies a number of engine memos that does not grow with std, and taking it back makes nothing. The first edit after the cold build is known to cost more (rev2); the edits after it (rev4, rev5) are held to the bounds."
drivers = ["sim", "real"]

[[revision]]
action = "run"
prints = "2 4\n"
bytes = true

[[revision]]
action = "run"
prints = "11 4\n"
redone = ["app::f"]
max_executed = 200
max_verified = 2000
link = "spliced"
bytes = true

[revision.known]
"real: max_executed" = "the first body edit after a cold build runs about 785 engine memos (783, 786 and 785 seen on 2026-11-12; 944 and 919 on 2026-11-11), where each edit after it runs 64 (rev4, rev5)"
"real: max_verified" = "the first body edit after a cold build verifies about a million cached results (1,076,506 and 1,076,524 seen on 2026-11-12), where each edit after it verifies 1,735 (rev4, rev5; 6,897 before the link stopped asking a stamp of every body). Why the first edit differs is not found yet"
"real: clean bytes" = "a spliced image is not the bytes of a clean link of the same source: about 2 MB of 158 MB differ, the first at 0xd8 (rule deterministic-output). Part of it is by design: new code goes into the patch room and the old code stays, and `.rela.dyn` keeps each entry in its slot (docs/v2/plan/design/patch-in-place.md); which bytes make up the 2 MB is not measured yet"

