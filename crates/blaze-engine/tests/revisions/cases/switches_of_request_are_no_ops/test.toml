about = "One front end a checkout serves every request of it: build, test, build, test, run, check, release build, dev build, then each again, with no edit between. After the first occurrence of a request, every later one makes no unit again and runs at most the oracle's 2,000 engine memos, whatever was asked between: its units are a view over the crate graph the front end keeps (`blaze_lower::Lowered::relower`), not the front end's identity (2026-11-12: every switch lowered the workspace again, 618,000 to 820,000 memos and 4.5 s on a hello-world). Its control is `a_switch_of_request_with_the_plan_as_identity`."
drivers = ["real"]

