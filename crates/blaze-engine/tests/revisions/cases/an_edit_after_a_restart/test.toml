about = "The first build after `blaze stop` that sees a changed file answers within its bound, makes one function again, prints what a clean build prints, with no panic caught and no store hit that recomputes to other bytes (2026-11-11: it never returned, 55,000 caught panics; and `alloc::vec::from_elem::<u8>` had one code identity and two machine codes after a restart)."
drivers = ["sim", "real"]

[[revision]]
action = "run"
prints = "3 2\n"

[[revision]]
steps = []
action = "run"
prints = "3 2\n"
redone = []

[[revision]]
steps = ["stop", "edit"]
action = "run"
prints = "3 11\n"
redone = ["app::f"]
max_ms = 60000
max_executed = 20000
max_written = 400

[revision.known]
"real: max_executed" = "a restart resolves the workspace's crates from source before the edit is looked at: about 2.3 million rows on hello-world (2026-11-11); expected under 20,000 once a crate is found by its records (docs/v2/plan/design/restore.md, \"Restart reads records (d)\", pieces E and F)"
"real: max_written" = "a restart writes every file of every package of the plan as an input of a new database: 4,722 on hello-world (2026-11-11); expected about 250 and the edited file (the same section, pieces A to D)"

