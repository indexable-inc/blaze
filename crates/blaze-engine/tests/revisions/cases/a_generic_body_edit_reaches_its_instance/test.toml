about = "A generic function of `a` that `c` instantiates: an edit of its body makes the instance again and no other function of `c`, `b` or `a` (each is found by its own code), and the program prints the new value: a library's key holds the bodies it compiles a copy of, so `c`'s record is not found stale. What it does not show yet: `b`, which instantiates nothing of `a`, is made again as a unit too (no function of it), because the interface is one text a crate today; per instance is store.md's `Not built` (1)."
drivers = ["real"]

[[revision]]
action = "run"
args = ["-p", "app"]
prints = "10 10\n"

