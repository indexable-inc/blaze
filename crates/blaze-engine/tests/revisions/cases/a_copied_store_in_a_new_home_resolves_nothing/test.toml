about = "The same sources in another directory, under another home that starts with a copy of the first home's store: the front-end half of `the_same_sources_in_another_directory_under_another_home`. The new daemon has no image, no VFS and no front end of its own; it reads the files once into its tree, makes each crate's key from the plan and those content IDs, finds every crate's front-end records in the copied store (a found record's key and bytes say nothing of where the checkout, the home or the machine's directories are) and so makes no item tree, expands no macro and resolves no crate, the project's own and the standard library's alike. Expected once the lane's pieces are in (the runner's measured numbers replace these): written about 250, executed under 2,000. The planted control (the checkout's path put back into the plan key, so the record is not found) comes with the found record and is not written yet."
drivers = ["real"]

