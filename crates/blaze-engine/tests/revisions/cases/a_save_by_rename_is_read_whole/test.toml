about = "A file saved by writing beside it and renaming over it (an editor's save, `sed -i`), and one truncated and then written, is read with its new bytes (2026-11-11: read as empty, E0601 `main` not found, until written again)."
drivers = ["sim", "real"]

[[revision]]
action = "run"
prints = "2 4\n"

[[revision]]
steps = ["edit by rename"]
action = "run"
prints = "11 4\n"
redone = ["app::f"]

[[revision]]
steps = ["edit by truncate then write"]
action = "run"
prints = "101 4\n"
redone = ["app::f"]

[[revision]]
steps = ["edit by rename"]
action = "build"
redone = ["app::f"]
