max_executed = "a restart resolves every workspace crate from source, and a unit's record is found only by an identity that needs its crate resolved (docs/v2/plan/design/restore.md, \"Restart reads records (d)\", steps 5 and 7; pieces E and F)"
max_written = "a restart writes every file of every package of the plan as an input of a new database (docs/v2/plan/design/restore.md, \"Restart reads records (d)\", step 3; pieces A to D)"
max_ms = "as max_executed: hello-world's first no-op after a restart is 3.9 s (2026-11-11)"
max_ran = "a workspace crate has no records: `eligible` refuses a local crate (docs/v2/plan/design/restore.md, \"Restart reads records (d)\", step 5; piece E)"

