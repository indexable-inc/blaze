about = "The first build after `blaze stop` with nothing changed finds every crate's front-end records by a key made from the plan and the content IDs the VFS holds, the workspace's four crates as the standard library's: it makes no item tree, expands no macro and resolves no crate, writes inputs by the plan's crates and not by their files, makes no unit and misses no record. Then the same after `kill -9`, which leaves what the last answered build stored. Expected once the lane's pieces are in (the runner's measured numbers replace these): written about 250 (about eight inputs a crate of 31, two a source root), executed under 2,000, well under a second. Until then every workspace crate is resolved from source at each restart and each file of the plan is written as an input (restore.md's table of the restart today). The in-process controls (a found record left out, a stale one served) come with the found record and are not written yet."
drivers = ["real"]

