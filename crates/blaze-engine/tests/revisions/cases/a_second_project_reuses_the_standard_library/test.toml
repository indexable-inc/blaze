about = "A second project, in another directory and of another name, built by a daemon that has built one: the standard library's units are the ones the first project's build left, so only the project's own unit misses its record and only its `main` and the program's entry are compiled, whatever the library's size. Until 2026-11-11 every crate of the library held the asking workspace's root when the checkout's path sorted before the library's (`/Users/..`, `/root/..`, `/private/tmp/..`), and each of its 26 units was worked out again; under a path that sorts after it (`/tmp/..`, this driver's on Linux) the library's own root was taken for the workspace's, so there this case passed before the fix too, and blaze-lower's `the_standard_library_is_keyed_the_same_whatever_workspace_builds_it` and `the_workspaces_root_is_never_the_standard_librarys` are what hold the cause."
drivers = ["real"]

[[revision]]
action = "run"
prints = "one\n"

[[revision]]
steps = ["project two", "edit"]
action = "run"
prints = "two\n"
redone = ["main", "two::main"]
max_units = 1
max_records = 1
max_executed = 20000

[revision.known]
max_executed = "each checkout has a front end's database of its own (F1, docs/v2/plan/design/restore.md): the second project's first build runs about 2.3 million engine memos, the library's name resolution, impls and describes again, though it makes no unit of the library (2026-11-11)"

[[revision]]
steps = []
action = "run"
prints = "two\n"
max_units = 0
max_records = 0
