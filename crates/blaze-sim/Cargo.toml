[package]
name = "blaze-sim"
description = "blaze's own test engine and simulation kit (docs/v2/plan/design/sim.md): a case is a function of one tape of labelled, bounded choices where 0 is calm; the tape, the search that shrinks a failing tape and replays it, the driver, and what every simulation shared (answers in flight, planted-bug controls)"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
# test.md "End state: the search itself" (D95): edge values first and the shapes of lists; off until the harvest.
edge-first = []

[dependencies]
# `AString`, `String<A>` and `Alloc`: a drawn name, and the observe block's lines, in the caller's allocator.
blaze-own.workspace = true
# `SplitMix64`: a seeded tape is its stream.
blaze-rng.workspace = true

[dev-dependencies]
# `Alloc::global()`, which the tests name (blaze-own's `std` feature).
blaze-own = { workspace = true, features = ["std"] }

[lints]
workspace = true
