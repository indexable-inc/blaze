[package]
name = "blaze-launcher"
description = "blaze's launcher (docs/v2/plan/design/launcher.md): the process a program runs in under `blaze run` and `blaze test`. The file it runs from is a clone of this binary beside a sidecar naming the program and the socket that serves its code records; it asks for a function's code at its first call"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "blaze-launcher"
path = "src/main.rs"
test = false
doctest = false

# On `std`, not bstd, for the reason blaze-launch's documentation gives.
[dependencies]
blaze-launch.workspace = true
blaze-launch-rt.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
