[package]
name = "blaze-units"
description = "cargo's unit graph made by blaze: the units a build compiles and runs, with their features, profiles and edges, computed from blaze-resolve's resolve and blaze-manifest's workspace with no I/O"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
blaze-format = { workspace = true, optional = true }
blaze-hash.workspace = true
blaze-ids = { workspace = true, optional = true }
blaze-lint-defs.workspace = true
blaze-radix.workspace = true
blaze-protocol = { workspace = true, optional = true }
blaze-query = { workspace = true, optional = true }
blaze-source = { workspace = true, optional = true }
blaze-manifest.workspace = true
blaze-resolve.workspace = true
cargo-util-schemas.workspace = true
rustc-stable-hash = { workspace = true, optional = true }
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
blaze-sha256 = { workspace = true, optional = true }
toml.workspace = true
url.workspace = true

[features]
# The workspace load and the unit graph as queries of blaze's database (`query`), for the
# daemon. Without it the crate reads no file and builds for wasm32-wasip1 (#458).
query = [
    "dep:blaze-format",
    "dep:blaze-ids",
    "dep:blaze-protocol",
    "dep:blaze-query",
    "dep:blaze-source",
    "dep:rustc-stable-hash",
    "dep:blaze-sha256",
]

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-vfs.workspace = true

[lints]
workspace = true
