[package]
name = "blaze-typeck"
description = "blaze's per-body type-check driver, written new (docs/v2/plan/design/typeck.md): one body in, one record out; every outside fact read through a sealed recorder; an explicit work stack in rustc's order; results and diagnostics in portable columns"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

# Zero third-party crates. The traits it needs from `crates/blaze-ty` are defined in `src/ty.rs`
# until that crate exists.
[dependencies]
# `Vec`: every column, queue and the work stack, in the allocator the caller gives; no `alloc`.
blaze-own.workspace = true
# `HashMap` and `ByHash`: the one hash table (rule 30). By path, not the workspace entry, which
# turns on the `serde` and `shared` adapters and with them crates from outside the workspace.
blaze-hash.workspace = true
# The real type context (`infer`): blaze-ty's arena and inference tables, blaze-solve's solver
# over them, and `ItemKey`, the arena's item column.
blaze-ty.workspace = true
blaze-solve.workspace = true
blaze-id.workspace = true
blaze-ids.workspace = true

[features]
# `fixture` (a hand-written world and body builder, on `std`) for `examples/cost.rs`; always on
# under `cfg(test)`.
testing = ["blaze-own/std"]

[dev-dependencies]
# Itself with `testing`, so `examples/cost.rs` builds under a plain `--example cost`.
blaze-typeck = { workspace = true, features = ["testing"] }
# `check`, `control`: the properties of typeck.md, "Proof".
blaze-sim.workspace = true
# `Alloc::global()`: the tests' handle; `testing::Counting`: the overlay's cost test.
blaze-own = { workspace = true, features = ["std", "testing"] }
# The solver's case files and runner (`testing::run`), run over `Terms` by `suite`.
blaze-solve = { workspace = true, features = ["testing"] }

[lints]
workspace = true
