[package]
name = "blaze-std"
description = "bstd, blaze's own capability-based standard library (docs/v2/plan/design/std.md): one Io over blaze-core's drivers and its simulation, capabilities made only from it or by narrowing, a task context (Cx) with a deadline, cancellation, a span and a frame, and memory from named allocators; and the facade over blaze's piece crates (mem, bytes, map, id, sync, cell, sort, digest, record, report, quic, http, test)"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "bstd"
doctest = false

[dependencies]
blaze-core.workspace = true
blaze-mem.workspace = true
blaze-rng.workspace = true
# The facade (lib.rs, "Batteries"): each re-exported under bstd's names, none depending on bstd.
blaze-alloc-count.workspace = true
blaze-bytes.workspace = true
blaze-check.workspace = true
blaze-format.workspace = true
blaze-hash.workspace = true
# `map::ContentMap`: values stored once, by content.
blaze-hashcons.workspace = true
# The sans-IO cores only: its `tokio` feature (the drivers) stays off.
blaze-http.workspace = true
# A request's method, as blaze-http's h1 request writer takes it (`requests::Http::over`).
http.workspace = true
blaze-ids.workspace = true
# `sync`'s new primitives and `par`: Vec, VecDeque, Box, Arc with an allocator always named.
blaze-own.workspace = true
# `out::Held` is a `blaze_text::Put`: `Out::line_with` takes a chain of typed writers.
blaze-text.workspace = true
blaze-phf.workspace = true
blaze-radix.workspace = true
blaze-reclaim.workspace = true
blaze-report.workspace = true
blaze-sha256.workspace = true
blaze-spin.workspace = true
# bstd::image's zlib: inflated straight into the buffer decode sized and limited, and deflated.
blaze-deflate = { workspace = true, optional = true }

# bstd::video's VideoToolbox provider (src/video/videotoolbox.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, optional = true }
objc2-core-media = { workspace = true, optional = true }
objc2-core-video = { workspace = true, optional = true }
objc2-video-toolbox = { workspace = true, optional = true }

# A bstd program pays at start only for what it calls (std.md, "What a program pays for at
# start"): the default is the core a command-line tool needs (files, output, the host's core
# count, frames, threads, time, text, the capabilities with no dependency of their own), and
# each heavy area, with the dependencies it links, is behind its feature. A crate that uses one
# names it in its own manifest.
[features]
default = []
# `bstd::image`: PNG decode and encode, and its zlib.
image = ["dep:blaze-deflate"]
# `bstd::video`: the MP4 muxer, and the HEVC encoder on VideoToolbox on macOS, which links
# VideoToolbox, CoreMedia, CoreVideo, CoreFoundation, IOSurface, libobjc and Foundation.
video = [
    "dep:objc2-core-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-video-toolbox",
]

[dev-dependencies]
blaze-sim.workspace = true

[lints]
workspace = true
