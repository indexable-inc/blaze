[package]
name = "blaze-own"
description = "blaze's own owning types in place of Rust's `alloc` crate: Vec, Box, Arc, Rc, VecDeque, a sorted map and set, a borrow-or-own Cow and a struct-of-arrays vector, each over `core::alloc::Allocator` with no default allocator (`new_in(alloc)` is the only constructor); `no_std`, no `alloc`, no dependencies"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

# Nothing: `core` only. A dependency here would be a dependency of every crate's collections.
[dependencies]

[features]
# `AsRef<OsStr>` and `AsRef<Path>` for `String`, which only this crate may write (the orphan
# rule) and only std has; blaze-mem turns it on.
std = []
# `blaze_own::testing`: allocators that count live blocks and refuse the n-th allocation, and
# `every_failure`, for tests of any crate's allocation-failure paths (a dev-dependency feature).
testing = []

[dev-dependencies]
# The tree's property engine; itself depends only on blaze-rng, which depends on nothing.
blaze-sim.workspace = true

[lints]
workspace = true
