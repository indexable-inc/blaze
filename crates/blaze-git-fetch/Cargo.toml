[package]
name = "blaze-git-fetch"
description = "One commit of a git repository fetched over smart HTTP protocol v2 (ls-refs, fetch with deepen), its packfile read with offset and reference deltas under bounds, object ids by SHA-1 (git's names, never trust), and the commit's files handed out with every name checked"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# The pack's arena, the request bodies and the walk's stack, in the caller's allocator.
blaze-own.workspace = true
# Each pack entry is a zlib stream.
blaze-deflate.workspace = true
# The HTTP client the protocol rides on.
blaze-h1-net.workspace = true
# `Cx` and the checked `Url`.
blaze-std.workspace = true

[dev-dependencies]
# Property tests and planted-bug controls.
blaze-sim.workspace = true

[lints]
workspace = true
