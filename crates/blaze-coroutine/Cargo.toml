[package]
name = "blaze-coroutine"
description = "The coroutine transform (docs/v2/plan/design/coroutines.md): a small form for a body with suspension points as flat tables, which locals are held across a suspension (liveness with borrows), the state's slots and tags, and the rewrite to a resume body and the state's drop glue, over hand-built bodies"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

# core only; the allocator is a value the caller passes in.
[dependencies]
blaze-own.workspace = true
# `bits::Bits`, the one bitset of every dataflow, and `Bound`.
blaze-flow.workspace = true

[dev-dependencies]
# `check`, `control`: the simulation and its planted-bug controls.
blaze-sim.workspace = true

[lints]
workspace = true
