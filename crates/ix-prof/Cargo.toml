[package]
name = "ix-prof"
description = "A profiler for any Rust program, like Go's pprof: CPU samples, a tracing span tree with self CPU time, allocations by stack, named waits; one deterministic .ixprof file, pprof and Chrome exports, a net/http/pprof-style endpoint and a live stream"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
# A library other projects link too (docs/ix-prof.md), each taking what it needs; blaze-engine
# takes `sampler` alone.
default = ["sampler", "layer"]
# The CPU sampler thread (perf_event_open on Linux, thread_suspend on arm64 macOS).
sampler = []
# `ix_prof::layer()`, a `blaze_trace::Sink`.
layer = []
# `/debug/pprof/*` and `/debug/pprof/live` on a loopback port. Its accept loop waits through
# blaze-core's one deadline wait (rule deadline-waits).
http = []
# `ix_prof::explore`: the WebTransport server https://ix.dev/explore connects to on 127.0.0.1, for
# any program with an `explore::Source` (the blaze daemon's is blaze-explore's).
explore = [
  "dep:blaze-base64",
  "dep:blaze-http",
  "blaze-http/h3",
  "dep:blaze-sha256",
  "dep:rcgen",
]

[dependencies]
blaze-own.workspace = true
# pprof bodies, gunzipped (`pprof`).
blaze-deflate.workspace = true
addr2line.workspace = true
# The tables' columns and their Arrow IPC files and streams, in place of arrow-*.
blaze-arrow-ipc.workspace = true
blaze-columns.workspace = true
blake3.workspace = true
# Named locks (blaze_core::lock) and the one deadline wait.
blaze-core.workspace = true
# The dev runtime's stubs and jump table: a function pointer of a blaze dev run is its slot's
# stub, which only the jump table ties to its function (symbols.rs).
blaze-inproc-rt.workspace = true
blaze-queue.workspace = true
# `endian-reader`: `EndianArcSlice`, the reader the symbolizer keeps DWARF in.
gimli = { workspace = true, features = ["endian-reader"] }
object.workspace = true
# The patterns of `peek` and `list` (`blaze_script::regex`).
blaze-script.workspace = true
rustc-demangle.workspace = true
# The explorer's typed headers and what its session reads of a request, serialized and read
# field by field: no JSON map is made in the session core (`explore::session`).
serde.workspace = true
serde_json.workspace = true
blaze-trace.workspace = true
# The explorer (feature `explore`): the certificate's hash in the link (base64url, SHA-256), the
# certificate (rcgen), and the WebTransport server: blaze-http's sans-IO HTTP/3 core and its
# driver loop, run with the explorer's own sans-IO machine (`explore::serving`) on one
# blaze-core driver; the request's stop is a `blaze_core::chan`, and the jobs' results come
# back on a `blaze_queue::SegQueue`. No async runtime.
blaze-base64 = { workspace = true, optional = true }
blaze-http = { workspace = true, optional = true }
blaze-sha256 = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
blaze-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
blaze-sim.workspace = true

[lints]
workspace = true
