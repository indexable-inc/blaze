[package]
name = "ix-prof"
description = "A profiler for any Rust program, like Go's pprof: CPU samples, a tracing span tree with self CPU time, allocations by stack, named waits; one deterministic .ixprof file, pprof and Chrome exports, a net/http/pprof-style endpoint and a live stream"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
# A library other projects link too (docs/ix-prof.md), each taking what it needs; blaze-engine
# takes `sampler` alone.
default = ["sampler", "layer"]
# The CPU sampler thread (perf_event_open on Linux, thread_suspend on arm64 macOS).
sampler = []
# `ix_prof::layer()`, a `tracing_subscriber::Layer`.
layer = ["dep:tracing-subscriber"]
# `/debug/pprof/*` and `/debug/pprof/live` on a loopback port. Its accept loop waits through
# blaze-core's one deadline wait (rule deadline-waits).
http = []
# `ix_prof::explore`: the WebTransport server https://ix.dev/explore connects to on 127.0.0.1, for
# any program with an `explore::Source` (the blaze daemon's is blaze-explore's).
explore = [
  "dep:base64",
  "dep:blaze-http",
  "dep:blaze-sha256",
  "dep:crossbeam-channel",
  "dep:rcgen",
  "dep:tokio",
]

[dependencies]
addr2line.workspace = true
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
blake3.workspace = true
# Named locks (blaze_core::lock) and the one deadline wait.
blaze-core.workspace = true
# The dev runtime's stubs and jump table: a function pointer of a blaze dev run is its slot's
# stub, which only the jump table ties to its function (symbols.rs).
blaze-inproc-rt.workspace = true
crossbeam-queue.workspace = true
flate2 = { workspace = true, features = ["rust_backend"] }
# `endian-reader`: `EndianArcSlice`, the reader the symbolizer keeps DWARF in.
gimli = { workspace = true, features = ["endian-reader"] }
object.workspace = true
regex.workspace = true
rustc-demangle.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
# The explorer (feature `explore`): the certificate's hash in the link (base64url, SHA-256), the
# certificate (rcgen), the request's stop (crossbeam-channel), and the WebTransport server:
# blaze-http's sans-IO HTTP/3 core under its tokio driver (and the tests' client).
base64 = { workspace = true, optional = true }
blaze-http = { workspace = true, optional = true, features = ["tokio"] }
blaze-sha256 = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "net", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
hegeltest.workspace = true

[lints]
workspace = true
