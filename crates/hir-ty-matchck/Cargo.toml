[package]
name = "hir-ty-matchck"
version = "0.0.0"
repository.workspace = true
description = "rustc's match checking (`check_match`) over rust-analyzer's bodies and `rustc_pattern_analysis`."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
smallvec.workspace = true
blaze-query.workspace = true
rustc_apfloat.workspace = true

ra-ap-rustc_pattern_analysis.workspace = true
rustc_type_ir.workspace = true

# local deps
base-db.workspace = true
hir-def.workspace = true
hir-expand.workspace = true
hir-ty.workspace = true
intern.workspace = true
stdx.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
# The tests' database links hir-ty-mir for the MIR providers the constants patterns name need.
hir-ty-mir.workspace = true
hir-expand = { workspace = true, features = ["fixture"] }

[features]
in-rust-tree = ["hir-ty/in-rust-tree"]

[lints]
workspace = true
