[package]
name = "blaze-file-items"
description = "A Rust source file's text to the outline of the items it declares, in one parse with no tree kept: kinds, names, visibilities, item-relative ranges, disambiguators and content hashes (docs/v2/plan/design/bottom.md, `FileItems`)"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# `ContentId` and `Hasher`: an item's content hashes, in named domains.
blaze-ids.workspace = true
# `derive_key_many`: an outline's short digests hashed side by side, one input a vector lane.
blaze-blake3.workspace = true
# `ByHash`: the count of earlier siblings of each kind and name, for the disambiguator.
blaze-hash.workspace = true
# The lexer and the parser's event stream, `SyntaxKind`, and the parser's `Edition`, which
# `outline` makes from the schema's.
parser.workspace = true
# The schema: an outline's value types (`Item`, `ItemDetail`, `Attr`, `SyntaxError`, ...),
# `Range`, `ItemIndex`, `WrittenVis` and `Edition`, defined once there, and the `FileItems`
# record an outline is written as.
blaze-surface.workspace = true
# `Vec`: an outline's columns, in the allocator its caller names; `std` for `Alloc::global`,
# the heap the worker's scratch outline grows in.
blaze-own = { workspace = true, features = ["std"] }
# `scratch::Shelved`: the walk's working vectors and the outline it grows, kept per worker at
# their high-water mark, so the caller's frame holds the outline at its exact size.
blaze-mem.workspace = true
# `tokenize` and `skip_body`: the bodies an outline leaves unlexed; `validate`: the skeleton's
# UTF-8.
blaze-lex.workspace = true
# `memchr`: the end of a shebang line.
blaze-memchr.workspace = true
# `Tokens`, `TokenRange`: an expansion's token record, outlined in place with no text
# (`outline_token_record`, drive.md D122).
blaze-tokens.workspace = true

[dev-dependencies]
blaze-own = { workspace = true, features = ["testing"] }
# `lex`, `token_record`: a test text's tokens as a token record, to outline both ways.
blaze-expand.workspace = true
blaze-sim.workspace = true
# `Aligned`: a record's bytes at the alignment its view reads them at.
blaze-format.workspace = true

[lints]
workspace = true
