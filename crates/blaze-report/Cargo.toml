[package]
name = "blaze-report"
description = "Everything blaze says to a person or an agent as data (a Report: severity, headline, rule, where, facts, what it blocks, fixes, log, causes) and the one renderer of it: a terminal's, plain lines, JSON"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
sonic-rs.workspace = true
toml.workspace = true
unicode-width.workspace = true

[dev-dependencies]
blaze-protocol.workspace = true

[lints]
workspace = true
