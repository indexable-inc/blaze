[package]
name = "blaze-git-meta"
description = "Pure no_std, zero-unsafe, sans-IO git directory last-commit parser, git blame porcelain parser, GitHub identity/avatar resolver, and deterministic avatar cache index codec on blaze-own explicit allocators"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
authors = ["blaze contributors"]

[lib]
name = "blaze_git_meta"
path = "src/lib.rs"
doctest = false

[dependencies]
blaze-own = { path = "../blaze-own" }

[lints]
workspace = true
