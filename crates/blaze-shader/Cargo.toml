[package]
name = "blaze-shader"
description = "blaze's device backend for shaders and GPU kernels (docs/future/gpu/shaders.md): a crate's GPU_ENTRIES read by const eval, the MIR they reach inlined, structured and lowered to naga IR, validated by naga and written as MSL"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-hash.workspace = true
blaze-items.workspace = true
blaze-query.workspace = true
rustc_abi.workspace = true
rustc_type_ir.workspace = true

base-db.workspace = true
hir-def.workspace = true
hir-expand.workspace = true
hir-ty.workspace = true
hir-ty-mir.workspace = true
hir-ty-pure.workspace = true
intern.workspace = true

# naga's IR, validator and writers (MSL for Metal; SPIR-V and WGSL for the other back ends the plan
# names). Pinned exactly: the IR is the backend's interface, and a minor release changes it.
naga = { version = "=30.0.1", features = ["msl-out", "spv-out", "wgsl-out"] }

[dev-dependencies]
expect-test.workspace = true
hegeltest.workspace = true
hir-expand = { workspace = true, features = ["fixture"] }

[lints]
workspace = true
