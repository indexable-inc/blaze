[package]
name = "span"
version = "0.0.0"
repository.workspace = true
description = "File and span related types for rust-analyzer."

rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true


[dependencies]
blaze-hash.workspace = true
blaze-query = { workspace = true, optional = true }
text-size.workspace = true
unicode-width.workspace = true

# local deps
blaze-format.workspace = true
blaze-ids.workspace = true
blaze-mem.workspace = true
syntax.workspace = true
stdx.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
syntax.workspace = true

[features]
default = ["query"]
query = ["dep:blaze-query"]
in-rust-tree = []

[lints]
workspace = true
