[package]
name = "ra-jit-macro-wasm"
description = "Proc macros compiled to WebAssembly and run by ra-jit under Wasmtime, as dtolnay's watt runs them: the `proc_macro` that stands in for the standard library's there, and the host it asks"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
ra-ap-rustc_lexer.workspace = true
rustc-hash.workspace = true
sha2 = "0.10"
# The version whose Cranelift is the one hir-ty-codegen compiles with (`cranelift-codegen` 0.136).
wasmtime = { version = "49", default-features = false, features = ["cranelift", "parallel-compilation", "runtime", "std", "winch"] }

base-db.workspace = true
hir-expand.workspace = true
intern.workspace = true
load-cargo.workspace = true
paths.workspace = true
proc-macro-api.workspace = true
ra-jit-store.workspace = true
span.workspace = true
tt.workspace = true

[lints]
workspace = true
