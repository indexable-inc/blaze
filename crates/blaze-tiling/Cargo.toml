[package]
name = "blaze-tiling"
description = "Pure no_std, zero-unsafe, sans-IO binary-space-partitioning (BSP) workspace, tab, and pane tiling window manager on blaze-own explicit allocators"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
authors = ["blaze contributors"]

[lib]
name = "blaze_tiling"
path = "src/lib.rs"
doctest = false

[dependencies]
blaze-own.workspace = true

[dev-dependencies]
blaze-own = { workspace = true, features = ["testing"] }

[lints]
workspace = true
