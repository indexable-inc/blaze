[package]
name = "blaze-producers"
description = "Each producer's source digest (decision D105, docs/v2/plan/design/producer-id.md): a sans-IO walk over the workspace's manifests and files, given as values, that finds each producer's crates from `[package.metadata.blaze] producer` and digests them; the entry's build step drives it"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

# Only blaze-cli depends on this crate, as a build-dependency (crates/blaze-cli/build/producers.rs).
[dependencies]
# `Row`, `ContentId`, `Hasher`. By path: the workspace entry turns on serde adapters.
blaze-ids = { path = "../blaze-ids" }
# Vec, String, SortedMap, VecDeque in the caller's allocator.
blaze-own.workspace = true
# The manifests and the lock, read from text.
blaze-toml.workspace = true

[dev-dependencies]
# `testing::heap()`: a test's root allocator (D102).
blaze-own = { workspace = true, features = ["std", "testing"] }

[lints]
workspace = true
