[package]
name = "blaze-trace"
description = "blaze's spans and events, the one home (docs/v2/plan/design/no-tracing.md): no_std on blaze-own alone, sites as static data, typed field values, the process's one profile ring (its allowed static, C3) with a sink the program's entry installs and a thread may override, and the `info_span!`/`info!` macros every crate writes; the flight recorder (blaze-profile) is its sink"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[lints]
workspace = true

# blaze-own: the rings' and the capture's collections over a named allocator (C1), and the plant
# seam (`planted`); it depends on blaze-memchr and blaze-int, none of which reaches this crate.
[dependencies]
blaze-own.workspace = true

[features]
# A simulation's clock for the rings (`record::Clock::Sim`); without it a tick is the counter.
sim-clock = []

[dev-dependencies]
# A test's and the example's root allocator capability (`blaze_own::testing::heap`).
blaze-own = { workspace = true, features = ["testing"] }
# Only for examples/cost.rs, the comparison with the crate this one replaces; removed once its
# numbers are in docs/profiling.md.
tracing = { workspace = true, features = ["std"], default-features = false }
