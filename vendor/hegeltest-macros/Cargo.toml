# hegeltest-macros 0.50.3 from indexable-inc/hegel cae7cfa192 (frontends/rust/macros), trimmed for
# blaze: vendor/hegeltest/SOURCE.md.
[package]
name = "hegeltest-macros"
version = "0.50.3"
edition = "2024"
rust-version = "1.86"
license = "MIT"
readme = "README.md"
repository = "https://github.com/indexable-inc/hegel"
homepage = "http://hegel.dev"
description = "Procedural macros for Hegel."
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lints.clippy]
too_many_arguments = "allow"

[lib]
name = "hegel_macros"
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit-mut"] }
