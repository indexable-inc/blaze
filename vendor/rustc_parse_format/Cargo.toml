# rustc's `compiler/rustc_parse_format` at the rustc commit of `harness/toolchain`, as written by
# `tools/v2/solver_sync.py`: `src` is upstream's with the series in `PATCHES.md` replayed on it, and
# `Cargo.toml.orig` is upstream's manifest. This file is upstream's dependencies, with the pinned
# nightly's `rustc_lexer` (`crates/rustc_lexer`) and rust-analyzer's crates.io `rustc_index`.
[package]
name = "rustc_parse_format"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/rust"
publish = false

[lib]
name = "rustc_parse_format"
path = "src/lib.rs"

[dependencies]
rustc-literal-escaper.workspace = true
rustc_lexer.workspace = true

[target.'cfg(target_pointer_width = "64")'.dev-dependencies]
rustc_index.workspace = true
