[package]
name = "vir-macros"
version = "0.1.0"
edition = "2018"
publish = false
description = "Derive macros of Verus's VIR, vendored into blaze (vendor/verus/SOURCE.md)"
license = "MIT"

# Note: do not add any dependencies on rustc -- VIR deliberately abstracts away from rustc's internals
# blaze: versions spelled out, as this crate is outside blaze's workspace.
[dependencies]
synstructure = "0.13.2"
proc-macro2 = "1.0.106"
syn = "2"

[lib]
proc-macro = true
