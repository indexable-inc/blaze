[package]
name = "vir"
version = "0.1.0"
edition = "2024"
publish = false
description = "Verus's Verification Intermediate Representation, vendored into blaze (vendor/verus/SOURCE.md)"
license = "MIT"

# Note: do not add any dependencies on rustc -- VIR deliberately abstracts away from rustc's internals
# blaze: versions spelled out, as this crate is outside blaze's workspace (excluded, like
# vendor/hegeltest); upstream takes them from Verus's.
[dependencies]
air = { path = "../air" }
im = "15.1.0"
indexmap = "2"
num-bigint = { version = "0.5.1", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1", features = ["std", "derive", "rc"] }
sha2 = "0.11"
sise = "0.8.0"
vir-macros = { path = "../vir_macros" }

[features]
singular = ["air/singular"]

# blaze: upstream's workspace lints are Verus's; this crate keeps its own.
[lints.rust]
unexpected_cfgs = "allow"
