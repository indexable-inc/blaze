[package]
name = "air"
version = "0.1.0"
edition = "2018"
publish = false
description = "Verus's Assertion Intermediate Language and its SMT driver, vendored into blaze (vendor/verus/SOURCE.md)"
license = "MIT"

# Note: do not add any dependencies on rustc -- AIR deliberately abstracts away from rustc's internals
# blaze: versions spelled out, as this crate is outside blaze's workspace (excluded, like
# vendor/hegeltest); upstream takes them from Verus's. Dropped with the files that used them:
# `getopts` (the `air` binary), `smt-scope`, `petgraph` and `serde_json` (the profiler's trace
# reader), `yansi` (colored output) and `win32job` (Windows job objects).
[dependencies]
sise = "0.8.0"
serde = { version = "1", features = ["std", "derive", "rc"] }
indexmap = "2"

[features]
singular = []

# blaze: upstream's workspace lints are Verus's; this crate keeps its own.
[lints.rust]
unexpected_cfgs = "allow"
