# rustc's `compiler/rustc_type_ir` at the rustc commit of `harness/toolchain`, as written by
# `tools/v2/solver_sync.py`: `src` is upstream's with the series in `PATCHES.md` replayed on it, and
# `Cargo.toml.orig` is upstream's manifest. This file is upstream's dependencies built as
# rust-analyzer's `ra-ap-rustc_type_ir` builds them: `nightly` off, so the dependencies only it
# needs are left out, and the compiler's own crates are ours (`rustc_abi`,
# `rustc_type_ir_macros`) or rust-analyzer's crates.io releases (`rustc_ast_ir`, `rustc_index`).
[package]
name = "rustc_type_ir"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/rust"
publish = false

[lib]
name = "rustc_type_ir"
path = "src/lib.rs"

[features]
# Needs the compiler's own crates (`rustc_data_structures`, `rustc_macros`, `rustc_span`, ...).
nightly = []

[dependencies]
arrayvec = { version = "0.7", default-features = false }
bitflags = "2.4.1"
# Not upstream's: the solver's global cache keeps its tables in `blaze_mem::blocks` (patch 0010).
blaze-mem.workspace = true
derive-where = "1.6.1"
ena = "0.14.4"
indexmap = "2.0.0"
rustc-hash = "2.0.0"
rustc_abi = { path = "../../crates/rustc_abi", version = "0.0.0", default-features = false }
rustc_ast_ir = { version = "0.179.0", package = "ra-ap-rustc_ast_ir", default-features = false }
rustc_index = { version = "0.179.0", package = "ra-ap-rustc_index", default-features = false }
rustc_type_ir_macros = { path = "../rustc_type_ir_macros", version = "0.0.0" }
smallvec = { version = "1.8.1", default-features = false, features = ["const_generics"] }
thin-vec = "0.2.21"
tracing = "0.1"

[dev-dependencies]
blaze-alloc-count.workspace = true
