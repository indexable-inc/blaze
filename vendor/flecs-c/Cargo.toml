[package]
name = "flecs-c"
description = "Flecs's amalgamated C (the indexable-inc/flecs fork's, pinned below) built with cc, plus the declarations Rust calls it through"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
links = "flecs"

[features]
# Native only: Flecs's REST API (and the HTTP, JSON and pipeline addons it needs) and `glue_rest_*`, a read-only REST
# server a host feeds requests to. wasm32 builds refuse it (build.rs).
rest = []

[build-dependencies]
cc = "1"
# The flecs blaze builds: github.com/indexable-inc/flecs, branch `indexable/v4.2` (v4.2.0 plus the fork's fixes). Its
# `flecs-distr` crate only names distr/flecs.{c,h}; build.rs compiles them. Keep this rev the same as harness's
# (crates/harness/vendor/hyperion-flecs-c/Cargo.toml): tools/check_flecs_pin.py fails when they differ.
flecs-distr = { git = "https://github.com/indexable-inc/flecs", rev = "ab8b8e051c6f8ac014557136c97847941bd3caa0" }
