# blaze: upstream's charon/Cargo.toml trimmed to the library (vendor/charon/SOURCE.md): no binaries,
# tests or build script, the workspace's versions spelled out, and only the dependencies the
# kept sources use.
[package]
name = "charon"
version = "0.1.309"
authors = [
    "Son Ho <hosonmarc@gmail.com>",
    "Guillaume Boisseau <nadrieril+git@gmail.com>",
    "Opale Sjöstedt <opale.sjostedt@gmail.com>",
    "hax Authors",
]
license = "Apache-2.0"
edition = "2024"
publish = false

[lib]
name = "charon_lib"
path = "src/lib.rs"
doctest = false
test = false

[dependencies]
annotate-snippets = { version = "0.12" }
anstream = "0.6.18"
anyhow = "1.0.81"
bitflags = "2.6"
clap = { version = "4.0", features = ["derive", "env"] }
derive_generic_visitor = "1.1.0"
either = "1.15.0"
enum-as-inner = "0.7.0"
env_logger = { version = "0.11", features = ["color"] }
hashbrown = { version = "0.15.0", default-features = false }
indexmap = { version = "2.7.1", features = ["serde"] }
index_vec = { version = "0.1.3", features = ["serde"] }
indoc = "2"
itertools = "0.13"
nom = "7.1.3"
petgraph = "0.8.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rustc-hash = "2"
serde_json = { version = "1.0.91", features = ["unbounded_depth"] }
serde_stacker = "0.1.11"
serde_state_perfect_derive = "1.0.0"
serde = { version = "1.0.152", features = ["derive", "rc"] }
smallvec = "1.15.1"
stacker = "0.1"
take_mut = "0.2.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }
tracing = { version = "0.1", features = ["max_level_trace"] }
ustr = { version = "1.1.0", features = ["serde"] }

[features]
# Never turned on: named so the inert `cfg_attr(feature = "charon_on_charon", ...)` attributes and
# options.rs's `cfg!(feature = "minirust")` refer to known features.
charon_on_charon = []
minirust = []
