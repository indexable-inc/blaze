# Type positions: each alias that hides the hasher becomes the table with its hasher written
# (D125). One rule per alias; each matches the generic type wherever a type stands (a `let`'s
# annotation, a field, a signature, a turbofish, an `impl` header).
id: explicit-hasher-type-hash-map
language: rust
severity: hint
message: "D125: write the hasher; `Map<K, V, FixedState, A>`"
rule:
  pattern: { context: "type T = HashMap<$K, $V, $A>;", selector: generic_type }
fix: "Map<$K, $V, FixedState, $A>"
---
id: explicit-hasher-type-hash-set
language: rust
severity: hint
message: "D125: write the hasher; `Set<T, FixedState, A>`"
rule:
  pattern: { context: "type T = HashSet<$K, $A>;", selector: generic_type }
fix: "Set<$K, FixedState, $A>"
