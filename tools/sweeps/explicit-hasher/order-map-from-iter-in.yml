# Reserves the iterator's lower size hint, as `from_iter_in` did (see map-from-iter-in.yml).
id: explicit-hasher-order-map-from-iter-in
language: rust
severity: hint
message: "D125/D126: write the hasher; `OrderMap::new(OrderMapOpts { .. })` then `extend`"
rule:
  pattern: IndexMap::from_iter_in($I, $A)
fix: |-
  {
      let iter = IntoIterator::into_iter($I);
      let capacity = Some(iter.size_hint().0);
      let mut map = OrderMap::new(OrderMapOpts { hasher: FixedState, alloc: $A, capacity });
      map.extend(iter);
      map
  }
