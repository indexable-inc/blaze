# Reserves the iterator's lower size hint, as `from_iter_in` did (see map-from-iter-in.yml).
id: explicit-hasher-order-set-from-iter-in
language: rust
severity: hint
message: "D125/D126: write the hasher; `OrderSet::new(OrderSetOpts { .. })` then `extend`"
rule:
  pattern: IndexSet::from_iter_in($I, $A)
fix: |-
  {
      let iter = IntoIterator::into_iter($I);
      let capacity = Some(iter.size_hint().0);
      let mut set = OrderSet::new(OrderSetOpts { hasher: FixedState, alloc: $A, capacity });
      set.extend(iter);
      set
  }
