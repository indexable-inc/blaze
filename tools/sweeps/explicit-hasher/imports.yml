# A `use` of one alias alone becomes a `use` of what its rewrites name, from the same path
# (`blaze_hash::`, `bstd::map::`, `bstd::set::`, `crate::`). A use list (`use x::{HashMap, Y}`)
# is not matched: see the README's leftovers. A name the file already imports is then imported
# twice, an error the build names; the README says how to find those.
id: explicit-hasher-use-hash-map
language: rust
severity: hint
message: "D125/D126: import the table, its options and its hasher"
rule:
  pattern: use $P::HashMap;
fix: "use $P::{FixedState, Map, MapOpts};"
---
