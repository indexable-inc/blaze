# Reserves the iterator's lower size hint, as `from_iter_in` did (see map-from-iter-in.yml).
id: explicit-hasher-set-from-iter-in
language: rust
severity: hint
message: "D125/D126: write the hasher; `Set::new(SetOpts { .. })` then `extend`"
rule:
  pattern: HashSet::from_iter_in($I, $A)
fix: |-
  {
      let iter = IntoIterator::into_iter($I);
      let capacity = Some(iter.size_hint().0);
      let mut set = Set::new(SetOpts { hasher: FixedState, alloc: $A, capacity });
      set.extend(iter);
      set
  }
