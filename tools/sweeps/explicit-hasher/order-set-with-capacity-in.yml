id: explicit-hasher-order-set-with-capacity-in
language: rust
severity: hint
message: "D125/D126: write the hasher; `OrderSet::new(OrderSetOpts { hasher: FixedState, alloc, capacity: Some(n) })`"
rule:
  pattern: IndexSet::with_capacity_in($N, $A)
fix: "OrderSet::new(OrderSetOpts { hasher: FixedState, alloc: $A, capacity: Some($N) })"
