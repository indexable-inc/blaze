[workspace]
members = [".", "sys", "edition"]

[package]
name = "smoke"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-utils = "0.8"
crossbeam-deque = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
parking_lot = "0.12"
smoke-sys = { path = "sys" }
