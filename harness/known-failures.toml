# The Rust tests known to fail, each with an owner and a cause (docs/harness.md#ci).
#
# harness/failures.py holds a run to this list: a failing test that is not here fails the run,
# and so does a test here that passes, is ignored or no longer exists (take it out: the list only
# shrinks). harness/unittests.py, CI's test step, calls it on its log; a lane runs it locally:
#
#   uv run --frozen harness/failures.py '{"run": {"runner": "blaze", "packages": ["hir-def"]}}'
#
# One table a crate, `[crates.<package>]`; each test by its full name, `<binary>::<path>` as
# libtest names it under the binary cargo's `Running` line names (`-` as `_`). Each entry:
#   owner  a lane (the handoff in /tmp/blaze-lanes that owns the cause), an issue URL, or
#          "unowned" (failures.py lists those on every run);
#   cause  one line: what fails and why, as far as it is known;
#   only   optional, { runner = "cargo"|"blaze", profile = "dev"|"release", os = "linux"|"macos"|"windows" }:
#          the entry holds only for such a run, and is unchecked by others.
# A failure joins the list only with an owner and a cause, in the change that explains it.

# Where the entries without `only` were measured (AGENTS.md rule measure-the-exact-tree).
[measured]
note = "cargo +nightly-2026-10-27 test, dev profile, macOS arm64, by the lanes' shared runner (libtest JSON per binary, doctests not run); tree is the git tree of /Volumes/Projects/blaze-v2 the runner snapshot"

